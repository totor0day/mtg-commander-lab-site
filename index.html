nclusion_b1_2": 0.5, "power_lift": -0.318, "mentions": 2}, {"card": "Ghoulish Impetus", "inclusion": 0.192, "inclusion_b3plus": 0.182, "inclusion_b1_2": 0.5, "power_lift": -0.318, "mentions": 0}, {"card": "Skyline Despot", "inclusion": 0.158, "inclusion_b3plus": 0.091, "inclusion_b1_2": 0.417, "power_lift": -0.326, "mentions": 1}, {"card": "Master of Ceremonies", "inclusion": 0.175, "inclusion_b3plus": 0.091, "inclusion_b1_2": 0.5, "power_lift": -0.409, "mentions": 0}], "deck_overlap": 0.397}}, {"id": "iroh-tea-master", "meta": {"id": "iroh-tea-master", "name": "Iroh, Tea Master", "commander": "Iroh, Tea Master", "colors": "RW", "featured": false, "trial_label": "Iroh + a gift or giver cast by turn 6", "trial_removed_label": "Iroh removed once", "lists": {"b2": "decks/iroh-tea-master-b2.txt", "b3": "decks/iroh-tea-master-b3.txt"}, "package": "decks/iroh-tea-master-package.json", "pregame": ["This deck gives you things you don't want.", "At the start of my combat, Iroh gives one of you a permanent I control, and I get an Ally token with a +1/+1 counter for each permanent of mine that you hold. Most of what I give away costs you: Jinxed Idol deals you 2 a turn, Steel Golem and Grid Monitor stop you casting creatures, Rust Elemental eats your artifacts, and Akroan Horse gives everyone else a soldier each turn.", "Some gifts help you a little too: Pendant of Prosperity draws us both a card, and Goblin Festival can ping anything until its holder loses a coin flip.", "Disrupt Decorum and Taunt from the Rampart make your creatures attack each other instead of me for a turn.", "Attack me and you may regret it: Deflecting Palm, Comeuppance and Take the Bait send the damage back at you, and Sunforger can fetch them from my library.", "Answers: kill Iroh and the tokens stop. Artifact removal on my gifts shrinks my next token. Jinxed Idol can be passed on by sacrificing a creature.", "There are no infinite combos and no locks. The deck wins with Ally tokens that grow each turn, anthems, and an end-step drain from Throne of the God-Pharaoh."], "how_it_plays_without_the_line": ["The deck runs 7 mana rocks, 5 card-flow cards, 13 interaction spells, 2 goad spells and 4 redirection cards. Without Iroh it still plays as a Boros tokens deck with removal and politics.", "Yes Man, Humble Defector, Stiltzkin, Pendant of Prosperity and Idol of Oblivion turn gifts into cards, and Zidane turns them into Treasure.", "Ghostly Prison, Windborn Muse and Crawlspace slow down the attacks that come back at you, and Sunforger with Deflecting Palm, Comeuppance and Take the Bait turns the big ones around."], "how_it_wins": ["Iroh makes one Ally each turn with a counter for each gift out. Bazaar Trader hands out a second gift each turn, so the tokens grow faster. Abzan Falconer gives every token flying, because each one has a +1/+1 counter.", "Rally the Ranks (naming Ally), Honor of the Pure, Glorious Anthem, Warleader's Call and Heraldic Banner pump the tokens. Shared Animosity adds +1 per other attacking Ally. Throne of the God-Pharaoh drains each opponent at end step for each tapped creature.", "Goad turns the table on itself for a turn while your tokens attack. Brand takes back everything you gave away; Mob Rule and Akroma's Will close the game.", "In the pod model (1,000 seeded games, three generic opponents who attack anyone), this list wins 50% of games; the EDHREC average Iroh deck wins 27%. Once a game is down to one opponent, it wins 62% of the time (average deck: 35%). The redirection rule is generous (it ignores the mana you must hold); with it switched off, the list wins 39%. See Experiments."], "b2_swaps": [{"why": "cost (about $25 less)", "out": "Akroma's Will ($17.89), Crawlspace ($10.55)", "in": "Inspired Charge, Sphere of Safety", "note": "Prices are from the Scryfall snapshot of 2026-11-24."}, {"why": "less luck", "out": "Goblin Festival", "in": "Lightning Bolt", "note": "Removes the coin flips."}, {"why": "less power", "out": "Austere Command, Taunt from the Rampart", "in": "Dawn Charm, Inspired Charge", "note": "No board wipe and one goad spell instead of two."}, {"why": "more power, still Bracket 2", "out": "Outpost Siege, Tocasia's Welcome", "in": "Transcendence, Nine Lives", "note": "Transcendence wins the pod model 3 points more often, but a gift that makes a player with 20 or more life lose at once can feel cheap. Do not add Nine Lives with Austere Command and Harmless Offering in the deck: that is a Spellbook combo."}], "do_not_add": [{"cards": ["Nine Lives"], "reason": "With Austere Command and Harmless Offering, Commander Spellbook lists it as a line that makes an opponent lose.", "card_objs": [{"name": "Nine Lives", "mana_cost": "{1}{W}{W}", "type_line": "Enchantment", "oracle_text": "Hexproof\nIf a source would deal damage to you, prevent that damage and put an incarnation counter on this enchantment.\nWhen there are nine or more incarnation counters on this enchantment, exile it.\nWhen this enchantment leaves the battlefield, you lose the game.", "pt": null, "ci": "W", "cmc": 3.0, "price_usd": 0.54, "game_changer": false, "edhrec_rank": 6342, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "large": "https://cards.scryfall.io/large/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "png": "https://cards.scryfall.io/png/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.png?1783930737", "art_crop": "https://cards.scryfall.io/art_crop/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "artist": "Paul Scott Canavan"}], "scryfall_uri": "https://scryfall.com/card/m21/28/nine-lives?utm_source=api", "rulings": [{"published_at": "2020-06-23", "comment": "Once the first triggered ability is on the stack, it won't trigger again, even if more damage is prevented and more incarnation counters are put onto it."}, {"published_at": "2020-06-23", "comment": "If you counter the first triggered ability or otherwise remove it from the stack, it will just trigger again immediately if Nine Lives still has nine or more incarnation counters on it."}, {"published_at": "2020-06-23", "comment": "The last ability of Nine Lives triggers no matter how it leaves the battlefield."}, {"published_at": "2020-06-23", "comment": "If damage that a source would deal to you can't be prevented, you still put an incarnation counter on Nine Lives."}]}]}, {"cards": ["Venser, Fervent Forger"], "reason": "Commander Spellbook lists it one card from an infinite with Iroh or Bazaar Trader.", "card_objs": [{"name": "Venser, Fervent Forger", "mana_cost": "{4}{R}{R}", "type_line": "Legendary Creature \u2014 Human Sorcerer", "oracle_text": "Flash\nWhen Venser enters, choose one \u2014\n\u2022 Copy target instant or sorcery spell an opponent controls twice. You may choose new targets for the copies.\n\u2022 Create two tokens that are copies of target permanent an opponent controls. They gain haste. At the beginning of the next end step, sacrifice them.", "pt": "5/3", "ci": "R", "cmc": 6.0, "price_usd": 0.32, "game_changer": false, "edhrec_rank": 13065, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "large": "https://cards.scryfall.io/large/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "png": "https://cards.scryfall.io/png/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.png?1790242646", "art_crop": "https://cards.scryfall.io/art_crop/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "artist": "Borja Pindado"}], "scryfall_uri": "https://scryfall.com/card/frc/9/venser-fervent-forger?utm_source=api", "rulings": [{"published_at": "2026-08-21", "comment": "If the copied spell divides damage or distributes counters among a number of targets, the division and number of targets can't be changed. If you choose new targets, you must choose the same number of targets."}, {"published_at": "2026-08-21", "comment": "Any choices made when the spell resolves won't have been made yet when it's copied. Any such choices will be made separately when the copies resolve."}, {"published_at": "2026-08-21", "comment": "The copies will have the same targets as the spell they're copying unless you choose new ones. You may change any number of the targets, including all of them or none of them. If, for one of the targets, you can't choose a new legal target, then it remains unchanged (even if the current target is illegal)."}, {"published_at": "2026-08-21", "comment": "If the spell that's copied has an X whose value was determined as it was cast, the copies have the same value of X."}]}]}, {"cards": ["Mycosynth Lattice"], "reason": "With Hellkite Tyrant it takes every permanent the Tyrant's target controls.", "card_objs": [{"name": "Mycosynth Lattice", "mana_cost": "{6}", "type_line": "Artifact", "oracle_text": "All permanents are artifacts in addition to their other types.\nAll cards that aren't on the battlefield, spells, and permanents are colorless.\nPlayers may spend mana as though it were mana of any color.", "pt": null, "ci": "", "cmc": 6.0, "price_usd": 33.73, "game_changer": false, "edhrec_rank": 2057, "images": [{"normal": "https://cards.scryfall.io/normal/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "large": "https://cards.scryfall.io/large/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "png": "https://cards.scryfall.io/png/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.png?1783934790", "art_crop": "https://cards.scryfall.io/art_crop/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "artist": "Anthony S. Waters & Cara Mitten"}], "scryfall_uri": "https://scryfall.com/card/bbd/241/mycosynth-lattice?utm_source=api", "rulings": [{"published_at": "2004-12-01", "comment": "The Lattice\u2019s third ability lets players spend even colorless mana as though it had a color. However, it doesn\u2019t remove restrictions on the mana. For example, Mycosynth Lattice doesn\u2019t allow mana from Vedalken Engineer to be used to cast a nonartifact spell."}, {"published_at": "2004-12-01", "comment": "Mycosynth Lattice turns all permanents on the battlefield into artifacts. Spells on the stack and cards in other zones aren\u2019t permanents, so those spells and cards don\u2019t become artifacts."}, {"published_at": "2004-12-01", "comment": "Mycosynth Lattice\u2019s second ability makes everything, in every zone of the game, colorless."}, {"published_at": "2009-10-01", "comment": "The Lattice\u2019s first ability causes Auras to become artifacts. Combined with March of the Machines from the Mirrodin set, this can then make those Auras become creatures. An Aura that\u2019s also a creature can\u2019t enchant anything. It\u2019s unattached the next time state-based actions are checked, and then immediately put into its owner\u2019s graveyard as a second state-based action."}]}]}, {"cards": ["Storm Herd"], "reason": "With Warleader's Call, Commander Spellbook lists a near-infinite damage line.", "card_objs": [{"name": "Storm Herd", "mana_cost": "{8}{W}{W}", "type_line": "Sorcery", "oracle_text": "Create X 1/1 white Pegasus creature tokens with flying, where X is your life total.", "pt": null, "ci": "W", "cmc": 10.0, "price_usd": 1.2, "game_changer": false, "edhrec_rank": 2846, "images": [{"normal": "https://cards.scryfall.io/normal/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "large": "https://cards.scryfall.io/large/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "png": "https://cards.scryfall.io/png/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.png?1783928328", "art_crop": "https://cards.scryfall.io/art_crop/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "artist": "Jim Nelson"}], "scryfall_uri": "https://scryfall.com/card/khc/33/storm-herd?utm_source=api", "rulings": []}]}, {"cards": ["Worldfire", "Boros Reckoner"], "reason": "Worldfire completes a Spellbook line with Outp lished_at": "2023-06-30", "comment": "If, during a player's declare attackers step, a creature that player controls that's been goaded is tapped, is affected by a spell or ability that says it can't attack, or hasn't been under that player's control continuously since the turn began (and doesn't have haste), then it doesn't attack. If there's a cost associated with having a creature attack a player, its controller isn't forced to pay that cost, so it doesn't have to attack that player."}, {"published_at": "2023-06-30", "comment": "If a creature you control has been goaded by multiple opponents, it must attack one of your opponents that hasn't goaded it, as that fulfills the maximum number of goad requirements. If a creature you control has been goaded by each of your opponents, the creature must attack an opponent (rather than a planeswalker or battle), but you choose which opponent it attacks."}, {"published_at": "2023-06-30", "comment": "Being goaded isn't an ability the creature has. Once it's been goaded, it must attack as detailed above even if it loses all abilities."}]}, {"qty": 1, "name": "Taunt from the Rampart", "mana_cost": "{3}{R}{W}", "type_line": "Sorcery", "oracle_text": "Goad all creatures your opponents control. Until your next turn, those creatures can't block. (Until your next turn, those creatures attack each combat if able and attack a player other than you if able.)", "pt": null, "ci": "RW", "cmc": 5.0, "price_usd": 2.14, "game_changer": false, "edhrec_rank": 1937, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/d/ad79ee29-dd86-484f-bd70-8ecd9d90ef75.jpg?1783903223", "large": "https://cards.scryfall.io/large/front/a/d/ad79ee29-dd86-484f-bd70-8ecd9d90ef75.jpg?1783903223", "png": "https://cards.scryfall.io/png/front/a/d/ad79ee29-dd86-484f-bd70-8ecd9d90ef75.png?1783903223", "art_crop": "https://cards.scryfall.io/art_crop/front/a/d/ad79ee29-dd86-484f-bd70-8ecd9d90ef75.jpg?1783903223", "artist": "Thomas Chamberlain-Keen"}], "scryfall 13:05.531191+00:00 v7.4.4 sha256:4c565eb8cca6", "included": [], "near_misses": 25, "online": null}, "table_prefs_ok": true, "table_issues": [], "price_estimate_usd": {"total": 152.7, "priced_cards": 76, "source": "Scryfall oracle-cards snapshot prices.usd (cheapest listed printing not guaranteed)", "snapshot": "oracle-cards-20261124220202.jsonl.gz"}, "sources": {"banned": "2026-02-09", "game_changers_as_of": "2026-02-09", "brackets_retrieved": "2026-11-25"}}, "trials": {"deck": "decks/iroh-tea-master-b2.txt", "model": "trials-v1", "notes": "Seeded draw and mana trials.\n\nModeled explicitly: opening hand with a disclosed mulligan policy (keep 2-5 lands; one free mulligan,\nthen London mulligans down to 5), on-the-draw in a 4-player game (draws on turn 1 for 3 of 4 seats;\nwe assume we draw), land drops preferring untapped and missing colors, tapped lands, colored sources,\nmana rocks, the commander with tax, simple card-draw spells, and one removal of the commander in the\ndisruption scenario. Deck colors come from the commander's mana cost. NOT modeled: opponents' boards, combat, counterspells, monarch draws (they depend on the\ntable), tutors, or graveyard recursion. Assembly rates exclude anything those would add.", "baseline": {"scenario": "baseline", "n": 1000, "seed": 7, "mulligans": {"kept_7": 829, "free_mull": 140, "to_6_or_5": 31}, "turn6": {"commander_on_battlefield": [0.984, [0.974, 0.99]], "has_bait_piece": [0.781, [0.754, 0.806]], "plausible_assembly": [0.765, [0.738, 0.79]], "lands_on_curve": 0.412, "avg_spells_cast": 6.49}, "turn8": {"commander_on_battlefield": [0.996, [0.99, 0.998]], "has_bait_piece": [0.841, [0.817, 0.862]], "plausible_assembly": [0.838, [0.814, 0.86]], "lands_on_curve": 0.646, "avg_spells_cast": 8.97}}, "disruption": {"scenario": "disruption", "n": 1000, "seed": 7, "mulligans": {"kept_7": 829, "free_mull": 140, "to_6_or_5": 31}, "turn6": {"commander_on_battlefield": [0.871, [0.849, 0.89]], "has_bait_piece": [0.781, [0.754, 0.806]], "plausible_assembly": [0.648, [0.618, 0.677]], "lands_on_curve": 0.412, "avg_spells_cast": 6.37}, "turn8": {"commander_on_battlefield": [0.958, [0.944, 0.969]], "has_bait_piece": [0.841, [0.817, 0.862]], "plausible_assembly": [0.802, [0.776, 0.826]], "lands_on_curve": 0.646, "avg_spells_cast": 9.37}}, "exact": {"P(>=1 of 11 bait pieces seen by turn 4, 7-card hand on the draw)": 0.7461, "P(>=1 of 11 bait pieces seen by turn 6, 7-card hand on the draw)": 0.8059, "P(>=1 of 11 bait pieces seen by turn 8, 7-card hand on the draw)": 0.8526}}, "clock": {"deck": "decks/iroh-tea-master-b2.txt", "model": "clock-v2", "notes": "Clock model: how fast a deck can kill three opponents at 40 life.\n\nThis extends the draw and mana trials (trials.py) with a small combat model. It is a goldfish with\noptional table pressure, not a game engine. Every number it reports depends on the assumptions below.\n\nModeled:\n- Our creatures attack every turn after the turn they enter (no haste). Damage goes to the opponent\n  with the lowest life, and any extra damage goes to the next one.\n- Iroh: at each combat, give one permanent (first a non-creature gift, then Iroh's Food, then a\n  creature gift, then a mana rock). Then create a 1/1 Ally with one +1/+1 counter for each gift out.\n  A creature gift we still control leaves on our next upkeep with probability 0.5 (its own rule moves it).\n  Brand is cast once 4 or more gifts are out: gifted creatures come back and can attack that turn.\n- Anthems: Intangible Virtue and Heraldic Banner (+1 to tokens), Glorious Anthem (+1 to all).\n  Honor of the Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Pod scenario (clock-v2): each opponent's board grows by 2 power per round from turn 4 and attacks a\n  random other player (us or an opponent) each round; we start at 40 life and win if we are the last\n  player alive by turn 16. Gifts change the holder's board: a creature gift adds its power, a free-value\n  gift (mana or cards) adds 1 power per round of growth, Steel Golem and Grid Monitor halve growth,\n  Jinxed Idol deals 2 a round (passed on a quarter of the time), Rust Elemental 2 a round, Akroan Horse\n  gives us and the other opponents a 1/1 each round, Pendant of Prosperity draws us a card, Nine Lives\n  makes the holder lose about four rounds later, and Transcendence makes a holder with 20 or more life\n  lose. Our removal takes 4 power from the strongest opponent, theft and Garland's hostage move 4 power\n  from an opponent to us, board wipes are held until the opponents are clearly ahead, and Ghostly Prison\n  style cards cut the damage we take. Zidane makes a Treasure per gift, Bazaar Trader gives a second gift each turn, Yes Man gives itself away and\n  draws two, Idol of Oblivion draws on token turns, Wedding Ring draws a card a round, and Abzan Falconer\n  gives Iroh's tokens (they carry +1/+1 counters) flying. Generic rules cover the rest: removal and burn\n  take 4 power, goad turns the opponents on each other for about a round, reanimation and theft give us a\n  power-4 creature, and symmetric draw gives each player a card a round. Conjurer's Closet and Thassa\n  re-trigger our best enter effect at each end step (a steal with Agent of Treachery or Hostage Taker,\n  a Gray Merchant drain, a new crown holder for Garland, a removal, or two cards).\n- Marchesa tools: an aikido instant (Deflecting Palm, Comeuppance, Inkshield, Take the Bait) stops one\n  attack of 5 or more on us and sends the damage back; Sunforger can fetch one from the library once a round\n  (red or white, mana value 4 or less), which uses that card up. Kardur goads the\n  table for a round and drains 1 per creature that dies attacking. Insurrection (all) and Mob Rule (about\n  60%) add the opponents' boards to our attack for a turn; Ruinous Ultimatum wipes only their boards.\n  Gisela doubles our damage and halves damage to us; Duelist's Heritage gives the largest attacker double\n  strike; Wound Reflection doubles the life opponents lost this turn at triggers only if the target opponent gains control of Yes Man."}, {"published_at": "2024-03-08", "comment": "When Yes Man's owner leaves the game, Yes Man leaves the game along with that player. It's just doing what it's told."}, {"published_at": "2024-03-08", "comment": "When Yes Man's controller leaves the game, if that player wasn't its owner, the effect giving that player control of Yes Man ends. Yes Man will return to the control of the player still in the game who most recently controlled it, ignoring any control effects whose durations have already expired."}]}, {"qty": 1, "name": "Zidane, Tantalus Thief", "mana_cost": "{3}{R}{W}", "type_line": "Legendary Creature \u2014 Human Mutant Scout", "oracle_text": "When Zidane enters, gain control of target creature an opponent controls until end of turn. Untap it. It gains lifelink and haste until end of turn.\nWhenever an opponent gains control of a permanent from you, you create a Treasure token.", "pt": "3/3", "ci": "RW", "cmc": 5.0, "price_usd": 0.24, "game_changer": false, "edhrec_rank": 8093, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/4/e42c7d9d-8685-415b-8c5d-6ab2165863b9.jpg?1783906559", "large": "https://cards.scryfall.io/large/front/e/4/e42c7d9d-8685-415b-8c5d-6ab2165863b9.jpg?1783906559", "png": "https://cards.scryfall.io/png/front/e/4/e42c7d9d-8685-415b-8c5d-6ab2165863b9.png?1783906559", "art_crop": "https://cards.scryfall.io/art_crop/front/e/4/e42c7d9d-8685-415b-8c5d-6ab2165863b9.jpg?1783906559", "artist": "Eiji Kaneda"}], "scryfall_uri": "https://scryfall.com/card/fin/251/zidane-tantalus-thief?utm_source=api", "rulings": [{"published_at": "2025-06-06", "comment": "If an opponent gains control of Zidane from you, Zidane's last ability will trigger and you'll create a Treasure token. If an opponent gains control of Zidane and one or more other permanents from you simultaneously, Zidane's last ability will trigger for each of those permanents, including itself. This means you'll cr een by turn 6, 7-card hand on the draw)": 0.8059, "P(>=1 of 11 bait pieces seen by turn 8, 7-card hand on the draw)": 0.8526}}, "clock": {"deck": "decks/iroh-tea-master-b3.txt", "model": "clock-v2", "notes": "Clock model: how fast a deck can kill three opponents at 40 life.\n\nThis extends the draw and mana trials (trials.py) with a small combat model. It is a goldfish with\noptional table pressure, not a game engine. Every number it reports depends on the assumptions below.\n\nModeled:\n- Our creatures attack every turn after the turn they enter (no haste). Damage goes to the opponent\n  with the lowest life, and any extra damage goes to the next one.\n- Iroh: at each combat, give one permanent (first a non-creature gift, then Iroh's Food, then a\n  creature gift, then a mana rock). Then create a 1/1 Ally with one +1/+1 counter for each gift out.\n  A creature gift we still control leaves on our next upkeep with probability 0.5 (its own rule moves it).\n  Brand is cast once 4 or more gifts are out: gifted creatures come back and can attack that turn.\n- Anthems: Intangible Virtue and Heraldic Banner (+1 to tokens), Glorious Anthem (+1 to all).\n  Honor of the Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Pod scenario (clock-v2): each opponent's board grows by 2 power per round from turn 4 and attacks a\n  random other player (us or an opponent) each round; we start at 40 life and win if we are the last\n  player alive by turn 16. Gifts change the holder's board: a creature gift adds its power, a free-value\n  gift (mana or cards) adds 1 power per round of growth, Steel Golem and Grid Monitor halve growth,\n  Jinxed Idol deals 2 a round (passed on a quarter of the time), Rust Elemental 2 a round, Akroan Horse\n  gives us and the other opponents a 1/1 each round, Pendant of Prosperity draws us a card, Nine Lives\n  makes the holder lose about four rounds later, and Transcendence makes a holder with 20 or more life\n  lose. Our removal takes 4 power from the strongest opponent, theft and Garland's hostage move 4 power\n  from an opponent to us, board wipes are held until the opponents are clearly ahead, and Ghostly Prison\n  style cards cut the damage we take. Zidane makes a Treasure per gift, Bazaar Trader gives a second gift each turn, Yes Man gives itself away and\n  draws two, Idol of Oblivion draws on token turns, Wedding Ring draws a card a round, and Abzan Falconer\n  gives Iroh's tokens (they carry +1/+1 counters) flying. Generic rules cover the rest: removal and burn\n  take 4 power, goad turns the opponents on each other for about a round, reanimation and theft give us a\n  power-4 creature, and symmetric draw gives each player a card a round. Conjurer's Closet and Thassa\n  re-trigger our best enter effect at each end step (a steal with Agent of Treachery or Hostage Taker,\n  a Gray Merchant drain, a new crown holder for Garland, a removal, or two cards).\n- Marchesa tools: an aikido instant (Deflecting Palm, Comeuppance, Inkshield, Take the Bait) stops one\n  attack of 5 or more on us and sends the damage back; Sunforger can fetch one from the library once a round\n  (red or white, mana value 4 or less), which uses that card up. Kardur goads the\n  table for a round and drains 1 per creature that dies attacking. Insurrection (all) and Mob Rule (about\n  60%) add the opponents' boards to our attack for a turn; Ruinous Ultimatum wipes only their boards.\n  Gisela doubles our damage and halves damage to us; Duelist's Heritage gives the largest attacker double\n  strike; Wound Reflection doubles the life opponents lost this turn; Kambal drains 2 a round; Breena\n  grows our largest creature when opponents attack each other. Queen Marchesa makes a 1/1 deathtouch\n  Assassin each upkeep while an opponent is the monarch.\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted).\nNot modeled: opponents' attacks on us, our life, Mob rds (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Pod scenario (clock-v2): each opponent's board grows by 2 power per round from turn 4 and attacks a\n  random other player (us or an opponent) each round; we start at 40 life and win if we are the last\n  player alive by turn 16. Gifts change the holder's board: a creature gift adds its power, a free-value\n  gift (mana or cards) adds 1 power per round of growth, Steel Golem and Grid Monitor halve growth,\n  Jinxed Idol deals 2 a round (passed on a quarter of the time), Rust Elemental 2 a round, Akroan Horse\n  gives us and the other opponents a 1/1 each round, Pendant of Prosperity draws us a card, Nine Lives\n  makes the holder lose about four rounds later, and Transcendence makes a holder with 20 or more life\n  lose. Our removal takes 4 power from the strongest opponent, theft and Garland's hostage move 4 power\n  from an opponent to us, board wipes are held until the opponents are clearly ahead, and Ghostly Prison\n  style cards cut the damage we take. Zidane makes a Treasure per gift, Bazaar Trader gives a second gift each turn, Yes Man gives itself away and\n  draws two, Idol of Oblivion draws on token turns, Wedding Ring draws a card a round, and Abzan Falconer\n  gives Iroh's tokens (they carry +1/+1 counters) flying. Generic rules cover the rest: removal and burn\n  take 4 power, goad turns the opponents on each other for about a round, reanimation and theft give us a\n  power-4 creature, and symmetric draw gives each player a card a round. Conjurer's Closet and Thassa\n  re-trigger our best enter effect at each end step (a steal with Agent of Treachery or Hostage Taker,\n  a Gray Merchant drain, a new crown holder for Garland, a removal, or two cards).\n- Marchesa tools: an aikido instant (Deflecting Palm, Comeuppance, Inkshield, Take the Bait) stops one\n  attack of 5 or more on us and sends the damage back; Sunforger can fetch one from the library once a round\n  (red or white, mana value 4 or less), which uses that card up. Kardur goads the\n  table for a round and drains 1 per creature that dies attacking. Insurrection (all) and Mob Rule (about\n  60%) add the opponents' boards to our attack for a turn; Ruinous Ultimatum wipes only their boards.\n  Gisela doubles our damage and halves damage to us; Duelist's Heritage gives the largest attacker double\n  strike; Wound Reflection doubles the life opponents lost this turn; Kambal drains 2 a round; Breena\n  grows our largest creature when opponents attack each other. Queen Marchesa makes a 1/1 deathtouch\n  Assassin each upkeep while an opponent is the monarch.\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted). t": "2024-07-05", "comment": "If an effect instructs you to sacrifice a creature and you control any creatures other than Alexios, you must sacrifice one of those other creatures. You can't try to sacrifice Alexios."}]}, {"name": "Hissing Miasma", "mana_cost": "{1}{B}{B}", "type_line": "Enchantment", "oracle_text": "Whenever a creature attacks you, its controller loses 1 life.", "pt": null, "ci": "B", "cmc": 3.0, "price_usd": 1.45, "game_changer": false, "edhrec_rank": 10096, "images": [{"normal": "https://cards.scryfall.io/normal/front/f/3/f394fd39-842f-4c98-b857-bdad3fd09758.jpg?1783943509", "large": "https://cards.scryfall.io/large/front/f/3/f394fd39-842f-4c98-b857-bdad3fd09758.jpg?1783943509", "png": "https://cards.scryfall.io/png/front/f/3/f394fd39-842f-4c98-b857-bdad3fd09758.png?1783943509", "art_crop": "https://cards.scryfall.io/art_crop/front/f/3/f394fd39-842f-4c98-b857-bdad3fd09758.jpg?1783943509", "artist": "Ben Thompson"}], "scryfall_uri": "https://scryfall.com/card/gpt/51/hissing-miasma?utm_source=api", "rulings": []}, {"name": "Agent of Treachery", "mana_cost": "{5}{U}{U}", "type_line": "Creature \u2014 Human Rogue", "oracle_text": "When this creature enters, gain control of target permanent.\nAt the beginning of your end step, if you control three or more permanents you don't own, draw three cards.", "pt": "2/3", "ci": "U", "cmc": 7.0, "price_usd": 7.85, "game_changer": false, "edhrec_rank": 2128, "images": [{"normal": "https://cards.scryfall.io/normal/front/c/c/cc6686e6-4535-49be-b0b3-e76464656cd2.jpg?1783933017", "large": "https://cards.scryfall.io/large/front/c/c/cc6686e6-4535-49be-b0b3-e76464656cd2.jpg?1783933017", "png": "https://cards.scryfall.io/png/front/c/c/cc6686e6-4535-49be-b0b3-e76464656cd2.png?1783933017", "art_crop": "https://cards.scryfall.io/art_crop/front/c/c/cc6686e6-4535-49be-b0b3-e76464656cd2.jpg?1783933017", "artist": "Igor Kieryluk"}], "scryfall_uri": "https://scryfall.com/card/m20/43/agent-of-treachery?utm_source=api", "rulings": [{"published_at": "2019-07-12", "comment": "If you gain control of a permanent \"until end of turn,\" that effect will wear off during the cleanup step, after the end step. You'll control that permanent while considering Agent of Treachery's last ability."}, {"published_at": "2019-07-12", "comment": "If you don't control three permanents you don't own as your end step begins, Agent of Treachery's last ability doesn't trigger. If you no longer control three permanents you don't own as it resolves, you won't draw three cards. Those don't have to be the same three permanents each time."}, {"published_at": "2019-07-12", "comment": "Gaining control of a creature doesn't cause you to gain control of any Auras or Equipment attached to it. Gaining control of an Aura or Equipment doesn't change what it's currently attached to."}, {"published_at": "2019-07-12", "comment": "A token's owner is the player who created it."}]}]}], "weight_sensitivity": {"default": ["Crown of Gondor + Garland, Royal Kidnapper + Agent of Treachery", "Crown of Gondor + Garland, Royal Kidnapper + Gix, Yawgmoth Praetor", "Crown of Gondor + Garland, Royal Kidnapper + Coveted Jewel", "Coin of Fate + Knights of the Black Rose + Coveted Jewel", "Hithlain Rope + Ob Nixilis, Unshackled + Orcish Bowmasters"], "power_heavy": ["Throne of the High City + Garland, Royal Kidnapper", "Crown of Gondor + Garland, Royal Kidnapper", "Crown of Gondor + Garland, Royal Kidnapper + Agent of Treachery", "Crown of Gondor + Garland, Royal Kidnapper + Gix, Yawgmoth Praetor", "Hithlain Rope + Ob Nixilis, Unshackled"], "novelty_heavy": ["Hithlain Rope + Ob Nixilis, Unshackled + Orcish Bowmasters", "Hithlain Rope + Ob Nixilis, Unshackled + Sheoldred, the Apocalypse", "Crown of Gondor + Garland, Royal Kidnapper + Agent of Treachery", "Crown of Gondor + Garland, Royal Kidnapper + Gix, Yawgmoth Praetor", "Coin of Fate + Knights of the Black Rose + Coveted Jewel"], "playable": ["Throne of the High City + Garland, Royal Kidnapper", "
