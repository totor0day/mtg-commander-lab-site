<head>

<title>Commander Interaction Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: light;
  --bg: #f4f1ea; --surface: #fcfcfb; --surface-2: #ece7dc; --line: #d9d2c3;
  --text: #1b1915; --text-2: #52514e; --muted: #7b776d;
  --accent: #6b4fb8; --accent-ink: #ffffff; --gold: #9a6d12;
  --ok: #1e7a3c; --bad: #b3261e; --warn: #9a6d12;
  --series-1: #2a78d6; --series-2: #eb6834;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121110; --surface: #1a1a19; --surface-2: #24231f; --line: #34322c;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8c82;
    --accent: #9d86f0; --accent-ink: #121110; --gold: #e0b04a;
    --ok: #4cc070; --bad: #ef6b63; --warn: #e0b04a;
    --series-1: #3987e5; --series-2: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121110; --surface: #1a1a19; --surface-2: #24231f; --line: #34322c;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8c82;
  --accent: #9d86f0; --accent-ink: #121110; --gold: #e0b04a;
  --ok: #4cc070; --bad: #ef6b63; --warn: #e0b04a;
  --series-1: #3987e5; --series-2: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, sans-serif; overflow-x: hidden; }
a { color: var(--accent); }
h1, h2, h3 { font-family: Cinzel, Georgia, serif; letter-spacing: .02em; line-height: 1.2; }
h2 { font-size: 1.5rem; margin: 2rem 0 .75rem; }
h3 { font-size: 1.1rem; margin: 1.4rem 0 .5rem; }
code { background: var(--surface-2); padding: 0 .3em; border-radius: 4px; font-size: .9em; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { font-family: Cinzel, serif; font-weight: 700; font-size: 1.05rem; margin-right: auto; white-space: nowrap; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button, .seg button, .btn { font: inherit; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: .35rem .8rem; cursor: pointer; }
nav button[aria-current="page"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:hover, nav button:hover { border-color: var(--accent); }
.theme-toggle { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }

.hero { position: relative; border-radius: 18px; overflow: hidden; margin: 20px 0; min-height: 360px; display: grid; align-items: end; box-shadow: var(--shadow); background: #222; }
.hero .bgwrap { position: absolute; inset: 0 0 -30% 0; will-change: transform; }
.hero img.bg { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; filter: brightness(.55) saturate(.85); transform-origin: 50% 0; animation: hero-drift 26s ease-in-out infinite alternate; }
@keyframes hero-drift { from { transform: scale(1); } to { transform: scale(1.08); } }
.hero .shade { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(12,10,8,.88) 0%, rgba(12,10,8,.62) 45%, rgba(12,10,8,.18) 100%),
  linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.55) 100%); }
.hero h1 { text-shadow: 0 2px 18px rgba(0,0,0,.65); }
.hero p { text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.hero .content > * { animation: hero-rise .8s cubic-bezier(.2,.7,.2,1) both; }
.hero .content > *:nth-child(2) { animation-delay: .12s; }
.hero .content > *:nth-child(3) { animation-delay: .24s; }
@keyframes hero-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .hero img.bg, .hero .content > * { animation: none; }
  .hero .bgwrap { transition: none; }
}
.hero .content { position: relative; padding: 28px; color: #f6f2e8; max-width: 760px; }
.hero h1 { margin: .2rem 0 .4rem; font-size: clamp(1.7rem, 4vw, 2.6rem); }
.hero p { margin: .3rem 0; color: #e9e3d4; }
.kicker { text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; color: #e0c27a; font-weight: 600; }
.hero .credit { position: absolute; right: 12px; bottom: 8px; font-size: .7rem; color: #cfc8b8; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat .v { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-2); font-size: .85rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

.badge { display: inline-flex; align-items: center; gap: .3em; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: .15rem .55rem; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); } .badge.neutral { color: var(--text-2); }

/* Card art */
.cardimg { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; object-fit: cover; display: block; background: var(--surface-2); box-shadow: var(--shadow); cursor: zoom-in; transition: transform .15s ease; }
.cardimg:hover { transform: translateY(-3px) scale(1.02); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.strip figure { margin: 0; }
.strip figcaption { font-size: .82rem; color: var(--text-2); margin-top: 6px; }
.strip figcaption b { color: var(--text); display: block; font-size: .86rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.grid .cell { position: relative; }
.grid .qty { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.75); color: #fff; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: 0 .5em; }
.grid .gc { position: absolute; top: 6px; right: 6px; background: var(--bad); color: #fff; font-size: .68rem; border-radius: 999px; padding: 0 .5em; }
.missing { display: grid; place-items: center; text-align: center; padding: 8px; font-size: .8rem; color: var(--text-2); border: 1px dashed var(--line); }

.finding { scroll-margin-top: 70px; }
.finding .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.finding .head h2 { margin: 0; margin-right: auto; }
.story { font-style: italic; color: var(--text-2); border-left: 3px solid var(--gold); padding-left: 10px; margin: 10px 0; }
ol.seq li { margin: .3rem 0; }
.dec { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.dec div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.dec b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); }

.scores { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 4px 10px; align-items: center; font-size: .85rem; }
.scores .bar { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.scores .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.scores .s i { background: var(--series-1); } .scores .r i { background: var(--series-2); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

details.trace { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--surface); }
details.trace summary { cursor: pointer; padding: 10px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.trace .body { padding: 0 14px 12px; }
.asserts li { list-style: none; margin: 2px 0; } .asserts { padding-left: 0; }
.asserts .y { color: var(--ok); font-weight: 700; } .asserts .n { color: var(--bad); font-weight: 700; }
pre.log { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: .8rem; overflow-x: auto; }

.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--text-2); margin: 4px 0 8px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: .78rem; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; z-index: 5; }

dialog.modal { border: none; border-radius: 16px; padding: 0; max-width: min(920px, calc(100vw - 32px)); width: 100%; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
dialog.modal::backdrop { background: rgba(0,0,0,.65); }
.modal .inner { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 20px; padding: 20px; }
@media (max-width: 720px) { .modal .inner { grid-template-columns: 1fr; } }
.modal .oracle { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: .9rem; }
.modal .close { position: absolute; right: 10px; top: 10px; }
.modal .faces { display: grid; gap: 10px; }
.printcard { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; }
.printcard .line { border-bottom: 1px solid var(--line); height: 1.6em; }
@media print { header.top, nav, .noprint { display: none !important; } body { background: #fff; color: #000; } .panel { box-shadow: none; } }
.muted { color: var(--text-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .78rem; background: var(--surface-2); border-radius: 999px; padding: .1rem .55rem; color: var(--text-2); }
.swap { display: grid; grid-template-columns: 96px 24px 96px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.swap .arrow { text-align: center; color: var(--text-2); }
@media (max-width: 520px) { .swap { grid-template-columns: 70px 18px 70px; } .swap .why { grid-column: 1 / -1; } }
.mini { display: flex; gap: 4px; flex: none; }
.mini img { width: 44px; flex: none; border-radius: 3px; cursor: zoom-in; }
.frow { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; align-items: center; margin: 10px 0; }
.frow > div:last-child { min-width: 0; overflow-wrap: anywhere; }
.steps { list-style: none; padding: 0; margin: 14px 0; counter-reset: s; }
.steps > li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 10px; box-shadow: var(--shadow); }
.steps > li > div:last-child { min-width: 0; }
.steps h3 { margin: 0 0 6px; }
.steps p { margin: 0 0 8px; }
.num-big { font-family: Cinzel, Georgia, serif; font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }
.num-big span { display: block; font-family: Inter, system-ui, sans-serif; font-size: .78rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 560px) { .steps > li { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 16px 0 6px; }
.pillars div { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 12px; padding: 12px 14px; }
.pillars b { display: block; font-family: Cinzel, Georgia, serif; font-size: 1.15rem; margin-bottom: 4px; }
.pillars span { font-size: .88rem; color: var(--text-2); }
.funnel { list-style: none; padding: 0; margin: 10px 0 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.funnel li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
.funnel b { display: block; font-family: Cinzel, Georgia, serif; font-size: 1.5rem; color: var(--gold); line-height: 1.15; }
.funnel span { font-size: .85rem; color: var(--text-2); }
.decklist { display: grid; gap: 14px; }
.deckcard { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.deckcard.featured { border-color: var(--gold); grid-template-columns: 320px minmax(0, 1fr); }
.deckcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; }
.deckcard h3 { margin: 2px 0 6px; font-size: 1.3rem; }
.deckcard p { margin: 0 0 10px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 0 0 10px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 1.1rem; }
.kv span { font-size: .78rem; color: var(--muted); }
@media (max-width: 700px) { .deckcard, .deckcard.featured { grid-template-columns: minmax(0, 1fr); } }
.hero .content { padding-bottom: 40px; }
</style>
</head>

k, then you attack."], "decisions": {"you": "What to give, and to whom: a Festival to the player who will use it on your rival, a Renegade to the player who just drew three.", "the Festival holder": "Ping now or save mana. Each ping risks the Festival. On a lost flip, choose who gets it next, and sending it back to you shrinks Iroh's next token.", "the player with the most cards": "Cast spells to lose the Renegade, or hold cards and take a 3/3.", "everyone": "Kill the gifts (smaller tokens), kill Iroh (no tokens), or use the gifts against each other."}, "stops": ["Remove Iroh: no new tokens. Tokens already made keep their counters.", "Send gifts home: a lost Festival flip can pick you, and the Renegade returns when you have the most cards.", "Kill a gift while the token trigger is on the stack: the count is read on resolution.", "Kill Iroh's target in response: no gift and no token (Iroh ruling)."], "analog": "Iroh donate decks (EDHREC: Humble Defector 81%, Hithlain Rope 66%). Those gifts move once, or only when used. Goblin Festival, Sokenzan Renegade and Crag Saurian are not on EDHREC's Iroh page (under about 4% of 4,299 decks).", "evidence": "rules-checked", "trace": "iroh-wander", "spellbook": "No Spellbook variant uses Goblin Festival, Sokenzan Renegade or Crag Saurian with Iroh (offline bulk 2026-11-25). The deck has 0 combos included.", "scores": {"static": {"agency": 1.0, "memorable": 0.55, "novelty": 0.797, "playability": 1.0, "pacing": 1.0, "total": 0.847}, "reviewed": {"agency": 0.95, "memorable": 0.8, "novelty": 0.85, "playability": 0.85, "pacing": 0.8, "total": 0.86}, "review_note": "Static scores are for Goblin Festival + Iroh (co-play 0.9%), rank 5 in search-v3. Reviewed up for memorable (the Festival + Crag Saurian swap) and novelty (three new gifts, not one). Reviewed down for pacing: each Festival ping is a coin flip and a decision, so turns get longer."}, "table_story": "Iroh gives a permanent away each combat. Goblin Festival moves on a lost coin e the monarch\" trigger only if you aren't already the monarch. For example, if you are already the monarch as Custodi Lich enters the battlefield, its last ability won't trigger."}, {"published_at": "2016-08-23", "comment": "Being the monarch carries two inherent triggered abilities. \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2016-08-23", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack, and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2016-08-23", "comment": "The game starts with no monarch. Once an effect makes one player the monarch, the game will have exactly one monarch from that point forward."}]}, {"name": "Archivist of Gondor", "role": "sweetener: the monarch draws an extra card, so the crown is worth chasing despite the hostage", "mana_cost": "{2}{U}", "type_line": "Creature \u2014 Human Advisor", "oracle_text": "When your commander deals combat damage to a player, if there is no monarch, you become the monarch.\nAt the beginning of the monarch's end step, that player draws a card.", "pt": "2/3", "ci": "U", "cmc": 3.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 10171, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/c/ec691418-1075-477f-b0df-f0d064588baf.jpg?1783916032", "large": "https://cards.scryfall.io/large/front/e/c/ec691418-1075-477f-b0df-f0d064588baf.jpg?1783916032", "png": "https://cards.scryfall.io/png/front/e/c/ec691418-1075-477f-b0df-f0d064588baf.png?1783916032", "art_crop": "https://cards.scryfall.io/art_crop/front/e/c/ec691418-1075-477f-b0df-f0d064588baf.jpg?1783916032", "artist": "Wisnu Tan"}], "scryfall_uri": "https://scryfall.com/card/ltc/18/archivist-of-gondor?utm_source=api", "rulings": [{"published_at": "2023-06-16", "comment": " for each of them. You choose which player ends up with Coveted Jewel, but each of them draws three cards and has a chance to activate its mana ability."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability resolves after blockers are chosen but before combat damage is dealt."}]}]}, {"cards": ["Notion Thief"], "reason": "Excluded from the B3 package: it removes the monarch's extra draw, which is the reason anyone wants the crown. That is repeated denial.", "card_objs": [{"name": "Notion Thief", "mana_cost": "{2}{U}{B}", "type_line": "Creature \u2014 Human Rogue", "oracle_text": "Flash\nIf an opponent would draw a card except the first one they draw in each of their draw steps, instead that player skips that draw and you draw a card.", "pt": "3/1", "ci": "BU", "cmc": 4.0, "price_usd": 1.75, "game_changer": true, "edhrec_rank": 1232, "images": [{"normal": "https://cards.scryfall.io/normal/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "large": "https://cards.scryfall.io/large/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "png": "https://cards.scryfall.io/png/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.png?1783929456", "art_crop": "https://cards.scryfall.io/art_crop/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "artist": "Clint Cearley"}], "scryfall_uri": "https://scryfall.com/card/znc/96/notion-thief?utm_source=api", "rulings": [{"published_at": "2018-03-16", "comment": "If an opponent is instructed to draw a card then discard a card, and Notion Thief causes you to draw a card instead, that opponent still discards a card. The same is true of any other actions that opponent is instructed to do."}, {"published_at": "2018-03-16", "comment": "If two or more players each control a Notion Thief and a player would draw a card other than the first one in their draw step, that player chooses one of the applicable Notion Thief effects to apply. Then the player whose Notion Thief's effect was chosen repeats this process among the remaining Notion Thief effects, and so on, until there are no more possible such effects to apply. Each effect can be applied to the card draw only once this way."}, {"published_at": "2018-03-16", "comment": "The above procedure means that if each player in a two-player game controls a Notion Thief and one would draw a card, it really will be that player who draws a card."}]}]}, {"cards": ["Elrond of the White Council", "Grudge Keeper"], "reason": "Both vote options benefit the pilot. The choice is about how much to lose, not which outcome to aim for. Lower agency on review.", "card_objs": [{"name": "Elrond of the White Council", "mana_cost": "{3}{G}{U}", "type_line": "Legendary Creature \u2014 Elf Noble", "oracle_text": "Secret council \u2014 When Elrond enters, each player secretly votes for fellowship or aid, then those votes are revealed. For each fellowship vote, the voter chooses a creature they control. You gain control of each creature chosen this way, and they gain \"This creature can't attack its owner.\" Then for each aid vote, put a +1/+1 counter on each creature you control.", "pt": "3/3", "ci": "GU", "cmc": 5.0, "price_usd": 0.29, "game_changer": false, "edhrec_rank": 9782, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "large": "https://cards.scryfall.io/large/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "png": "https://cards.scryfall.io/png/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.png?1783916020", "art_crop": "https://cards.scryfall.io/art_crop/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "artist": "Javier Charro"}], "scryfall_uri": "https://scryfall.com/card/ltc/51/elrond-of-the-white-council?utm_source=api", "rulings": [{"published_at": "2023-06-16", "comment": "If you have multiple votes, you can vote for fellowship multiple times. If you do, you can choose the same creature each time."}, {"published_at": "2023-06-16", "comment": "The phrase \"the vote is tied\" refers only to when there is more than one choice that received the most votes. For example, if a 5-player vote from among three different choices ends 3 votes to 1 vote to 1 vote, the vote isn't tied."}, {"published_at": "2023-06-16", "comment": "To secretly vote, each player writes down their chosen option without showing it to anyone else. Each player then keeps their vote secret until all players simultaneously reveal their votes."}, {"published_at": "2023-06-16", "comment": "After the votes are revealed, starting with the player whose turn it is and proceeding in turn order, each player who voted fellowship chooses a creature they control for each of their fellowship votes. Then the controller of Elrond of the White Council's ability gains control of those creatures and they gain the listed ability. Finally, that player puts a +1/+1 counter on each creature they control for each aid vote."}]}, {"name": "Grudge Keeper", "mana_cost": "{1}{B}", "type_line": "Creature \u2014 Zombie Wizard", "oracle_text": "Whenever players finish voting, each opponent who voted for a choice you didn't vote for loses 2 life.", "pt": "2/1", "ci": "B", "cmc": 2.0, "price_usd": 0.31, "game_changer": false, "edhrec_rank": 12276, "images": [{"normal": "https://cards.scryfall.io/normal/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "large": "https://cards.scryfall.io/large/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "png": "https://cards.scryfall.io/png/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.png?1783939375", "art_crop": "https://cards.scryfall.io/art_crop/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "artist": "Ryan Barger"}], "scryfall_uri": "https://scryfall.com/card/cns/28/grudge-keeper?utm_source=api", "rulings": [{"published_at": "2014-05-29", "comment": "The spell or ability that caused you to vote will finish resolving before Grudge Keeper\u2019s ability is put on the stack. The ability will be put on the stack even if the results of the vote cause Grudge Keeper to leave the battlefield."}, {"published_at": "2014-05-29", "comment": "Grudge Keeper\u2019s ability considers only the vote that caused it to trigger, not any previous votes, even if they were caused by the same permanent."}, {"published_at": "2014-05-29", "comment": "If one of your opponents has additional votes because of Brago\u2019s Representative, and that player votes for more than one choice you didn\u2019t vote for, that player will lose only 2 life."}, {"published_at": "2014-05-29", "comment": "If you have additional votes because of Brago\u2019s Representative, and you vote for more than one choice, an opponent will lose 2 life only if they voted for none of those choices."}]}]}], "exploration_queue": [{"cards": ["Alexios, Deimos of Kosmos", "Coveted Jewel", "Marchesa's Decree"], "status": "conditional", "question": "Does a shared, ever-growing attacker that can't hit you make the Jewel a table-wide hot potato, or does it just pick off the weakest player?", "card_objs": [{"name": "Alexios, Deimos of Kosmos", "mana_cost": "{3}{R}", "type_line": "Legendary Creature \u2014 Human Berserker", "oracle_text": "Trample\nAlexios attacks each combat if able, can't be sacrificed, and can't attack its owner.\nAt the beginning of each player's upkeep, that player gains control of Alexios, untaps it, and puts a +1/+1 counter on it. It gains haste until end of turn.", "pt": "4/4", "ci": "R", "cmc": 4.0, "price_usd": 0.68, "game_changer": false, "edhrec_rank": 1310, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "large": "https://cards.scryfall.io/large/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "png": "https://cards.scryfall.io/png/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.png?1783910980", "art_crop": "https://cards.scryfall.io/art_crop/front/e/8/e81b94b2-4052-4686-a788-9b om/card/msc/196/coveted-jewel?utm_source=api", "rulings": [{"published_at": "2018-07-13", "comment": "A creature attacking a planeswalker you control won't cause Coveted Jewel's last ability to trigger."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability triggers after you declare blockers (or declare no blockers at all) if any attacking creatures are unblocked. It doesn't matter if some attacking creatures were blocked."}, {"published_at": "2018-07-13", "comment": "If more than one opponent attacks you at the same time, Coveted Jewel's last ability triggers for each of them. You choose which player ends up with Coveted Jewel, but each of them draws three cards and has a chance to activate its mana ability."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability resolves after blockers are chosen but before combat damage is dealt."}]}, {"name": "Marchesa's Decree", "mana_cost": "{3}{B}", "type_line": "Enchantment", "oracle_text": "When this enchantment enters, you become the monarch.\nWhenever a creature attacks you or a planeswalker you control, that creature's controller loses 1 life.", "pt": null, "ci": "B", "cmc": 4.0, "price_usd": 2.01, "game_changer": false, "edhrec_rank": 6940, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "large": "https://cards.scryfall.io/large/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "png": "https://cards.scryfall.io/png/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.png?1783937352", "art_crop": "https://cards.scryfall.io/art_crop/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "artist": "Chris Rallis"}], "scryfall_uri": "https://scryfall.com/card/cn2/44/marchesas-decree?utm_source=api", "rulings": [{"published_at": "2016-08-23", "comment": "Abilities that trigger whenever you \"become the monarch\" trigger only if you aren't already the monarch. For example, if you are already the monarch as Custodi Lich enters the battlefield, its last ability won't trigger."}, {"published_at": "2016-08-23", "comment": "Being the monarch carries two inherent triggered abilities. \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2016-08-23", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack, and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2016-08-23", "comment": "The game starts with no monarch. Once an effect makes one player the monarch, the game will have exactly one monarch from that point forward."}]}]}, {"cards": ["Garland, Royal Kidnapper", "Ghostly Flicker"], "status": "conditional", "question": "Each flicker re-gives the crown. Does this speed the carousel up too much for Bracket 2 pacing?", "card_objs": [{"name": "Garland, Royal Kidnapper", "mana_cost": "{2}{U}{B}", "type_line": "Legendary Creature \u2014 Human Knight", "oracle_text": "When Garland enters, target opponent becomes the monarch.\nWhenever an opponent becomes the monarch, gain control of target creature that player controls for as long as they're the monarch.\nCreatures you control but don't own get +2/+2 and can't be sacrificed.", "pt": "3/4", "ci": "BU", "cmc": 4.0, "price_usd": 9.7, "game_changer": false, "edhrec_rank": 11855, "images": [{"normal": "https://cards.scryfall.io/normal/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "large": "https://cards.scryfall.io/large/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "png": "https://cards.scryfall.io/png/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.png?1783904658", "art_crop": "https://cards.scryfall.io/art_crop/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "artist": "David Rapoza"}], "scryfall_uri": "https://scryfall.com/card/fic/442/garland-royal-kidnapper?utm_source=api", "rulings": [{"published_at": "2025-10-02", "comment": "The owner of a token is the player who created that token or, in the case of a resolving copy of a permanent spell that became a token, the player who controlled that spell as it resolved."}, {"published_at": "2025-10-02", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2025-10-02", "comment": "There are two inherent triggered abilities associated with being the monarch. These triggered abilities have no source and are controlled by the player who was the monarch at the time the abilities triggered. The full texts of these abilities are \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2025-10-02", "comment": "While Garland's second ability is on the stack, if that opponent stops being the monarch before it resolves, you won't gain control of the target creature at all."}]}, {"name": "Ghostly Flicker", "mana_cost": "{2}{U}", "type_line": "Instant", "oracle_text": "Exile two target artifacts, creatures, and/or lands you control, then return those cards to the battlefield under your control.", "pt": null, "ci": "U", "cmc": 3.0, "price_usd": 2.52, "game_changer": false, "edhrec_rank": 594, "images": [{"normal": "https://cards.scryfall.io/normal/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "large": "https://cards.scryfall.io/large/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "png": "https://cards.scryfall.io/png/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.png?1783915697", "art_crop": "https://cards.scryfall.io/art_crop/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "artist": "Raymond Swanland"}], "scryfall_uri": "https://scryfall.com/card/cmm/98/ghostly-flicker?utm_source=api", "rulings": [{"published_at": "2017-03-14", "comment": "The two targets can have different card types. For example, you can target one artifact and one creature with Ghostly Flicker."}]}]}]}, "decksets": [{"id": "iroh-tea-master", "meta": {"id": "iroh-tea-master", "name": "Iroh, Tea Master", "commander": "Iroh, Tea Master", "colors": "RW", "featured": true, "trial_label": "Iroh + a wandering gift cast by turn 6", "trial_removed_label": "Iroh removed once", "lists": {"b2": "decks/iroh-tea-master-b2.txt", "b3": "decks/iroh-tea-master-b3.txt"}, "package": "decks/iroh-tea-master-package.json", "pregame": ["This deck gives away cards that keep moving on their own.", "At the start of my combat, Iroh can give one of you a permanent that I control. Then I get an Ally token. The token gets a +1/+1 counter for each permanent I own that one of you controls.", "Each gift then moves again by its own rule. Goblin Festival moves when its holder loses a coin flip. Sokenzan Renegade goes to the player with the most cards in hand. Loxodon Peacekeeper goes to the player with the lowest life. Contested Game Ball goes to whoever hits its holder. Anyone can buy Emberwilde Djinn on their upkeep for {R}{R} or 2 life.", "So the gifts are real tools for you. Use them, pass them on, or send them back to me. A gift that comes back to me does not count for Iroh.", "Answers: kill Iroh and the tokens stop. Kill a gift or send it home and the next token is smaller. Brand takes all my gifts back at once, so watch for one open red mana.", "There are no infinite combos and no locks. The deck wins with Ally tokens that grow each turn, anthems, and an end-step drain from Throne of the God-Pharaoh. Expect a long, busy game."], "how_it_plays_without_the_line": ["The deck runs 7 mana rocks, 6 card-flow cards and 12 interaction spells. Without the gifts, it plays as a Boros tokens deck with removal.", "Iroh can give away any permanent: a used mana rock, his own Food token, a tapped land. Each one still grows the next Ally.", "Ghostly Prison, Windborn Muse and Crawlspace keep borrowed creatures from overrunning you."], "how_it_wins": ["Iroh makes one Ally each turn, and each Ally gets a counter for every gift that is out. Rally the Ranks (naming Ally), Honor of the Pure, Glorious Anthem, Warleader's Call and Heraldic Banner make every token bigger.", "Shared Animosity gives each attacking Ally +1 for every other attacking Ally. Throne of the God-Pharaoh makes each opponent lose 1 life for each tapped creature at your end step, so blockers do not stop it. Warleader's Call deals 1 damage to each opponent when each token enters.", "Cast Brand at the end of the turn before yours: every creature you gave away comes back and attacks with the tokens. Akroma's Will gives the team flying and double strike for one lethal turn. Mob Rule borrows the table's big creatures, and Hellkite Tyrant takes artifacts.", "In the clock model (1,000 seeded games, three opponents at 40 life, us alone), the median turn by which all three are dead is 11. With blockers, two removal spells and gifts sent back, it is 13. See Experiments for the model and its limits."], "b2_swaps": [{"why": "cost (about $45 less)", "out": "Akroma's Will ($17.89), Crawlspace ($10.55), Archivist of Oghma ($5.61), Mentor of the Meek ($4.60)", "in": "Rally the Peasants, Sphere of Safety, Thraben Inspector, Benevolent Bodyguard", "note": "Prices are from the Scryfall snapshot of 2026-11-24. Sphere of Safety is weaker than Crawlspace early, but stronger with many enchantments."}, {"why": "less luck (the table dislikes coin flips)", "out": "Fickle Efreet, Goblin Festival", "in": "Lightning Bolt, Bonesplitter", "note": "This removes the most new gift. Keep Goblin Festival if you keep only one coin-flip card."}, {"why": "less power", "out": "Austere Command, Mob Rule", "in": "Dawn Charm, Inspired Charge", "note": "No board wipe and no table-wide steal. Gifts stay out longer."}, {"why": "more power, still Bracket 2", "out": "Rogue Skycaptain, Act of Authority", "in": "Zidane, Tantalus Thief, Yes Man, Personal Securitron", "note": "No Game Changers added. Both are common in Iroh decks (78% and 72% on EDHREC), so the deck becomes less new."}], "do_not_add": [{"cards": ["Nine Lives"], "reason": "It is in 64% of Iroh decks. With Austere Command and Harmless Offering, Commander Spellbook lists it as a line that makes an opponent lose.", "card_objs": [{"name": "Nine Lives", "mana_cost": "{1}{W}{W}", "type_line": "Enchantment", "oracle_text": "Hexproof\nIf a source would deal damage to you, prevent that damage and put an incarnation counter on this enchantment.\nWhen there are nine or more incarnation counters on this enchantment, exile it.\nWhen this enchantment leaves the battlefield, you lose the game.", "pt": null, "ci": "W", "cmc": 3.0, "price_usd": 0.54, "game_changer": false, "edhrec_rank": 6342, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "large": "https://cards.scryfall.io/large/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "png": "https://cards.scryfall.io/png/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.png?1783930737", "art_crop": "https://cards.scryfall.io/art_crop/front/e/7/e70b7a73-484e-48f1-944c-3d38866cdc20.jpg?1783930737", "artist": "Paul Scott Canavan"}], "scryfall_uri": "https://scryfall.com/card/m21/28/nine-lives?utm_source=api", "rulings": [{"published_at": "2020-06-23", "comment": "Once the first triggered ability is on the stack, it won't trigger again, even if more damage is prevented and more incarnation counters are put onto it."}, {"published_at": "2020-06-23", "comment": "If you counter the first triggered ability or otherwise remove it from the stack, it will just trigger again immediately if Nine Lives still has nine or more incarnation counters on it."}, {"published_at": "2020-06-23", "comment": "The last ability of Nine Lives triggers no matter how it leaves the battlefield."}, {"published_at": "2020-06-23", "comment": "If damage that a source would deal to you can't be prevented, you still put an incarnation counter on Nine Lives."}]}]}, {"cards": ["Venser, Fervent Forger"], "reason": "Commander Spellbook lists it one card from an infinite with Iroh, Stiltzkin or Harmless Offering.", "card_objs": [{"name": "Venser, Fervent Forger", "mana_cost": "{4}{R}{R}", "type_line": "Legendary Creature \u2014 Human Sorcerer", "oracle_text": "Flash\nWhen Venser enters, choose one \u2014\n\u2022 Copy target instant or sorcery spell an opponent controls twice. You may choose new targets for the copies.\n\u2022 Create two tokens that are copies of target permanent an opponent controls. They gain haste. At the beginning of the next end step, sacrifice them.", "pt": "5/3", "ci": "R", "cmc": 6.0, "price_usd": 0.32, "game_changer": false, "edhrec_rank": 13065, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "large": "https://cards.scryfall.io/large/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "png": "https://cards.scryfall.io/png/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.png?1790242646", "art_crop": "https://cards.scryfall.io/art_crop/front/0/d/0de6353b-5c19-40f7-951a-2b600db21846.jpg?1790242646", "artist": "Borja Pindado"}], "scryfall_uri": "https://scryfall.com/card/frc/9/venser-fervent-forger?utm_source=api", "rulings": [{"published_at": "2026-08-21", "comment": "If the copied spell divides damage or distributes counters among a number of targets, the division and number of targets can't be changed. If you choose new targets, you must choose the same number of targets."}, {"published_at": "2026-08-21", "comment": "Any choices made when the spell resolves won't have been made yet when it's copied. Any such choices will be made separately when the copies resolve."}, {"published_at": "2026-08-21", "comment": "The copies will have the same targets as the spell they're copying unless you choose new ones. You may change any number of the targets, including all of them or none of them. If, for one of the targets, you can't choose a new legal target, then it remains unchanged (even if the current target is illegal)."}, {"published_at": "2026-08-21", "comment": "If the spell that's copied has an X whose value was determined as it was cast, the copies have the same value of X."}]}]}, {"cards": ["Mycosynth Lattice"], "reason": "With Hellkite Tyrant it takes every permanent the Tyrant's target controls.", "card_objs": [{"name": "Mycosynth Lattice", "mana_cost": "{6}", "type_line": "Artifact", "oracle_text": "All permanents are artifacts in addition to their other types.\nAll cards that aren't on the battlefield, spells, and permanents are colorless.\nPlayers may spend mana as though it were mana of any color.", "pt": null, "ci": "", "cmc": 6.0, "price_usd": 33.73, "game_changer": false, "edhrec_rank": 2057, "images": [{"normal": "https://cards.scryfall.io/normal/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "large": "https://cards.scryfall.io/large/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "png": "https://cards.scryfall.io/png/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.png?1783934790", "art_crop": "https://cards.scryfall.io/art_crop/front/9/4/94f89714-3b26-46a2-b9a8-3e664f391cd9.jpg?1783934790", "artist": "Anthony S. Waters & Cara Mitten"}], "scryfall_uri": "https://scryfall.com/card/bbd/241/mycosynth-lattice?utm_source=api", "rulings": [{"published_at": "2004-12-01", "comment": "The Lattice\u2019s third ability lets players spend even colorless mana as though it had a color. However, it doesn\u2019t remove restrictions on the mana. For example, Mycosynth Lattice doesn\u2019t allow mana from Vedalken Engineer to be used to cast a nonartifact spell."}, {"published_at": "2004-12-01", "comment": "Mycosynth Lattice turns all permanents on the battlefield into artifacts. Spells on the stack and cards in other zones aren\u2019t permanents, so those spells and cards don\u2019t become artifacts."}, {"published_at": "2004-12-01", "comment": "Mycosynth Lattice\u2019s second ability makes everything, in every zone of the game, colorless."}, {"published_at": "2009-10-01", "comment": "The Lattice\u2019s first ability causes Auras to become artifacts. Combined with March of the Machines from the Mirrodin set, this can then make those Auras become creatures. An Aura that\u2019s also a creature can\u2019t enchant anything. It\u2019s unattached the next time state-based actions are checked, and then immediately put into its owner\u2019s graveyard as a second state-based action."}]}]}, {"cards": ["Storm Herd"], "reason": "With Warleader's Call, Commander Spellbook lists a near-infinite damage line.", "card_objs": [{"name": "Storm Herd", "mana_cost": "{8}{W}{W}", "type_line": "Sorcery", "oracle_text": "Create X 1/1 white Pegasus creature tokens with flying, where X is your life total.", "pt": null, "ci": "W", "cmc": 10.0, "price_usd": 1.2, "game_changer": false, "edhrec_rank": 2846, "images": [{"normal": "https://cards.scryfall.io/normal/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "large": "https://cards.scryfall.io/large/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "png": "https://cards.scryfall.io/png/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.png?1783928328", "art_crop": "https://cards.scryfall.io/art_crop/front/2/3/2345331c-a14f-4b4b-a9a4-88c5beb48242.jpg?1783928328", "artist": "Jim Nelson"}], "scryfall_uri": "https://scryfall.com/card/khc/33/storm-herd?utm_source=api", "rulings": []}]}, {"cards": ["Witch Hunt", "Jinxed Choker"], "reason": "These only hurt their holder. Each gift in this deck gives its holder a choice, and these do not.", "card_objs": [{"name": "Witch Hunt", "mana_cost": "{4}{R}", "type_line": "E  [{"published_at": "2021-07-23", "comment": "An ability that tells you to roll a die will also specify what to do with the result of that roll. Most often, this is in the form of a \u201cresults table\u201d in the card text."}, {"published_at": "2021-07-23", "comment": "An effect that says \u201cchoose a target, then roll a d20\u201d or similar still uses the normal process of putting an ability on the stack and resolving it. Choosing targets is part of putting the ability on the stack and rolling the d20 happens later, as the ability resolves."}, {"published_at": "2021-07-23", "comment": "Dice are identified by the number of faces each one has. For example, a d20 is a twenty-sided die."}, {"published_at": "2021-07-23", "comment": "Some effects instruct you to roll again. This uses the same number and type of dice as the original roll, and that roll will use the same set of possible outcomes."}]}}, {"card": "Hithlain Rope", "rate": 0.6606, "card_obj": {"name": "Hithlain Rope", "mana_cost": "{2}", "type_line": "Artifact", "oracle_text": "This artifact can't be sacrificed.\n{1}, {T}: Search your library for a basic land card, put it onto the battlefield tapped, then shuffle. The player to your right gains control of this artifact.\n{2}, {T}: Draw a card. The player to your right gains control of this artifact.", "pt": null, "ci": "", "cmc": 2.0, "price_usd": 0.39, "game_changer": false, "edhrec_rank": 5198, "images": [{"normal": "https://cards.scryfall.io/normal/front/b/b/bbe6e907-eafb-402c-8b8f-4c01fb168a0b.jpg?1783916014", "large": "https://cards.scryfall.io/large/front/b/b/bbe6e907-eafb-402c-8b8f-4c01fb168a0b.jpg?1783916014", "png": "https://cards.scryfall.io/png/front/b/b/bbe6e907-eafb-402c-8b8f-4c01fb168a0b.png?1783916014", "art_crop": "https://cards.scryfall.io/art_crop/front/b/b/bbe6e907-eafb-402c-8b8f-4c01fb168a0b.jpg?1783916014", "artist": "Josu Solano"}], "scryfall_uri": "https://scryfall.com/card/ltc/76/hithlain-rope?utm_source=api", "rulings": [{"published rn 6, 7-card hand on the draw)": 0.8806, "P(>=1 of 14 bait pieces seen by turn 8, 7-card hand on the draw)": 0.9165}}, "clock": {"deck": "decks/iroh-tea-master-b2.txt", "model": "clock-v1", "notes": "Clock model: how fast a deck can kill three opponents at 40 life.\n\nThis extends the draw and mana trials (trials.py) with a small combat model. It is a goldfish with\noptional table pressure, not a game engine. Every number it reports depends on the assumptions below.\n\nModeled:\n- Our creatures attack every turn after the turn they enter (no haste). Damage goes to the opponent\n  with the lowest life, and any extra damage goes to the next one.\n- Iroh: at each combat, give one permanent (first a non-creature gift, then Iroh's Food, then a\n  creature gift, then a mana rock). Then create a 1/1 Ally with one +1/+1 counter for each gift out.\n  A creature gift we still control leaves on our next upkeep with probability 0.5 (its own rule moves it).\n  Brand is cast once 4 or more gifts are out: gifted creatures come back and can attack that turn.\n- Anthems: Intangible Virtue and Heraldic Banner (+1 to tokens), Glorious Anthem (+1 to all).\n  Honor of the Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted).\nNot modeled: opponents' attacks on us, our life, Mob Rule, Goblin Festival pings, burn spells, opponents'\ngifts used against us, combat tricks, and politics. Opponents' creatures are not simulated, only abstracted.\n\nScenarios:\n- goldfish: no blockers, no removal, nobody returns gifts.\n- table: each turn the opponents block our largest attacker without flying (it deals no damage; Akroma's\n  Will and Keeper of Keys stop the block). The crown moves each round with probability 0.5: from us to an\n  opponent, or from one opponent to another (Garland then takes a new hostage). The commander is removed once on the first turn from turn 5 on that it is out,\n  and our largest creature is removed on turns 8 and 11. For Iroh, opponents send one gift back on\n  each of our upkeeps with probability 0.5.", "goldfish": {"scenario": "goldfish", "n": 1000, "seed": 7, "turns_simulated": 16, "median_kill_all_turn": 11.0, "median_first_kill_turn": 8.0, "no_kill_by_turn_16": 0.029, "all_dead_by_turn8": [0.004, [0.002, 0.01]], "all_dead_by_turn10": [0.268, [0.241, 0.296]], "all_dead_by_turn12": [0.738, [0.71, 0.764]], "all_dead_by_turn14": [0.914, [0.895, 0.93]], "brand_cast_share": 0.156, "median_brand_turn": 10.0, "akromas_will_cast_share": 0.156}, "table": {"scenario": "table", "n": 1000, "seed": 7, "turns_simulated": 16, "median_kill_all_turn": 13.0, "median_first_kill_turn": 10.0, "no_kill_by_turn_16": 0.033, "all_dead_by_turn8": [0.0, [0.0, 0.004]], "all_dead_by_turn10": [0.081, [0.066, 0.1]], "all_dead_by_turn12": [0.441, [0.411, 0.472]], "all_dead_by_turn14": [0.815, [0.79, 0.838]], "brand_cast_share": 0.15, "median_brand_turn": 11.0, "akromas_will_cast_share": 0.188}}}, "b3": {"file": "decks/iroh-tea-master-b3.txt", "groups": [{"title": "Commander", "cards": [{"qty": 1, "name": "Iroh, Tea Master", "mana_cost": "{1}{R}{W}", "type_line": "Legendary Creature \u2014 Human Citizen Ally", "oracle_text": "When Iroh enters, create a Food token.\nAt the beginning of combat on your turn, you may have target opponent gain control of target permanent you control. When you do, create a 1/1 white Ally creature token. Put a +1/+1 counter on that token for each permanent you own that your opponents control.", "pt": "2/2", "ci": "RW", "cmc": 3.0, "price_usd": 0.36, "game_changer": false, "edhrec_rank": 9728, "images": [{"normal": "https://cards.scryfall.io/normal/front/d/1/d1f5e10d-0a89-4129-9717-a921f20d3616.jpg?1783904925", "large": "https://cards.scryfall.io/large/front/d/1/d1f5e10d-0a89-4129-9717-a921f20d3616.jpg?1783904925", "png": "https://cards.scryfall.io/png/front/d/1/d1f5e10d-0a89-4129-9717-a921f20d36 e lands' mana abilities (such as Contamination's effect, for example). If there is more than one, consider them in any possible order."}, {"published_at": "2009-10-01", "comment": "Fellwar Stone checks the effects of all mana-producing abilities of lands your opponents control, but it doesn't check their costs. For example, Vivid Crag has the ability \"{T}, Remove a charge counter from Vivid Crag: Add one mana of any color.\" If an opponent controls Vivid Crag and you control Fellwar Stone, you can tap Fellwar Stone for any color of mana. It doesn't matter whether Vivid Crag has a charge counter on it, and it doesn't matter whether it's untapped."}, {"published_at": "2009-10-01", "comment": "The colors of mana are white, blue, black, red, and green. Fellwar Stone can't be tapped for colorless mana, even if a land an opponent controls could produce colorless mana."}]}, {"qty": 1, "name": "Enlightened Tutor", "mana_cost": "{W}", "type_line": "Instant", "oracle_text": "Search your library for an artifact or enchantment card, reveal it, then shuffle and put that card on top.", "pt": null, "ci": "W", "cmc": 1.0, "price_usd": 37.39, "game_changer": true, "edhrec_rank": 125, "images": [{"normal": "https://cards.scryfall.io/normal/front/1/c/1c9675fb-1a89-420f-aea8-50e0642f549c.jpg?1783918516", "large": "https://cards.scryfall.io/large/front/1/c/1c9675fb-1a89-420f-aea8-50e0642f549c.jpg?1783918516", "png": "https://cards.scryfall.io/png/front/1/c/1c9675fb-1a89-420f-aea8-50e0642f549c.png?1783918516", "art_crop": "https://cards.scryfall.io/art_crop/front/1/c/1c9675fb-1a89-420f-aea8-50e0642f549c.jpg?1783918516", "artist": "Howard Lyon"}], "scryfall_uri": "https://scryfall.com/card/dmr/6/enlightened-tutor?utm_source=api", "rulings": [{"published_at": "2016-06-08", "comment": "The \"shuffle and put the card on top\" is a single action. If an effect causes the top card of the library to be face up, the second card down is not revealed."}]}, {"qty": 1, "name": "Jeska's Will", "mana_ +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Fliers: the table's blocker , "lists": {"b2": "decks/garland-royal-kidnapper-b2.txt", "b3": "decks/garland-royal-kidnapper-b3.txt"}, "package": "decks/garland-royal-kidnapper-package.json", "pregame": ["This deck gives the crown away on purpose.", "When Garland enters, one of you becomes the monarch. While you hold the crown, I hold one of your creatures. It gets +2/+2 and it can attack anyone, you included.", "The crown still draws you a card at each end step. Anyone who hits the monarch takes the crown and the card. The old monarch gets their creature back at once. Then Garland takes a creature from the new monarch.", "So every turn you choose: take the crown and lose a creature, or leave it and let the current monarch pay for it.", "Answers: kill or bounce the hostage, move the crown in response to Garland's trigger, or remove Garland. If Garland goes, the current hostage stays with me until the crown moves.", "The crown still pays: it draws you an extra card. But with Underworld Dreams or Fate Unraveler out, each card you draw costs 1 life. Court of Ambition asks you to lose life or discard, and Megrim makes a discard cost 2 life too.", "There are no infinite combos and no locks. The deck wins with stolen creatures and with life loss from the crown: Underworld Dreams and Fate Unraveler deal 1 damage for each card you draw, so the crown's extra card costs 1 life. Expect a long game, not a fast one."], "how_it_plays_without_the_line": ["The deck runs 9 mana rocks, 7 card-draw spells and 13 interaction spells. Without the crown it plays as a Dimir control deck that steals threats and drains.", "Hostage Taker, Control Magic, Sower of Temptation and Brainstealer Dragon steal permanents without the crown. Garland still gives those creatures +2/+2.", "Wan Shi Tong draws a card each time an opponent searches. Fetchlands and ramp spells at a normal table give it fuel.", "The Courts and Thorn of the Black Rose make you the monarch. Then the crown draws cards for you until an opponent takes it."], "how_it_wins": ["Stolen creatures with +2/+2 attack the player who is the weakest at the table. Whispersilk Cloak makes the best one unblockable.", "The crown's extra cards cost life: Underworld Dreams and Fate Unraveler deal 1 damage for each card an opponent draws, and Archivist of Gondor gives the monarch a second extra card.", "Court of Ambition, Megrim and Painful Quandary make each choice cost life: lose 3 to 6 life, or discard and take 2. Palace Siege drains 2 from each opponent every turn.", "Gray Merchant of Asphodel and Exsanguinate finish the game. Keeper of Keys makes your creatures unblockable on each turn that you start as the monarch.", "In the clock model (1,000 seeded games, three opponents at 40 life, us alone), the median turn by which all three are dead is 12. With blockers, removal and the crown moving, it is 15. See Experiments for the model and its limits."], "b2_swaps": [{"why": "cost (about $60 less)", "out": "Wan Shi Tong, Librarian ($28.60), Faerie Mastermind ($13.02), Brainstealer Dragon ($11.39), Morphic Pool ($8.20)", "in": "Mind Harness, Dissolve, Pongify, Swamp", "note": "Prices are from the Scryfall snapshot of 2026-11-24. The search package loses its main payoff, so the deck relies more on the crown."}, {"why": "repetition (the table is tired of the crown)", "out": "Archivist of Gondor, Crown of Doom", "in": "Dissipate, Pongify", "note": "The crown draws fewer cards, so fewer players chase it."}, {"why": "less power", "out": "Toxic Deluge, Crux of Fate", "in": "Aetherize, Curtains' Call", "note": "No full board wipe. Stolen creatures stay longer."}, {"why": "more power, still Bracket 2", "out": "Fact or Fiction, Sign in Blood", "in": "Agent of Treachery, Mind Harness", "note": "No Game Changers added."}, {"why": "less punishing (the table dislikes life-loss taxes)", "out": "Painful Quandary, Megrim", "in": "Negate, Reality Shift", "note": "The deck wins about one turn later in the clock model, but opponents keep their choices free."}] re] enters\" or \"[this creature] enters with\" abilities of the creature will also work."}, {"published_at": "2025-09-19", "comment": "If the copied creature has {X} in its mana cost, X is 0."}]}]}, {"cards": ["Notion Thief"], "reason": "It removes the monarch's extra card. Then nobody wants the crown and the deck stops working socially.", "card_objs": [{"name": "Notion Thief", "mana_cost": "{2}{U}{B}", "type_line": "Creature \u2014 Human Rogue", "oracle_text": "Flash\nIf an opponent would draw a card except the first one they draw in each of their draw steps, instead that player skips that draw and you draw a card.", "pt": "3/1", "ci": "BU", "cmc": 4.0, "price_usd": 1.75, "game_changer": true, "edhrec_rank": 1232, "images": [{"normal": "https://cards.scryfall.io/normal/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "large": "https://cards.scryfall.io/large/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "png": "https://cards.scryfall.io/png/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.png?1783929456", "art_crop": "https://cards.scryfall.io/art_crop/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "artist": "Clint Cearley"}], "scryfall_uri": "https://scryfall.com/card/znc/96/notion-thief?utm_source=api", "rulings": [{"published_at": "2018-03-16", "comment": "If an opponent is instructed to draw a card then discard a card, and Notion Thief causes you to draw a card instead, that opponent still discards a card. The same is true of any other actions that opponent is instructed to do."}, {"published_at": "2018-03-16", "comment": "If two or more players each control a Notion Thief and a player would draw a card other than the first one in their draw step, that player chooses one of the applicable Notion Thief effects to apply. Then the player whose Notion Thief's effect was chosen repeats this process among the remaining Notion Thief effects, and so on, until there are no more possible such effects to apply. Each effect d \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2020-11-10", "comment": "If combat damage dealt to the monarch causes that player to lose the game, the triggered ability that causes the controller of the attacking creature to become the monarch doesn't resolve. In most cases, the controller of the attacking creature will still become the monarch as it is likely their turn."}, {"published_at": "2020-11-10", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2020-11-10", "comment": "Azure Fleet Admiral's last ability normally means that it can't be blocked while attacking the monarch or a planeswalker the monarch controls. In some variants with shared team turns, such as Two-Headed Giant, creatures controlled by the monarch's teammate can block Azure Fleet Admiral, even if it's attacking the monarch."}]}}, {"card": "Thorn of the Black Rose", "rate": null, "card_obj": {"name": "Thorn of the Black Rose", "mana_cost": "{3}{B}", "type_line": "Creature \u2014 Human Assassin", "oracle_text": "Deathtouch\nWhen this creature enters, you become the monarch.", "pt": "1/3", "ci": "B", "cmc": 4.0, "price_usd": 0.15, "game_changer": false, "edhrec_rank": 10019, "images": [{"normal": "https://cards.scryfall.io/normal/front/b/4/b4b266e2-1cad-40df-bc0e-3e1464b299b3.jpg?1783915664", "large": "https://cards.scryfall.io/large/front/b/4/b4b266e2-1cad-40df-bc0e-3e1464b299b3.jpg?1783915664", "png": "https://cards.scryfall.io/png/front/b/4/b4b266e2-1cad-40df-bc0e-3e1464b299b3.png?1783915664", "art_crop": "https://cards.scryfall.io/art_crop/front/b/4/b4b266e2-1cad-40df-bc0e-3e1464b299b3.jpg?1783915664", "artist": "David Gaillet"}], "scryfall_uri": "https://scryfall.com/card/cmm/190/thorn-of-the-black-rose?utm_source=api", "rulings": [{"published 1, "name": "Path of Ancestry", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\n{T}: Add one mana of any color in your commander's color identity. When that mana is spent to cast a creature spell that shares a creature type with your commander, scry 1. (Look at the top card of your library. You may put that card on the bottom.)", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 15, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "large": "https://cards.scryfall.io/large/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "png": "https://cards.scryfall.io/png/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.png?1793021342", "art_crop": "https://cards.scryfall.io/art_crop/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "artist": "Arthur Yuan"}], "scryfall_uri": "https://scryfall.com/card/trc/545/path-of-ancestry?utm_source=api", "rulings": [{"published_at": "2020-11-10", "comment": "If your commander has no creature types, it can't share a creature type with any spell that you cast."}, {"published_at": "2020-11-10", "comment": "If your commander is a card that has no colors in its color identity, Path of Ancestry's ability produces no mana. It doesn't produce {C}."}, {"published_at": "2023-07-28", "comment": "If you have two commanders, the last ability adds one mana of any color in their combined color identities. When you spend that mana on a creature spell that shares a creature type with either of your commanders, you'll scry 1."}, {"published_at": "2023-07-28", "comment": "Your commander's creature types are checked immediately after you cast a creature spell spending mana from Path of Ancestry's last ability. They aren't set before the game begins, and they may not be the same types your commander had when you activated that ability."}]}, {"qty": 1, "name": "Exotic Orchard", "mana_cost": "", "type_line": "Land", "oracle_text": "{T}: Add one mana of any color that a land an opponent controls could produce.", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.18, "game_changer": false, "edhrec_rank": 9, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "large": "https://cards.scryfall.io/large/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "png": "https://cards.scryfall.io/png/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.png?1793021293", "art_crop": "https://cards.scryfall.io/art_crop/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "artist": "Leon Tukker"}], "scryfall_uri": "https://scryfall.com/card/trc/528/exotic-orchard?utm_source=api", "rulings": [{"published_at": "2009-02-01", "comment": "Lands that produce mana based only on what other lands \"could produce\" won't help each other unless some other land allows one of them to actually produce some type of mana. For example, if you control an Exotic Orchard and your opponent controls an Exotic Orchard and a Reflecting Pool, none of those lands would produce mana if their mana abilities were activated. On the other hand, if you control a Forest and an Exotic Orchard, and your opponent controls an Exotic Orchard and a Reflecting Pool, then each of those lands can be tapped to produce {G}. Your opponent's Exotic Orchard can produce {G} because you control a Forest. Your Exotic Orchard and your opponent's Reflecting Pool can each produce {G} because your opponent's Exotic Orchard can produce {G}."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard doesn't care about any restrictions or riders your opponents' lands (such as Ancient Ziggurat or Hall of the Bandit Lord) put on the mana they produce. It just cares about colors of mana."}, {"published_at": "2009-02-01", "comment": "When determining what colors of mana your opponents' lands could produce, Exotic Orchard takes into account any applicable replacement effects that would apply to those lands' mana abilities (such as Contamination's effect, for example). If there are more than one, consider them in any possible order."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard checks the effects of all mana-producing abilities of lands your opponents control, but it doesn't check their costs. For example, Vivid Crag has the ability \"{T}, Remove a charge counter from Vivid Crag: Add one mana of any color.\" If an opponent controls Vivid Crag and you control Exotic Orchard, you can tap Exotic Orchard for any color of mana. It doesn't matter whether Vivid Crag has a charge counter on it, and it doesn't matter whether it's untapped."}]}, {"qty": 1, "name": "Dimir Aqueduct", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\nWhen this land enters, return a land you control to its owner's hand.\n{T}: Add {U}{B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.34, "game_changer": false, "edhrec_rank": 395, "images": [{"normal": "https://cards.scryfall.io/normal/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "large": "https://cards.scryfall.io/large/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "png": "https://cards.scryfall.io/png/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.png?1783909578", "art_crop": "https://cards.scryfall.io/art_crop/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "artist": "John Avon"}], "scryfall_uri": "https://scryfall.com/card/dsc/270/dimir-aqueduct?utm_source=api", "rulings": [{"published_at": "2013-04-15", "comment": "If this land enters the battlefield and you control no other lands, its ability will force you to return it to your hand."}]}, {"qty": 1, "name": "Temple of Deceit", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\nWhen this land enters, scry 1. (Look at the top card of your library. You may put that card on the bottom.)\n{T}: Add {U} or {B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.34, "game_changer": false, "edhrec_rank": 378, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "large": "https://cards.scryfall.io/large/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "png": "https://cards.scryfall.io/png/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.png?1783908897", "art_crop": "https://cards.scryfall.io/art_crop/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "artist": "Jonas De Ro"}], "scryfall_uri": "https://scryfall.com/card/fdn/697/temple-of-deceit?utm_source=api", "rulings": [{"published_at": "2013-09-15", "comment": "You perform the actions stated on a card in sequence. For some spells and abilities, that means you'll scry last. For others, that means you'll scry and then perform other actions."}, {"published_at": "2013-09-15", "comment": "Scry appears on some spells and abilities with one or more targets. If all of the spell or ability's targets are illegal when it tries to resolve, it won't resolve and none of its effects will happen. You won't scry."}, {"published_at": "2013-09-15", "comment": "When you scry, you may put all the cards you look at back on top of your library, you may put all of those cards on the bottom of your library, or you may put some of those cards on top and the rest of them on the bottom."}, {"published_at": "2013-09-15", "comment": "You choose how to order cards returned to your library after scrying no matter where you put them."}]}, {"qty": 1, "name": "Choked Estuary", "mana_cost": "", "type_line": "Land", "oracle_text": "As this land enters, you may reveal an Island or Swamp card from your hand. If you don't, this land enters tapped.\n{T}: Add {U} or {B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.29, "game_changer": false, "edhrec_rank": 293, "images": [{"normal": "https://cards.scryfall.io/normal/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "large": "https://cards.scryfall.io/large/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "png": "https://cards.scryfall.io/png/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.png?1793021260", "art_crop": "https://cards.scryfall.io/art_crop/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "artist": "Jessica Rossier"}], "scryfall_uri": "https://scryfall.com/card/trc/517/choked-estuary?utm_source=api", "rulings": [{"published_at": "2016-04-08", "comment": "If an effect instructs you to put Choked Estuary onto the battlefield tapped, it will still enter the battlefield tapped even if you reveal a land card from your hand."}, {"published_at": "2016-04-08", "comment": "Lands don't have a subtype just because they can produce mana of the corresponding color. Choked Estuary itself is neither an Island nor a Swamp, even though it produces blue and black mana, so you can't reveal one to satisfy the ability of another."}, {"published_at": "2016-04-08", "comment": "If an Island or Swamp is entering the battlefield from your hand at the same time as Choked Estuary, you may reveal the other land to have Choked Estuary enter untapped."}, {"published_at": "2016-04-08", "comment": "You may reveal any land card with either or both of the appropriate subtypes. It doesn't have to be a basic land. For example, you could reveal Prairie Stream from the Battle for Zendikar set to satisfy the ability of Choked Estuary."}]}, {"qty": 1, "name": "Sunken Hollow", "mana_cost": "", "type_line": "Land \u2014 Island Swamp", "oracle_text": "({T}: Add {U} or {B}.)\nThis land enters tapped unless you control two or more basic lands.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.24, "game_changer": false, "edhrec_rank": 87, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.jpg?1793021388", "large": "https://cards.scryfall.io/large/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.jpg?1793021388", "png": "h ext one.\n- Iroh: at each combat, give one permanent (first a non-creature gift, then Iroh's Food, then a\n  creature gift, then a mana rock). Then create a 1/1 Ally with one +1/+1 counter for each gift out.\n  A creature gift we still control leaves on our next upkeep with probability 0.5 (its own rule moves it).\n  Brand is cast once 4 or more gifts are out: gifted creatures come back and can attack that turn.\n- Anthems: Intangible Virtue and Heraldic Banner (+1 to tokens), Glorious Anthem (+1 to all).\n  Honor of the Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted).\nNot modeled: opponents' attacks on us, our life, Mob Rule, Goblin Festival pings, burn spells, opponents'\ngifts used against us, combat tricks, and politics. Opponents' creatures are not simulated, only abstracted.\n\nScenarios:\n- goldfish: no blockers, no removal, nobody returns gifts.\n- table: each turn the opponents block our largest attacker without flying (it deals no damage; Akroma's\n  Will and Keeper of Keys stop the block). The crown moves each round with probability 0.5: from us to an\n  opponent, or from one opponent to another (Garland then takes a new hostage). The commander is removed once on the first turn from turn 5 on that it is out,\n  and our largest creature is removed on turns 8 and 11. For Iroh, opponents send one gift back on\n  each of our upkeeps with probability 0.5.", "goldfish": {"scenario": "goldfish", "n": 1000, "seed": 7, "turns_simulated": 16, "median_kill_all_turn": 12.0, "median_first_kill_turn": 9.0, "no_kill_by_turn_16": 0.008, "all_dead_by_turn8": [0.0, [0.0, 0.004]], "all_dead_by_turn10": [0.091, [0.075, 0.11]], "all_dead_by_turn12": [0.663, [0.633, 0.692]], "all_dead_by_turn14": [0.937, [0.92, 0.95]], "akromas_will_cast_share": 0.0}, "table": {"scenario": "table", "n": 1000, "seed": 7, "turns_simulated": 16, "media  "https://cards.scryfall.io/large/front/a/3/a3f31ac4-09ca-4712-a311-50d28824bfad.jpg?1783903208", "png": "https://cards.scryfall.io/png/front/a/3/a3f31ac4-09ca-4712-a311-50d28824bfad.png?1783903208", "art_crop": "https://cards.scryfall.io/art_crop/front/a/3/a3f31ac4-09ca-4712-a311-50d28824bfad.jpg?1783903208", "artist": "Josu Hernaiz"}], "scryfall_uri": "https://scryfall.com/card/msc/225/whispersilk-cloak?utm_source=api", "rulings": []}]}, {"title": "Value creatures and finishers", "cards": [{"qty": 1, "name": "Ravenous Chupacabra", "mana_cost": "{2}{B}{B}", "type_line": "Creature \u2014 Beast Horror", "oracle_text": "When this creature enters, destroy target creature an opponent controls.", "pt": "2/2", "ci": "B", "cmc": 4.0, "price_usd": 0.92, "game_changer": false, "edhrec_rank": 1171, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/4/a4dfbac0-1849-41c5-853a-1fee108d0b01.jpg?1783913009", "large": "https://cards.scryfall.io/large/front/a/4/a4dfbac0-1849-41c5-853a-1fee108d0b01.jpg?1783913009", "png": "https://cards.scryfall.io/png/front/a/4/a4dfbac0-1849-41c5-853a-1fee108d0b01.png?1783913009", "art_crop": "https://cards.scryfall.io/art_crop/front/a/4/a4dfbac0-1849-41c5-853a-1fee108d0b01.jpg?1783913009", "artist": "Daarken"}], "scryfall_uri": "https://scryfall.com/card/mkc/136/ravenous-chupacabra?utm_source=api", "rulings": []}, {"qty": 1, "name": "Gray Merchant of Asphodel", "mana_cost": "{3}{B}{B}", "type_line": "Creature \u2014 Zombie", "oracle_text": "When this creature enters, each opponent loses X life, where X is your devotion to black. You gain life equal to the life lost this way. (Each {B} in the mana costs of permanents you control counts toward your devotion to black.)", "pt": "2/4", "ci": "B", "cmc": 5.0, "price_usd": 4.61, "game_changer": false, "edhrec_rank": 240, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/0/00d001d0-fd29-4b7c-9d0e-9131b995f910.jpg?1783909617", "large": "https://cards.scryfall.io/large/front/0/0/00
