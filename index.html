  linear-gradient(90deg, rgba(12,10,8,.88) 0%, rgba(12,10,8,.62) 45%, rgba(12,10,8,.18) 100%),
  linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.55) 100%); }

}
.hero .content { position: relative; padding: 28px; color: #f6f2e8; max-width: 760px; }
.hero h1 { margin: .2rem 0 .4rem; font-size: clamp(1.7rem, 4vw, 2.6rem); }
.hero p { margin: .3rem 0; color: #e9e3d4; }
.kicker { text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; color: #e0c27a; font-weight: 600; }
.hero .credit { position: absolute; right: 12px; bottom: 8px; font-size: .7rem; color: #cfc8b8; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat .v { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-2); font-size: .85rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

.badge { display: inline-flex; align-items: center; gap: .3em; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: .15rem .55rem; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); } .badge.neutral { color: var(--text-2); }

/* Card art */
.cardimg { width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; object-fit: cover; display: block; background: var(--surface-2); box-shadow: var(--shadow); cursor: zoom-in; transition: transform .15s ease; }
.cardimg:hover { transform: translateY(-3px) scale(1.02); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.strip figure { margin: 0; }
.strip figcaption { font-size: .82rem; color: var(--text-2); margin-top: 6px; }
.strip figcaption b { color: var(--text); display: block; font-size: .86rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.grid .cell { position: relative; }
.grid .qty { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.75); color: #fff; font-size: .75rem; font-weight: 600; border-radius: 999px; padding: 0 .5em; }
.grid .gc { position: absolute; top: 6px; right: 6px; background: var(--bad); color: #fff; font-size: .68rem; border-radius: 999px; padding: 0 .5em; }
.missing { display: grid; place-items: center; text-align: center; padding: 8px; font-size: .8rem; color: var(--text-2); border: 1px dashed var(--line); }

.finding { scroll-margin-top: 70px; }
.finding .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.finding .head h2 { margin: 0; margin-right: auto; }
.story { font-style: italic; color: var(--text-2); border-left: 3px solid var(--gold); padding-left: 10px; margin: 10px 0; }
ol.seq li { margin: .3rem 0; }
.dec { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.dec div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.dec b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); }

.scores { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 4px 10px; align-items: center; font-size: .85rem; }
.scores .bar { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.scores .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.scores .s i { background: var(--series-1); } .scores .r i { background: var(--series-2); }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

details.trace { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--surface); }
details.trace summary { cursor: pointer; padding: 10px 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.trace .body { padding: 0 14px 12px; }
.asserts li { list-style: none; margin: 2px 0; } .asserts { padding-left: 0; }
.asserts .y { color: var(--ok); font-weight: 700; } .asserts .n { color: var(--bad); font-weight: 700; }
pre.log { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: .8rem; overflow-x: auto; }

.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--text-2); margin: 4px 0 8px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: .78rem; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; z-index: 5; }

dialog.modal { border: none; border-radius: 16px; padding: 0; max-width: min(920px, calc(100vw - 32px)); width: 100%; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
dialog.modal::backdrop { background: rgba(0,0,0,.65); }
.modal .inner { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 20px; padding: 20px; }
@media (max-width: 720px) { .modal .inner { grid-template-columns: 1fr; } }
.modal .oracle { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: .9rem; }
.modal .close { position: absolute; right: 10px; top: 10px; }
.modal .faces { display: grid; gap: 10px; }
.printcard { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; }
.printcard .line { border-bottom: 1px solid var(--line); height: 1.6em; }
@media print { header.top, nav, .noprint { display: none !important; } body { background: #fff; color: #000; } .panel { box-shadow: none; } }
.muted { color: var(--text-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .78rem; background: var(--surface-2); border-radius: 999px; padding: .1rem .55rem; color: var(--text-2); }
.swap { display: grid; grid-template-columns: 96px 24px 96px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.swap .arrow { text-align: center; color: var(--text-2); }

.frow > div:last-child { min-width: 0; overflow-wrap: anywhere; }
.steps { list-style: none; padding: 0; margin: 14px 0; counter-reset: s; }
.steps > li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 10px; box-shadow: var(--shadow); }
.steps > li > div:last-child { min-width: 0; }
.steps h3 { margin: 0 0 6px; }

.num-big { font-family: Cinzel, Georgia, serif; font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1.1; overflow-wrap: anywhere; }

@media (max-width: 560px) { .steps > li { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 16px 0 6px; }
.pillars div { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 12px; padding: 12px 14px; }

.funnel { list-style: none; padding: 0; margin: 10px 0 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.funnel li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
.funnel b { display: block; font-family: Cinzel, Georgia, serif; font-size: 1.5rem; color: var(--gold); line-height: 1.15; }
.funnel span { font-size: .85rem; color: var(--text-2); }
.decklist { display: grid; gap: 14px; }
.deckcard { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.deckcard.featured { border-color: var(--gold); grid-template-columns: 320px minmax(0, 1fr); }
.deckcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; }
.deckcard h3 { margin: 2px 0 6px; font-size: 1.3rem; }
.deckcard p { margin: 0 0 10px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 0 0 10px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 1.1rem; }
.kv span { font-size: .78rem; color: var(--muted); }
@media (max-width: 700px) { .deckcard, .deckcard.featured { grid-template-columns: minmax(0, 1fr); } }
.hero .content { padding-bottom: 40px; }
/* Phones: kept last so these rules win over the base rules above. */
@media (max-width: 760px) {
  header.top .wrap { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 4px; min-height: 0; padding-block: 8px 6px; }
  .brand { font-size: .95rem; margin: 0; }
  nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
        -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); padding-right: 18px; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; scroll-snap-align: start; padding: .45rem .75rem; min-height: 38px; }
  nav button .long { display: none; }
  nav button .short { display: inline; }
  .theme-toggle { width: 38px; height: 38px; }
  h2 { font-size: 1.25rem; margin: 1.5rem 0 .6rem; }
  .panel { padding: 14px; border-radius: 12px; }
  .hero { min-height: 0; margin: 12px 0; border-radius: 14px; }
  .hero .content { padding: 22px 18px 34px; }
  .hero h1 { font-size: 1.55rem; }

  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  .mini img { width: 30px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .deckcard { padding: 12px; gap: 12px; }
  .deckcard img { aspect-ratio: 16 / 9; }
  .pillars span, .funnel span { font-size: .84rem; }
  .tip { white-space: normal; width: max-content; max-width: 220px; }
  dialog.modal { max-width: 100vw; max-height: 100dvh; height: 100dvh; margin: 0; border-radius: 0; }
  .modal .inner { padding: 56px 16px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 100dvh; box-sizing: border-box; }
  .modal .faces img { max-width: 300px; margin: 0 auto; display: block; }
  .modal .close { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 2; width: 40px; height: 40px; }
}
</style>

": "2025-10-02", "comment": "If you leave the game, all permanents you own leave the game with you."}]}}, {"id": "garland-carousel", "title": "Garland steals from whoever holds the crown", "in_deck": null, "cards": [{"name": "Garland, Royal Kidnapper", "role": "engine (commander): makes an opponent the monarch, then holds one of their creatures for as long as they keep the crown", "mana_cost": "{2}{U}{B}", "type_line": "Legendary Creature \u2014 Human Knight", "oracle_text": "When Garland enters, target opponent becomes the monarch.\nWhenever an opponent becomes the monarch, gain control of target creature that player controls for as long as they're the monarch.\nCreatures you control but don't own get +2/+2 and can't be sacrificed.", "pt": "3/4", "ci": "BU", "cmc": 4.0, "price_usd": 9.7, "game_changer": false, "edhrec_rank": 11855, "images": [{"normal": "https://cards.scryfall.io/normal/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "large": "https://cards.scryfall.io/large/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "png": "https://cards.scryfall.io/png/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.png?1783904658", "art_crop": "https://cards.scryfall.io/art_crop/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "artist": "David Rapoza"}], "scryfall_uri": "https://scryfall.com/card/fic/442/garland-royal-kidnapper?utm_source=api", "rulings": [{"published_at": "2025-10-02", "comment": "The owner of a token is the player who created that token or, in the case of a resolving copy of a permanent spell that became a token, the player who controlled that spell as it resolved."}, {"published_at": "2025-10-02", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2025-10-02", "comment": "There are two inherent triggered abilities associated with being the monarch. These triggered abilities have no source and are controlled by the player who was the monarch at the time the abilities triggered. The full texts of these abilities are \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2025-10-02", "comment": "While Garland's second ability is on the stack, if that opponent stops being the monarch before it resolves, you won't gain control of the target creature at all."}]}, {"name": "Court of Locthwain", "role": "bait: makes YOU the monarch, so the next opponent who hits you takes the crown and triggers Garland", "mana_cost": "{2}{B}{B}", "type_line": "Enchantment", "oracle_text": "When this enchantment enters, you become the monarch.\nAt the beginning of your upkeep, exile the top card of target opponent's library. You may play that card for as long as it remains exiled, and mana of any type can be spent to cast it. If you're the monarch, until end of turn, you may cast a spell from among cards exiled with this enchantment without paying its mana cost.", "pt": null, "ci": "B", "cmc": 4.0, "price_usd": 5.94, "game_changer": false, "edhrec_rank": 3503, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/8/a8e1f698-1c04-4f31-aeaa-b796c5eb5070.jpg?1783914984", "large": "https://cards.scryfall.io/large/front/a/8/a8e1f698-1c04-4f31-aeaa-b796c5eb5070.jpg?1783914984", "png": "https://cards.scryfall.io/png/front/a/8/a8e1f698-1c04-4f31-aeaa-b796c5eb5070.png?1783914984", "art_crop": "https://cards.scryfall.io/art_crop/front/a/8/a8e1f698-1c04-4f31-aeaa-b796c5eb5070.jpg?1783914984", "artist": "Julie Dillon"}], "scryfall_uri": "https://scryfall.com/card/woc/23/court-of-locthwain?utm_source=api", "rulings": [{"published_at": "2023-09-01", "comment": "You may play the exiled cards (and spend mana of any type to do so) even if Court of Locthwain leaves the battlefield. If another player gains control of Court of Locthwain, that player can't play the cards, and you still can."}, {"published_at": "2023-09-01", "comment": "If combat damage dealt to the monarch causes that player to lose the game, the triggered ability that causes the controller of the attacking creature to become the monarch doesn't resolve. In most cases, the controller of the attacking creature will still become the monarch as it is likely their turn."}, {"published_at": "2023-09-01", "comment": "The six types of mana are white, blue, black, red, green, and colorless. Snow mana is not a type of mana. Court of Locthwain won't let you pay a snow cost using mana produced by a nonsnow source."}, {"published_at": "2023-09-01", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}]}, {"name": "Marchesa's Decree", "role": "toll: attackers pay 1 life, which makes taking the crown from you a real cost", "mana_cost": "{3}{B}", "type_line": "Enchantment", "oracle_text": "When this enchantment enters, you become the monarch.\nWhenever a creature attacks you or a planeswalker you control, that creature's controller loses 1 life.", "pt": null, "ci": "B", "cmc": 4.0, "price_usd": 2.01, "game_changer": false, "edhrec_rank": 6940, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "large": "https://cards.scryfall.io/large/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "png": "https://cards.scryfall.io/png/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.png?1783937352", "art_crop": "https://cards.scryfall.io/art_crop/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "artist": "Chris Rallis"}], "scryfall_uri": "https://scryfall.com/card/cn2/44/marchesas-decree?utm_source=api", "rulings": [{"published_at": "2016-08-23", "comment": "Abilitie rched for a creature card and put it onto the battlefield), those abilities and Ob Nixilis's triggered ability will go on the stack together. The active player puts all of their abilities on the stack in any order, then each other player in turn order does the same. The last ability put onto the stack this way will be the first to resolve, and so on."}, {"published_at": "2014-07-18", "comment": "Ob Nixilis's first triggered ability won't trigger if you search an opponent's library or if an opponent searches another player's library."}, {"published_at": "2014-07-18", "comment": "If the opponent controls no creatures when the first triggered ability resolves, that player still loses 10 life."}]}]}, {"cards": ["Alexios, Deimos of Kosmos", "Coveted Jewel"], "reason": "A strong table story, but Playgroup data shows wins about turn 7, mostly by commander damage. Too fast and eliminates players early for the Bracket 2 demo. Kept in the exploration queue (conditional).", "card_objs": [{"name": "Alexios, Deimos of Kosmos", "mana_cost": "{3}{R}", "type_line": "Legendary Creature \u2014 Human Berserker", "oracle_text": "Trample\nAlexios attacks each combat if able, can't be sacrificed, and can't attack its owner.\nAt the beginning of each player's upkeep, that player gains control of Alexios, untaps it, and puts a +1/+1 counter on it. It gains haste until end of turn.", "pt": "4/4", "ci": "R", "cmc": 4.0, "price_usd": 0.68, "game_changer": false, "edhrec_rank": 1310, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "large": "https://cards.scryfall.io/large/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "png": "https://cards.scryfall.io/png/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.png?1783910980", "art_crop": "https://cards.scryfall.io/art_crop/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "artist": "Bartek Fedyczak"}], "scryfall_uri": "https://scryfall.com/card/acr/33/alexios-deimos-of-kosmos?utm_source=api", "rulings": [{"published_at": "2024-07-05", "comment": "Alexios can't be sacrificed for any reason. If an effect instructs you to sacrifice it, you can't and it remains on the battlefield. You also can't sacrifice it to pay a cost that requires you to sacrifice a creature."}, {"published_at": "2024-07-05", "comment": "If Alexios can't attack for any reason (such as being tapped), then it doesn't attack. If there's a cost associated with having it attack, its controller isn't forced to pay that cost, so it doesn't have to attack in that case either."}, {"published_at": "2024-07-05", "comment": "If Alexios's owner leaves the game, Alexios leaves the game along with them."}, {"published_at": "2024-07-05", "comment": "If an effect instructs you to sacrifice a creature and you control any creatures other than Alexios, you must sacrifice one of those other creatures. You can't try to sacrifice Alexios."}]}, {"name": "Coveted Jewel", "mana_cost": "{6}", "type_line": "Artifact", "oracle_text": "When this artifact enters, draw three cards.\n{T}: Add three mana of any one color.\nWhenever one or more creatures an opponent controls attack you and aren't blocked, that player draws three cards and gains control of this artifact. Untap it.", "pt": null, "ci": "", "cmc": 6.0, "price_usd": 0.33, "game_changer": false, "edhrec_rank": 1260, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "large": "https://cards.scryfall.io/large/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "png": "https://cards.scryfall.io/png/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.png?1783903221", "art_crop": "https://cards.scryfall.io/art_crop/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "artist": "Eric Wilkerson"}], "scryfall_uri": "https://scryfall.com/card/msc/196/coveted-jewel?utm_source=api", "rulings": [{"published_at": "2018-07-13", "comment": "A creature attacking a planeswalker you control won't cause Coveted Jewel's last ability to trigger."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability triggers after you declare blockers (or declare no blockers at all) if any attacking creatures are unblocked. It doesn't matter if some attacking creatures were blocked."}, {"published_at": "2018-07-13", "comment": "If more than one opponent attacks you at the same time, Coveted Jewel's last ability triggers for each of them. You choose which player ends up with Coveted Jewel, but each of them draws three cards and has a chance to activate its mana ability."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability resolves after blockers are chosen but before combat damage is dealt."}]}]}, {"cards": ["Notion Thief"], "reason": "Excluded from the B3 package: it removes the monarch's extra draw, which is the reason anyone wants the crown. That is repeated denial.", "card_objs": [{"name": "Notion Thief", "mana_cost": "{2}{U}{B}", "type_line": "Creature \u2014 Human Rogue", "oracle_text": "Flash\nIf an opponent would draw a card except the first one they draw in each of their draw steps, instead that player skips that draw and you draw a card.", "pt": "3/1", "ci": "BU", "cmc": 4.0, "price_usd": 1.75, "game_changer": true, "edhrec_rank": 1232, "images": [{"normal": "https://cards.scryfall.io/normal/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "large": "https://cards.scryfall.io/large/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "png": "https://cards.scryfall.io/png/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.png?1783929456", "art_crop": "https://cards.scryfall.io/art_crop/front/f/6/f675f509-4343-4568-96dd-265626cb6c2b.jpg?1783929456", "artist": "Clint Cearley"}], "scryfall_uri": "https://scryfall.com/card/znc/96/notion-thief?utm_source=api", "rulings": [{"published_at": "2018-03-16", "comment": "If an opponent is instructed to draw a card then discard a card, and Notion Thief causes you to draw a card instead, that opponent still discards a card. The same is true of any other actions that opponent is instructed to do."}, {"published_at": "2018-03-16", "comment": "If two or more players each control a Notion Thief and a player would draw a card other than the first one in their draw step, that player chooses one of the applicable Notion Thief effects to apply. Then the player whose Notion Thief's effect was chosen repeats this process among the remaining Notion Thief effects, and so on, until there are no more possible such effects to apply. Each effect can be applied to the card draw only once this way."}, {"published_at": "2018-03-16", "comment": "The above procedure means that if each player in a two-player game controls a Notion Thief and one would draw a card, it really will be that player who draws a card."}]}]}, {"cards": ["Elrond of the White Council", "Grudge Keeper"], "reason": "Both vote options benefit the pilot. The choice is about how much to lose, not which outcome to aim for. Lower agency on review.", "card_objs": [{"name": "Elrond of the White Council", "mana_cost": "{3}{G}{U}", "type_line": "Legendary Creature \u2014 Elf Noble", "oracle_text": "Secret council \u2014 When Elrond enters, each player secretly votes for fellowship or aid, then those votes are revealed. For each fellowship vote, the voter chooses a creature they control. You gain control of each creature chosen this way, and they gain \"This creature can't attack its owner.\" Then for each aid vote, put a +1/+1 counter on each creature you control.", "pt": "3/3", "ci": "GU", "cmc": 5.0, "price_usd": 0.29, "game_changer": false, "edhrec_rank": 9782, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "large": "https://cards.scryfall.io/large/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "png": "https://cards.scryfall.io/png/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.png?1783916020", "art_crop": "https://cards.scryfall.io/art_crop/front/4/c/4cdfb792-fe55-4aa0-88df-4296db794bc5.jpg?1783916020", "artist": "Javier Charro"}], "scryfall_uri": "https://scryfall.com/card/ltc/51/elrond-of-the-white-council?utm_source=api", "rulings": [{"published_at": "2023-06-16", "comment": "If you have multiple votes, you can vote for fellowship multiple times. If you do, you can choose the same creature each time."}, {"published_at": "2023-06-16", "comment": "The phrase \"the vote is tied\" refers only to when there is more than one choice that received the most votes. For example, if a 5-player vote from among three different choices ends 3 votes to 1 vote to 1 vote, the vote isn't tied."}, {"published_at": "2023-06-16", "comment": "To secretly vote, each player writes down their chosen option without showing it to anyone else. Each player then keeps their vote secret until all players simultaneously reveal their votes."}, {"published_at": "2023-06-16", "comment": "After the votes are revealed, starting with the player whose turn it is and proceeding in turn order, each player who voted fellowship chooses a creature they control for each of their fellowship votes. Then the controller of Elrond of the White Council's ability gains control of those creatures and they gain the listed ability. Finally, that player puts a +1/+1 counter on each creature they control for each aid vote."}]}, {"name": "Grudge Keeper", "mana_cost": "{1}{B}", "type_line": "Creature \u2014 Zombie Wizard", "oracle_text": "Whenever players finish voting, each opponent who voted for a choice you didn't vote for loses 2 life.", "pt": "2/1", "ci": "B", "cmc": 2.0, "price_usd": 0.31, "game_changer": false, "edhrec_rank": 12276, "images": [{"normal": "https://cards.scryfall.io/normal/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "large": "https://cards.scryfall.io/large/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "png": "https://cards.scryfall.io/png/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.png?1783939375", "art_crop": "https://cards.scryfall.io/art_crop/front/c/f/cf00b8d3-30bb-44b8-8531-4bfd018acc0c.jpg?1783939375", "artist": "Ryan Barger"}], "scryfall_uri": "https://scryfall.com/card/cns/28/grudge-keeper?utm_source=api", "rulings": [{"published_at": "2014-05-29", "comment": "The spell or ability that caused you to vote will finish resolving before Grudge Keeper\u2019s ability is put on the stack. The ability will be put on the stack even if the results of the vote cause Grudge Keeper to leave the battlefield."}, {"published_at": "2014-05-29", "comment": "Grudge Keeper\u2019s ability considers only the vote that caused it to trigger, not any previous votes, even if they were caused by the same permanent."}, {"published_at": "2014-05-29", "comment": "If one of your opponents has additional votes because of Brago\u2019s Representative, and that player votes for more than one choice you didn\u2019t vote for, that player will lose only 2 life."}, {"published_at": "2014-05-29", "comment": "If you have additional votes because of Brago\u2019s Representative, and you vote for more than one choice, an opponent will lose 2 life only if they voted for none of those choices."}]}]}], "exploration_queue": [{"cards": ["Alexios, Deimos of Kosmos", "Coveted Jewel", "Marchesa's Decree"], "status": "conditional", "question": "Does a shared, ever-growing attacker that can't hit you make the Jewel a table-wide hot potato, or does it just pick off the weakest player?", "card_objs": [{"name": "Alexios, Deimos of Kosmos", "mana_cost": "{3}{R}", "type_line": "Legendary Creature \u2014 Human Berserker", "oracle_text": "Trample\nAlexios attacks each combat if able, can't be sacrificed, and can't attack its owner.\nAt the beginning of each player's upkeep, that player gains control of Alexios, untaps it, and puts a +1/+1 counter on it. It gains haste until end of turn.", "pt": "4/4", "ci": "R", "cmc": 4.0, "price_usd": 0.68, "game_changer": false, "edhrec_rank": 1310, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "large": "https://cards.scryfall.io/large/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "png": "https://cards.scryfall.io/png/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.png?1783910980", "art_crop": "https://cards.scryfall.io/art_crop/front/e/8/e81b94b2-4052-4686-a788-9baf0fa0f81a.jpg?1783910980", "artist": "Bartek Fedyczak"}], "scryfall_uri": "https://scryfall.com/card/acr/33/alexios-deimos-of-kosmos?utm_source=api", "rulings": [{"published_at": "2024-07-05", "comment": "Alexios can't be sacrificed for any reason. If an effect instructs you to sacrifice it, you can't and it remains on the battlefield. You also can't sacrifice it to pay a cost that requires you to sacrifice a creature."}, {"published_at": "2024-07-05", "comment": "If Alexios can't attack for any reason (such as being tapped), then it doesn't attack. If there's a cost associated with having it attack, its controller isn't forced to pay that cost, so it doesn't have to attack in that case either."}, {"published_at": "2024-07-05", "comment": "If Alexios's owner leaves the game, Alexios leaves the game along with them."}, {"published_at": "2024-07-05", "comment": "If an effect instructs you to sacrifice a creature and you control any creatures other than Alexios, you must sacrifice one of those other creatures. You can't try to sacrifice Alexios."}]}, {"name": "Coveted Jewel", "mana_cost": "{6}", "type_line": "Artifact", "oracle_text": "When this artifact enters, draw three cards.\n{T}: Add three mana of any one color.\nWhenever one or more creatures an opponent controls attack you and aren't blocked, that player draws three cards and gains control of this artifact. Untap it.", "pt": null, "ci": "", "cmc": 6.0, "price_usd": 0.33, "game_changer": false, "edhrec_rank": 1260, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "large": "https://cards.scryfall.io/large/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "png": "https://cards.scryfall.io/png/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.png?1783903221", "art_crop": "https://cards.scryfall.io/art_crop/front/0/6/06a7ad3b-87d4-47f0-9450-facac00dfe97.jpg?1783903221", "artist": "Eric Wilkerson"}], "scryfall_uri": "https://scryfall.com/card/msc/196/coveted-jewel?utm_source=api", "rulings": [{"published_at": "2018-07-13", "comment": "A creature attacking a planeswalker you control won't cause Coveted Jewel's last ability to trigger."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability triggers after you declare blockers (or declare no blockers at all) if any attacking creatures are unblocked. It doesn't matter if some attacking creatures were blocked."}, {"published_at": "2018-07-13", "comment": "If more than one opponent attacks you at the same time, Coveted Jewel's last ability triggers for each of them. You choose which player ends up with Coveted Jewel, but each of them draws three cards and has a chance to activate its mana ability."}, {"published_at": "2018-07-13", "comment": "Coveted Jewel's last ability resolves after blockers are chosen but before combat damage is dealt."}]}, {"name": "Marchesa's Decree", "mana_cost": "{3}{B}", "type_line": "Enchantment", "oracle_text": "When this enchantment enters, you become the monarch.\nWhenever a creature attacks you or a planeswalker you control, that creature's controller loses 1 life.", "pt": null, "ci": "B", "cmc": 4.0, "price_usd": 2.01, "game_changer": false, "edhrec_rank": 6940, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "large": "https://cards.scryfall.io/large/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "png": "https://cards.scryfall.io/png/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.png?1783937352", "art_crop": "https://cards.scryfall.io/art_crop/front/4/1/413bec4e-e2ce-46f1-b038-6e359cd78b53.jpg?1783937352", "artist": "Chris Rallis"}], "scryfall_uri": "https://scryfall.com/card/cn2/44/marchesas-decree?utm_source=api", "rulings": [{"published_at": "2016-08-23", "comment": "Abilities that trigger whenever you \"become the monarch\" trigger only if you aren't already the monarch. For example, if you are already the monarch as Custodi Lich enters the battlefield, its last ability won't trigger."}, {"published_at": "2016-08-23", "comment": "Being the monarch carries two inherent triggered abilities. \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2016-08-23", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack, and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2016-08-23", "comment": "The game starts with no monarch. Once an effect makes one player the monarch, the game will have exactly one monarch from that point forward."}]}]}, {"cards": ["Garland, Royal Kidnapper", "Ghostly Flicker"], "status": "conditional", "question": "Each flicker re-gives the crown. Does this speed the carousel up too much for Bracket 2 pacing?", "card_objs": [{"name": "Garland, Royal Kidnapper", "mana_cost": "{2}{U}{B}", "type_line": "Legendary Creature \u2014 Human Knight", "oracle_text": "When Garland enters, target opponent becomes the monarch.\nWhenever an opponent becomes the monarch, gain control of target creature that player controls for as long as they're the monarch.\nCreatures you control but don't own get +2/+2 and can't be sacrificed.", "pt": "3/4", "ci": "BU", "cmc": 4.0, "price_usd": 9.7, "game_changer": false, "edhrec_rank": 11855, "images": [{"normal": "https://cards.scryfall.io/normal/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "large": "https://cards.scryfall.io/large/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "png": "https://cards.scryfall.io/png/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.png?1783904658", "art_crop": "https://cards.scryfall.io/art_crop/front/b/8/b81c3f08-9319-4265-a75b-5b12b09aba89.jpg?1783904658", "artist": "David Rapoza"}], "scryfall_uri": "https://scryfall.com/card/fic/442/garland-royal-kidnapper?utm_source=api", "rulings": [{"published_at": "2025-10-02", "comment": "The owner of a token is the player who created that token or, in the case of a resolving copy of a permanent spell that became a token, the player who controlled that spell as it resolved."}, {"published_at": "2025-10-02", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2025-10-02", "comment": "There are two inherent triggered abilities associated with being the monarch. These triggered abilities have no source and are controlled by the player who was the monarch at the time the abilities triggered. The full texts of these abilities are \"At the beginning of the monarch's end step, that player draws a card\" and \"Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.\""}, {"published_at": "2025-10-02", "comment": "While Garland's second ability is on the stack, if that opponent stops being the monarch before it resolves, you won't gain control of the target creature at all."}]}, {"name": "Ghostly Flicker", "mana_cost": "{2}{U}", "type_line": "Instant", "oracle_text": "Exile two target artifacts, creatures, and/or lands you control, then return those cards to the battlefield under your control.", "pt": null, "ci": "U", "cmc": 3.0, "price_usd": 2.52, "game_changer": false, "edhrec_rank": 594, "images": [{"normal": "https://cards.scryfall.io/normal/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "large": "https://cards.scryfall.io/large/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "png": "https://cards.scryfall.io/png/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.png?1783915697", "art_crop": "https://cards.scryfall.io/art_crop/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "artist": "Raymond Swanland"}], "scryfall_uri": "https://scryfall.com/card/cmm/98/ghostly-flicker?utm_source=api", "rulings": [{"published_at": "2017-03-14", "comment": "The two targets can have different card types. For example, you can target one artifact and one creature with Ghostly Flicker."}]}]}]}, "decksets": [{"id": "queen-marchesa", "meta": {"id": "queen-marchesa", "name": "Queen Marchesa", "commander": "Queen Marchesa", "colors": "WBR", "featured": true, "trial_label": "Marchesa + a crown or forced-combat piece cast by turn 6", "trial_removed_label": "Marchesa removed once", "lists": {"b2": "decks/queen-marchesa-b2.txt", "b3": "decks/queen-marchesa-b3.txt"}, "package": "decks/queen-marchesa-package.json", "pregame": ["This deck fights over the crown, and it wins when you fight each other.", "Queen Marchesa makes me the monarch. Take the crown from me and Knights of the Black Rose drains you 2. While one of you holds it, Marchesa makes me a 1/1 Assassin with deathtouch and haste every turn, and they come for it.", "Kardur, Breena, Disrupt Decorum and Taunt from the Rampart push your attacks onto each other. Ghostly Prison and Windborn Muse tax attacks on me, and Deflecting Palm, Comeuppance and Take the Bait send attacks back at you.", "Underworld Dreams and Fate Unraveler deal 1 damage for every card you draw, so the crown's extra card costs the monarch 1 life.", "Answers: kill Marchesa and the Assassins stop. Attack me with small creatures to get under the redirection. Enchantment removal on Ghostly Prison or Underworld Dreams opens me up.", "There are no infinite combos and no locks. The deck wins late: with Insurrection or Mob Rule, with Gisela, or with drains, after you have spent your creatures on each other."], "how_it_plays_without_the_line": ["The deck runs 10 mana rocks, 5 card-flow cards and 12 interaction spells. Without Marchesa it is a Mardu pillow-fort deck that turns attacks back.", "Sunforger fetches Deflecting Palm, Comeuppance, Take the Bait or Boros Charm from the library, so the redirection does not run out.", "Court of Ambition, Palace Jailer and Thorn of the Black Rose take the crown without Marchesa."], "how_it_wins": ["Most of the damage is the table's own: goad and redirection make opponents hit each other, and the crown makes them come at the monarch.", "Insurrection and Mob Rule borrow everyone's creatures for one lethal turn. Gisela doubles your damage and halves theirs. Duelist's Heritage gives the best attacker double strike.", "Underworld Dreams, Fate Unraveler, Kambal and Knights of the Black Rose drain a little every turn.", "Goad stops working when only one opponent is left: their creatures must then attack you. The closers for that end game are Insurrection and Mob Rule (their board attacks them), Gisela (double damage), Duelist's Heritage, and the drains from Underworld Dreams and Kambal. Ghostly Prison, Windborn Muse and the redirection instants still protect you heads-up.", "In the pod model (1,000 seeded games), this list wins 60% of games; the EDHREC average Marchesa deck wins 39%. Once a game is down to one opponent, it wins 71% of the time (average deck: 55%). With the redirection rule switched off (it is generous: it ignores the mana you must hold), the numbers are 40% and 24%. See Experiments."], "b2_swaps": [{"why": "cost (about $17 less)", "out": "Luxury Suite ($9.21), Kambal, Consul of Allocation ($8.65)", "in": "Scoured Barrens, Tithe Taker", "note": "Prices are from the Scryfall snapshot of 2026-11-24. Kambal's drain is the bigger loss."}, {"why": "less politics", "out": "Breena, the Demagogue, Vengeful Ancestor", "in": "Mortify, Kolaghan's Command", "note": "More removal, less goad."}, {"why": "more pressure, still Bracket 2", "out": "Monologue Tax, Curse of Opulence", "in": "Adeline, Resplendent Cathar, Grim Hireling", "note": "No Game Changers added."}], "do_not_add": [{"cards": ["Wound Reflection"], "reason": "Tested and left out: it is one card from 19 Spellbook combos, many of them in Mardu colors.", "card_objs": [{"name": "Wound Reflection", "mana_cost": "{5}{B}", "type_line": "Enchantment", "oracle_text": "At the beginning of each end step, each opponent loses life equal to the life they lost this turn. (Damage causes loss of life.)", "pt": null, "ci": "B", "cmc": 6.0, "price_usd": 14.24, "game_changer": false, "edhrec_rank": 1990, "images": [{"normal": "https://cards.scryfall.io/normal/front/2/b/2b14a82c-877a-445f-8910-33aaa6fe3d15.jpg?1783930170", "large": "https://cards.scryfall.io/large/front/2/b/2b14a82c-877a-445f-8910-33aaa6fe3d15.jpg?1783930170", "png": "https://cards.scryfall.io/png/front/2/b/2b14a82c-877a-445f-8910-33aaa6fe3d15.png?1783930170", "art_crop": "https://cards.scryfall.io/art_crop/front/2/b/2b14a82c-877a-445f-8910-33aaa6fe3d15.jpg?1783930170", "artist": "Chris Seaman"}], "scryfall_uri": "https://scryfall.com/card/2xm/113/wound-reflection?utm_source=api", "rulings": [{"published_at": "2020-08-07", "comment": "If Wound Reflection's ability resolves, then an opponent loses life later in the same turn, that life loss is never counted by Wound Reflection."}, {"published_at": "2020-08-07", "comment": "When Wound Reflection's ability resolves, it checks how much life each opponent lost over the course of the turn, then it causes that opponent to lose that much life. It doesn't matter how the opponent lost life or who caused it. It also doesn't matter if Wound Reflection wasn't on the battlefield at the time some or all of the life was lost."}, {"published_at": "2020-08-07", "comment": "Multiple Wound Reflections each trigger separately. For example, if an opponent lost 1 life, the first one's triggered ability to resolve causes them to lose another 1 life. Since they've now lost 2 life, the next triggered ability causes them to lose 2 life, and the next 4, and so on."}, {"published_at": "2020-08-07", "comment": "Wound Reflection's ability checks only whether life was lost. It doesn't care whether life was also gained. For example, if an opponent lost 4 life and gained 6 life during the turn, that player will have a higher life total than they started the turn with but Wound Reflection's ability will still cause that player to lose 4 life."}]}]}, {"cards": ["Guilty Conscience", "Fire Covenant", "Tree of Perdition", "Aetherflux Reservoir", "Dawnsire, Sunstar Dreadnought"], "reason": "Each is one card from a Spellbook combo with Brash Taunter.", "card_objs": [{"name": "Guilty Conscience", "mana_cost": "{W}", "type_line": "Enchantment \u2014 Aura", "oracle_text": "Enchant creature\nWhenever enchanted creature deals damage, this Aura deals that much damage to that creature.", "pt": null, "ci": "W", "cmc": 1.0, "price_usd": 1.29, "game_changer": false, "edhrec_rank": 8052, "images": [{"normal": "https://cards.scryfall.io/normal/front/6/7/67b8701c-0f03-4ad0-9097-3caf885abd59.jpg?1783944892", "large": "https://cards.scryfall.io/large/front/6/7/67b8701c-0f03-4ad0-9097-3caf885abd59.jpg?1783944892", "png": "https://cards.scryfall.io/png/front/6/7/67b8701c-0f03-4ad0-9097-3caf885abd59.png?1783944892", "art_crop": "https://cards.scryfall.io/art_crop/front/6/7/67b8701c-0f03-4ad0-9097-3caf885abd59.jpg?1783944892", "artist": "Christopher Moeller"}], "scryfall_uri": "https://scryfall.com/card/scg/17/guilty-conscience?utm_source=api", "rulings": []}, {"name": "Fire Covenant", "mana_cost": "{1}{B}{R}", "type_line": "Instant", "oracle_text": "As an additional cost to cast this spell, pay X life.\nFire Covenant deals X damage divided as you choose among any number of target creatures.", "pt": null, "ci": "BR", "cmc": 3.0, "price_usd": 0.42, "game_changer": false, "edhrec_rank": 2719, "images": [{"normal": "https://cards.scryfall.io/normal/front/1/a/1a13437b-e0c7-4ca9-a0e2-b8cb1b5813ec.jpg?1783911521", "large": "https://cards.scryfall.io/large/front/1/a/1a13437b-e0c7-4ca9-a0e2-b8cb1b5813ec.jpg?1783911521", "png": "https://cards.scryfall.io/png/front/1/a/1a13437b-e0c7-4ca9-a0e2-b8cb1b5813ec.png?1783911521", "art_crop": "https://cards.scryfall.io/art_crop/front/1/a/1a13437b-e0c7-4ca9-a0e2-b8cb1b5813ec.jpg?1783911521", "artist": "Jeff Miracola"}], "scryfall_uri": "https://scryfall.com/card/ecc/54/fire-covenant?utm_source=api", "rulings": [{"published_at": "2007-09-16", "comment": "If X is 0, the number of targets must also be 0."}, {"published_at": "2007-09-16", "comment": "You must distribute at least 1 damage to each target."}, {"published_at": "2007-09-16", "comment": "You divide the damage as you cast the spell. You can't redistribute the damage if any of the target creatures becomes illegal before the spell resolves."}]}, {"name": "Tree of Perdition", "mana_cost": "{3}{B}", "type_line": "Creature \u2014 Plant", "oracle_text": "Defender\n{T}: Exchange target opponent's life total with this creature's toughness.", "pt": "0/13", "ci": "B", "cmc": 4.0, "price_usd": 3.74, "game_changer": false, "edhrec_rank": 1866, "images": [{"normal": "https://cards.scryfall.io/normal/front/7/5/750b4c88-26c7-43ec-b6b9-ece3263dfd59.jpg?1783911525", "large": "https://cards.scryfall.io/large/front/7/5/750b4c88-26c7-43ec-b6b9-ece3263dfd59.jpg?1783911525", "png": "https://cards.scryfall.io/png/front/7/5/750b4c88-26c7-43ec-b6b9-ece3263dfd59.png?1783911525", "art_crop": "https://cards.scryfall.io/art_crop/front/7/5/750b4c88-26c7-43ec-b6b9-ece3263dfd59.jpg?1783911525", "artist": "Iris Compiet"}], "scryfall_uri": "https://scryfall.com/card/ecc/49/tree-of-perdition?utm_source=api", "rulings": [{"published_at": "2016-07-13", "comment": "Any toughness-modifying effects, counters, Auras, or Equipment will apply after its toughness is set to the player's former life total. For example, say Tree of Perdition is equipped with Cultist's Staff (which makes it 2/15) and the player's life total is 7. After the exchange, Tree of Perdition would be a 2/9 creature (its toughness became 7, which was then modified by Cultist's Staff) and the player's life total would be 15."}, {"published_at": "2016-07-13", "comment": "If Tree of Perdition isn't on the battlefield when the ability resolves, the exchange can't happen and the ability will have no effect. Notably, activating the ability and giving Tree of Perdition -13/-13 in response won't cause your opponent to lose the game."}, {"published_at": "2016-07-13", "comment": "When the ability resolves, Tree of Perdition's toughness becomes the targeted opponent's former life total and that player gains or loses an amount of life necessary so that their life total equals Tree of Perdition's former toughness. Other effects that interact with life gain or life loss will interact with this effect accordingly."}]}, {"name": "Aetherflux Reservoir", "mana_cost": "{4}", "type_line": "Artifact", "oracle_text": "Whenever you cast a spell, you gain 1 life for each spell you've cast this turn.\nPay 50 life: This artifact deals 50 damage to any target.", "pt": null, "ci": "", "cmc": 4.0, "price_usd": 20.07, "game_changer": false, "edhrec_rank": 362, "images": [{"normal": "https://cards.scryfall.io/normal/front/9/6/96b6b2e1-c3e6-464c-8a13-b15deb34e862.jpg?1783937164", "large": "https://cards.scryfall.io/large/front/9/6/96b6b2e1-c3e6-464c-8a13-b15deb34e862.jpg?1783937164", "png": "https://cards.scryfall.io/png/front/9/6/96b6b2e1-c3e6-464c-8a13-b15deb34e862.png?1783937164", "art_crop": "https://cards.scryfall.io/art_crop/front/9/6/96b6b2e1-c3e6-464c-8a13-b15deb34e862.jpg?1783937164", "artist": "Cliff Childs"}], "scryfall_uri": "https://scryfall.com/card/kld/192/aetherflux-reservoir?utm_source=api", "rulings": [{"published_at": "2016-09-20", "comment": "The first ability counts the spell that caused it to trigger plus any other spells you cast earlier in the turn."}, {"published_at": "2016-09-20", "comment": "The first ability counts spells you cast earlier in the turn even if you didn't control Aetherflux Reservoir as you cast them, and even if those spells were countered."}, {"published_at": "2016-09-20", "comment": "Aetherflux Reservoir's first ability doesn't trigger when you cast Aetherflux Reservoir itself."}, {"published_at": "2016-09-20", "comment": "The number of spells you've cast is counted only as Aetherflux Reservoir's triggered ability resolves. For example, if you cast a spell, then respond to the triggered ability with a second spell, you'll gain 4 life total."}]}, {"name": "Dawnsire, Sunstar Dreadnought", "mana_cost": "{5}", "type_line": "Legendary Artifact \u2014 Spacecraft", "oracle_text": "Station (Tap another creature you control: Put charge counters equal to its power on this Spacecraft. Station only as a sorcery. It's an artifact creature at 20+.)\n10+ | Whenever you attack, Dawnsire deals 100 damage to up to one target creature or planeswalker.\n20+ | Flying", "pt": "20/20", "ci": "", "cmc": 5.0, "price_usd": 16.94, "game_changer": false, "edhrec_rank": 2370, "images": [{"normal": "https://cards.scryfall.io/normal/front/6/1/6133355c-3dcf-466a-b771-fe6c44d4fa4d.jpg?1783905921", "large": "https://cards.scryfall.io/large/front/6/1/6133355c-3dcf-466a-b771-fe6c44d4fa4d.jpg?1783905921", "png": "https://cards.scryfall.io/png/front/6/1/6133355c-3dcf-466a-b771-fe6c44d4fa4d.png?1783905921", "art_crop": "https://cards.scryfall.io/art_crop/front/6/1/6133355c-3dcf-466a-b771-fe6c44d4fa4d.jpg?1783905921", "artist": "Jaime Jones"}], "scryfall_uri": "https://scryfall.com/card/eoe/238/dawnsire-sunstar-dreadnought?utm_source=api", "rulings": []}]}, {"cards": ["Expedited Inheritance", "Repercussion", "Fall of Cair Andros", "T ctions or riders your opponents' lands (such as Ancient Ziggurat or Hall of the Bandit Lord) put on the mana they produce. It just cares about colors of mana."}, {"published_at": "2009-02-01", "comment": "When determining what colors of mana your opponents' lands could produce, Exotic Orchard takes into account any applicable replacement effects that would apply to those lands' mana abilities (such as Contamination's effect, for example). If there are more than one, consider them in any possible order."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard checks the effects of all mana-producing abilities of lands your opponents control, but it doesn't check their costs. For example, Vivid Crag has the ability \"{T}, Remove a charge counter from Vivid Crag: Add one mana of any color.\" If an opponent controls Vivid Crag and you control Exotic Orchard, you can tap Exotic Orchard for any color of mana. It doesn't matter whether Vivid Crag has a charge counter on it, and it doesn't matter whether it's untapped."}]}, {"qty": 1, "name": "Path of Ancestry", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\n{T}: Add one mana of any color in your commander's color identity. When that mana is spent to cast a creature spell that shares a creature type with your commander, scry 1. (Look at the top card of your library. You may put that card on the bottom.)", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 15, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "large": "https://cards.scryfall.io/large/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "png": "https://cards.scryfall.io/png/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.png?1793021342", "art_crop": "https://cards.scryfall.io/art_crop/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "artist": "Arthur Yuan"}], "scryfall_uri": "https://scryfall.com/card/trc/545/path-of-ancestry?utm_source=api", "rulings": [{"published_at": "2020-11-10", "comment": "If your commander has no creature types, it can't share a creature type with any spell that you cast."}, {"published_at": "2020-11-10", "comment": "If your commander is a card that has no colors in its color identity, Path of Ancestry's ability produces no mana. It doesn't produce {C}."}, {"published_at": "2023-07-28", "comment": "If you have two commanders, the last ability adds one mana of any color in their combined color identities. When you spend that mana on a creature spell that shares a creature type with either of your commanders, you'll scry 1."}, {"published_at": "2023-07-28", "comment": "Your commander's creature types are checked immediately after you cast a creature spell spending mana from Path of Ancestry's last ability. They aren't set before the game begins, and they may not be the same types your commander had when you activated that ability."}]}, {"qty": 1, "name": "Throne of the High City", "mana_cost": "", "type_line": "Land", "oracle_text": "{T}: Add {C}.\n{4}, {T}, Sacrifice this land: You become the monarch.", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 4261, "images": [{"normal": "https://cards.scryfall.io/normal/front/6/a/6aac7a6d-90c7-4fe7-b6d3-f63a7170ee96.jpg?1783903190", "large": "https://cards.scryfall.io/large/front/6/a/6aac7a6d-90c7-4fe7-b6d3-f63a7170ee96.jpg?1783903190", "png": "https://cards.scryfall.io/png/front/6/a/6aac7a6d-90c7-4fe7-b6d3-f63a7170ee96.png?1783903190", "art_crop": "https://cards.scryfall.io/art_crop/front/6/a/6aac7a6d-90c7-4fe7-b6d3-f63a7170ee96.jpg?1783903190", "artist": "Pablo Mendoza"}], "scryfall_uri": "https://scryfall.com/card/msc/274/throne-of-the-high-city?utm_source=api", "rulings": [{"published_at": "2016-08-23", "comment": "Abilities that trigger whenever you \"become the monarch\" trigger only if you aren't already the monarch. For example, if you 1 Mangara, the Diplomat\n# --- Mana (13)\n1 Sol Ring\n1 Arcane Signet\n1 Talisman of Conviction\n1 Talisman of Hierarchy\n1 Talisman of Indulgence\n1 Orzhov Signet\n1 Boros Signet\n1 Rakdos Signet\n1 Fellwar Stone\n1 Mind Stone\n1 Solemn Simulacrum\n1 Curse of Opulence\n1 Monologue Tax\n# --- Lands (36)\n1 Command Tower\n1 Sacred Foundry\n1 Godless Shrine\n1 Blood Crypt\n1 Exotic Orchard\n1 Path of Ancestry\n1 Throne of the High City\n1 Luxury Suite\n1 Spectator Seating\n1 Vault of Champions\n1 Nomad Outpost\n1 Caves of Koilos\n1 Isolated Chapel\n1 Clifftop Retreat\n1 Battlefield Forge\n1 Sulfurous Springs\n1 Dragonskull Summit\n1 Rogue's Passage\n8 Swamp\n6 Plains\n4 Mountain\n", "commanders": ["Queen Marchesa"], "bracket": 2, "validation": {"commanders": ["Queen Marchesa"], "pairing": "single commander", "color_identity": "WBR", "card_count": 100, "lands": 36, "format_legal": true, "errors": [], "warnings": [], "bracket": 2, "bracket_fit": true, "bracket_issues": [], "game_changers": [], "game_changer_source_mismatch": [], "judgment_calls": ["alternate win/lose text: ['Hellkite Tyrant']"], "spellbook": {"coverage": "spellbook bulk 2026-11-25T04:13:05.531191+00:00 v7.4.4 sha256:4c565eb8cca6", "included": [], "near_misses": 20, "online": null}, "table_prefs_ok": true, "table_issues": [], "price_estimate_usd": {"total": 179.87, "priced_cards": 82, "source": "Scryfall oracle-cards snapshot prices.usd (cheapest listed printing not guaranteed)", "snapshot": "oracle-cards-20261124220202.jsonl.gz"}, "sources": {"banned": "2026-02-09", "game_changers_as_of": "2026-02-09", "brackets_retrieved": "2026-11-25"}}, "trials": {"deck": "decks/queen-marchesa-b2.txt", "model": "trials-v1", "notes": "Seeded draw and mana trials.\n\nModeled explicitly: opening hand with a disclosed mulligan policy (keep 2-5 lands; one free mulligan,\nthen London mulligans down to 5), on-the-draw in a 4-player game (draws on turn 1 for 3 of 4 seats;\nwe assume we draw), land drops preferring untapped and missing colors, tapped lands, colored sources,\nmana rocks, the commander with tax, simple card-draw spells, and one removal of the commander in the\ndisruption scenario. Deck colors come from the commander's mana cost. NOT modeled: opponents' boards, combat, counterspells, monarch draws (they depend on the\ntable), tutors, or graveyard recursion. Assembly rates exclude anything those would add.", "baseline": {"scenario": "baseline", "n": 1000, "seed": 7, "mulligans": {"kept_7": 804, "free_mull": 152, "to_6_or_5": 44}, "turn6": {"commander_on_battlefield": [0.957, [0.943, 0.968]], "has_bait_piece": [0.813, [0.788, 0.836]], "plausible_assembly": [0.753, [0.725, 0.779]], "lands_on_curve": 0.438, "avg_spells_cast": 5.96}, "turn8": {"commander_on_battlefield": [0.989, [0.98, 0.994]], "has_bait_piece": [0.873, [0.851, 0.892]], "plausible_assembly": [0.86, [0.837, 0.88]], "lands_on_curve": 0.67, "avg_spells_cast": 8.84}}, "disruption": {"scenario": "disruption", "n": 1000, "seed": 7, "mulligans": {"kept_7": 804, "free_mull": 152, "to_6_or_5": 44}, "turn6": {"commander_on_battlefield": [0.711, [0.682, 0.738]], "has_bait_piece": [0.809, [0.783, 0.832]], "plausible_assembly": [0.464, [0.433, 0.495]], "lands_on_curve": 0.432, "avg_spells_cast": 5.79}, "turn8": {"commander_on_battlefield": [0.897, [0.877, 0.914]], "has_bait_piece": [0.873, [0.851, 0.892]], "plausible_assembly": [0.767, [0.74, 0.792]], "lands_on_curve": 0.661, "avg_spells_cast": 8.87}}, "exact": {"P(>=1 of 11 bait pieces seen by turn 4, 7-card hand on the draw)": 0.7461, "P(>=1 of 11 bait pieces seen by turn 6, 7-card hand on the draw)": 0.8059, "P(>=1 of 11 bait pieces seen by turn 8, 7-card hand on the draw)": 0.8526}}, "clock": {"deck": "decks/queen-marchesa-b2.txt", "model": "clock-v2", "notes": "Clock model: how fast a deck can kill three opponents at 40 life.\n\nThis extends the draw and mana trials (trials.py) with a small combat model. It is a goldfish with\noptional table pressure, not a game engine. Every number it reports depends on the assumptions below.\n\nModeled:\n- Our creatures attack every turn after the turn they enter (no haste). Damage goes to the opponent\n  with the lowest life, and any extra damage goes to the next one.\n- Iroh: at each combat, give one permanent (first a non-creature gift, then Iroh's Food, then a\n  creature gift, then a mana rock). Then create a 1/1 Ally with one +1/+1 counter for each gift out.\n  A creature gift we still control leaves on our next upkeep with probability 0.5 (its own rule moves it).\n  Brand is cast once 4 or more gifts are out: gifted creatures come back and can attack that turn.\n- Anthems: Intangible Virtue and Heraldic Banner (+1 to tokens), Glorious Anthem (+1 to all).\n  Honor of the Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Pod scenario (clock-v2): each opponent's board grows by 2 power per round from turn 4 and attacks a\n  random other player (us or an opponent) each round; we start at 40 life and win if we are the last\n  player alive by turn 16. Gifts change the holder's board: a creature gift adds its power, a free-value\n  gift (mana or cards) adds 1 power per round of growth, Steel Golem and Grid Monitor halve growth,\n  Jinxed Idol deals 2 a round (passed on a quarter of the time), Rust Elemental 2 a round, Akroan Horse\n  gives us and the other opponents a 1/1 each round, Pendant of Prosperity draws us a card, Nine Lives\n  makes the holder lose about four rounds later, and Transcendence makes a holder with 20 or more life\n  lose. Our removal takes 4 power from the strongest opponent, theft and Garland's hostage move 4 power\n  from an opponent to us, board wipes are held until the opponents are clearly ahead, and Ghostly Prison\n  style cards cut the damage we take. Zidane makes a Treasure per gift, Bazaar Trader gives a second gift each turn, Yes Man gives itself away and\n  draws two, Idol of Oblivion draws on token turns, Wedding Ring draws a card a round, and Abzan Falconer\n  gives Iroh's tokens (they carry +1/+1 counters) flying. Generic rules cover the rest: removal and burn\n  take 4 power, goad turns the opponents on each other for about a round, reanimation and theft give us a\n  power-4 creature, and symmetric draw gives each player a card a round. Conjurer's Closet and Thassa\n  re-trigger our best enter effect at each end step (a steal with Agent of Treachery or Hostage Taker,\n  a Gray Merchant drain, a new crown holder for Garland, a removal, or two cards).\n- Marchesa tools: an aikido instant (Deflecting Palm, Comeuppance, Inkshield, Take the Bait) stops one\n  attack of 5 or more on us and sends the damage back; Sunforger can fetch one from the library once a round\n  (red or white, mana value 4 or less), which uses that card up. Kardur goads the\n  table for a round and drains 1 per creature that dies attacking. Insurrection (all) and Mob Rule (about\n  60%) add the opponents' boards to our attack for a turn; Ruinous Ultimatum wipes only their boards.\n  Gisela doubles our damage and halves damage to us; Duelist's Heritage gives the largest attacker double\n  strike; Wound Reflection doubles the life opponents lost this turn; Kambal drains 2 a round; Breena\n  grows our largest creature when opponents attack each other. Queen Marchesa makes a 1/1 deathtouch\n  Assassin each upkeep while an opponent is the monarch.\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted).\nNot modeled: opponents' attacks on us, our life, Mob Rule, Goblin Festival pings, burn spells, opponents'\ngifts used against us, combat tricks, and politics. Opponents' creatures are not simulated, only abstracted.\n\nScenarios:\n- goldfish: no blockers, no removal, nobody returns gifts.\n- table: each turn the opponents block our largest attacker without flying (it deals no damage; Akroma's\n  Will and Keeper of Keys stop the block). The crown moves each round with p : "2016-08-23", "comment": "Abilities that trigger whenever you \"become the monarch\" trigger only if you aren't already the monarch. For example, if you are already the monarch as Custodi Lich enters the battlefield, its last ability won't trigger."}, {"published_at": "2016-08-23", "comment": "If the triggered ability that causes the monarch to draw a card goes on the stack, and a different player becomes the monarch before that ability resolves, the first player will still draw the card."}, {"published_at": "2016-08-23", "comment": "The last ability of Queen Marchesa (long may she reign) checks to see if an opponent is the monarch as your upkeep begins. If no opponent is the monarch, Queen Marchesa's (long may she reign) ability won't trigger at all. Queen Marchesa's (long may she reign) ability will also check to see if an opponent is the monarch as it tries to resolve. If no opponent is the monarch at that time, Queen Marchesa's (long may she reign) ability will have no effect."}, {"published_at": "2016-08-23", "comment": "The game starts with no monarch. Once an effect makes one player the monarch, the game will have exactly one monarch from that point forward."}]}]}, {"title": "The crown tug-of-war: take it, lose it, profit both ways", "cards": [{"qty": 1, "name": "Knights of the Black Rose", "mana_cost": "{3}{W}{B}", "type_line": "Creature \u2014 Human Knight", "oracle_text": "When this creature enters, you become the monarch.\nWhenever an opponent becomes the monarch, if you were the monarch as the turn began, that player loses 2 life and you gain 2 life.", "pt": "4/4", "ci": "BW", "cmc": 5.0, "price_usd": 0.38, "game_changer": false, "edhrec_rank": 12278, "images": [{"normal": "https://cards.scryfall.io/normal/front/f/f/ffd1bf4b-3ab0-4ab3-b351-01cc2e857bb6.jpg?1783917126", "large": "https://cards.scryfall.io/large/front/f/f/ffd1bf4b-3ab0-4ab3-b351-01cc2e857bb6.jpg?1783917126", "png": "https://cards.scryfall.io/png/front/f/f/ffd1bf4b-3ab0-4ab3-b351-01cc2e85 rds.scryfall.io/art_crop/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "artist": "Leon Tukker"}], "scryfall_uri": "https://scryfall.com/card/trc/528/exotic-orchard?utm_source=api", "rulings": [{"published_at": "2009-02-01", "comment": "Lands that produce mana based only on what other lands \"could produce\" won't help each other unless some other land allows one of them to actually produce some type of mana. For example, if you control an Exotic Orchard and your opponent controls an Exotic Orchard and a Reflecting Pool, none of those lands would produce mana if their mana abilities were activated. On the other hand, if you control a Forest and an Exotic Orchard, and your opponent controls an Exotic Orchard and a Reflecting Pool, then each of those lands can be tapped to produce {G}. Your opponent's Exotic Orchard can produce {G} because you control a Forest. Your Exotic Orchard and your opponent's Reflecting Pool can each produce {G} because your opponent's Exotic Orchard can produce {G}."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard doesn't care about any restrictions or riders your opponents' lands (such as Ancient Ziggurat or Hall of the Bandit Lord) put on the mana they produce. It just cares about colors of mana."}, {"published_at": "2009-02-01", "comment": "When determining what colors of mana your opponents' lands could produce, Exotic Orchard takes into account any applicable replacement effects that would apply to those lands' mana abilities (such as Contamination's effect, for example). If there are more than one, consider them in any possible order."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard checks the effects of all mana-producing abilities of lands your opponents control, but it doesn't check their costs. For example, Vivid Crag has the ability \"{T}, Remove a charge counter from Vivid Crag: Add one mana of any color.\" If an opponent controls Vivid Crag and you control Exotic Orchard, you can tap Exotic Orchard for any color of mana. It doesn't matter whether Vivid Crag has a charge counter on it, and it doesn't matter whether it's untapped."}]}, {"qty": 1, "name": "Path of Ancestry", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\n{T}: Add one mana of any color in your commander's color identity. When that mana is spent to cast a creature spell that shares a creature type with your commander, scry 1. (Look at the top card of your library. You may put that card on the bottom.)", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 15, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "large": "https://cards.scryfall.io/large/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "png": "https://cards.scryfall.io/png/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.png?1793021342", "art_crop": "https://cards.scryfall.io/art_crop/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "artist": "Arthur Yuan"}], "scryfall_uri": "https://scryfall.com/card/trc/545/path-of-ancestry?utm_source=api", "rulings": [{"published_at": "2020-11-10", "comment": "If your commander has no creature types, it can't share a creature type with any spell that you cast."}, {"published_at": "2020-11-10", "comment": "If your commander is a card that has no colors in its color identity, Path of Ancestry's ability produces no mana. It doesn't produce {C}."}, {"published_at": "2023-07-28", "comment": "If you have two commanders, the last ability adds one mana of any color in their combined color identities. When you spend that mana on a creature spell that shares a creature type with either of your commanders, you'll scry 1."}, {"published_at": "2023-07-28", "comment": "Your commander's creature types are checked immediately after you cast a creature spell spending mana from Path of Ancestry's last ability. They aren't set before the game nder", "color_identity": "WBR", "card_count": 100, "lands": 36, "format_legal": true, "errors": [], "warnings": [], "bracket": 3, "bracket_fit": true, "bracket_issues": [], "game_changers": ["Bolas's Citadel", "Enlightened Tutor", "Jeska's Will"], "game_changer_source_mismatch": [], "judgment_calls": ["alternate win/lose text: ['Hellkite Tyrant']"], "spellbook": {"coverage": "spellbook bulk 2026-11-25T04:13:05.531191+00:00 v7.4.4 sha256:4c565eb8cca6", "included": [], "near_misses": 22, "online": null}, "table_prefs_ok": true, "table_issues": [], "price_estimate_usd": {"total": 268.43, "priced_cards": 82, "source": "Scryfall oracle-cards snapshot prices.usd (cheapest listed printing not guaranteed)", "snapshot": "oracle-cards-20261124220202.jsonl.gz"}, "sources": {"banned": "2026-02-09", "game_changers_as_of": "2026-02-09", "brackets_retrieved": "2026-11-25"}}, "trials": {"deck": "decks/queen-marchesa-b3.txt", "model": "trials-v1", "notes": "Seeded draw and mana trials.\n\nModeled explicitly: opening hand with a disclosed mulligan policy (keep 2-5 lands; one free mulligan,\nthen London mulligans down to 5), on-the-draw in a 4-player game (draws on turn 1 for 3 of 4 seats;\nwe assume we draw), land drops preferring untapped and missing colors, tapped lands, colored sources,\nmana rocks, the commander with tax, simple card-draw spells, and one removal of the commander in the\ndisruption scenario. Deck colors come from the commander's mana cost. NOT modeled: opponents' boards, combat, counterspells, monarch draws (they depend on the\ntable), tutors, or graveyard recursion. Assembly rates exclude anything those would add.", "baseline": {"scenario": "baseline", "n": 1000, "seed": 7, "mulligans": {"kept_7": 804, "free_mull": 152, "to_6_or_5": 44}, "turn6": {"commander_on_battlefield": [0.954, [0.939, 0.965]], "has_bait_piece": [0.802, [0.776, 0.826]], "plausible_assembly": [0.739, [0.711, 0.765]], "lands_on_curve": 0.412, "avg_spells_cast": 5.74}, "turn8": {"commander_on_b he Pure and Rally the Ranks (naming Ally) give Iroh's tokens +1. Shared Animosity gives each\n  attacking Ally token +1 for each other attacking Ally token. Throne of the God-Pharaoh drains each\n  opponent at our end step by the number of tapped creatures (tokens with vigilance from Intangible\n  Virtue do not tap). Warleader's Call and Impact Tremors deal 1 damage to each opponent when a creature\n  enters under our control (Warleader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Me
