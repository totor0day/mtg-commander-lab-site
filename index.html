t/2/e/2ed2b1d9-3c23-4f2e-b816-6f2bea74b797.png?1783929474", "art_crop": "https://cards.scryfall.io/art_crop/front/2/e/2ed2b1d9-3c23-4f2e-b816-6f2bea74b797.jpg?1783929474", "artist": "Stephan Martiniere"}], "scryfall_uri": "https://scryfall.com/card/znc/54/sepulchral-primordial?utm_source=api", "rulings": [{"published_at": "2013-01-24", "comment": "The creature cards enter simultaneously."}, {"published_at": "2013-01-24", "comment": "You can choose a number of targets up to the number of opponents you have, one target per opponent."}]}, {"qty": 1, "name": "Ghostly Flicker", "mana_cost": "{2}{U}", "type_line": "Instant", "oracle_text": "Exile two target artifacts, creatures, and/or lands you control, then return those cards to the battlefield under your control.", "pt": null, "ci": "U", "cmc": 3.0, "price_usd": 2.52, "game_changer": false, "edhrec_rank": 594, "images": [{"normal": "https://cards.scryfall.io/normal/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "large": "https://cards.scryfall.io/large/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "png": "https://cards.scryfall.io/png/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.png?1783915697", "art_crop": "https://cards.scryfall.io/art_crop/front/d/c/dc143ba3-2a58-4980-9fa0-a05a9e9ed082.jpg?1783915697", "artist": "Raymond Swanland"}], "scryfall_uri": "https://scryfall.com/card/cmm/98/ghostly-flicker?utm_source=api", "rulings": [{"published_at": "2017-03-14", "comment": "The two targets can have different card types. For example, you can target one artifact and one creature with Ghostly Flicker."}]}]}, {"title": "Lands", "cards": [{"qty": 1, "name": "Command Tower", "mana_cost": "", "type_line": "Land", "oracle_text": "{T}: Add one mana of any color in your commander's color identity.", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.21, "game_changer": false, "edhrec_rank": 2, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/7/a73297d2-580c-4174-a427-265f6916d09f.jpg?1793021256", "large": "https://cards.scryfall.io/large/front/a/7/a73297d2-580c-4174-a427-265f6916d09f.jpg?1793021256", "png": "https://cards.scryfall.io/png/front/a/7/a73297d2-580c-4174-a427-265f6916d09f.png?1793021256", "art_crop": "https://cards.scryfall.io/art_crop/front/a/7/a73297d2-580c-4174-a427-265f6916d09f.jpg?1793021256", "artist": "Arthur Yuan"}], "scryfall_uri": "https://scryfall.com/card/trc/521/command-tower?utm_source=api", "rulings": [{"published_at": "2020-11-10", "comment": "If you have two commanders, the ability adds one mana of any color in their combined color identities."}, {"published_at": "2020-11-10", "comment": "If your commander is a card that has no colors in its color identity, Command Tower's ability produces no mana. It doesn't produce {C}."}, {"published_at": "2020-11-10", "comment": "If you don't have a commander, Command Tower's ability produces no mana."}]}, {"qty": 1, "name": "Path of Ancestry", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\n{T}: Add one mana of any color in your commander's color identity. When that mana is spent to cast a creature spell that shares a creature type with your commander, scry 1. (Look at the top card of your library. You may put that card on the bottom.)", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.27, "game_changer": false, "edhrec_rank": 15, "images": [{"normal": "https://cards.scryfall.io/normal/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "large": "https://cards.scryfall.io/large/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "png": "https://cards.scryfall.io/png/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.png?1793021342", "art_crop": "https://cards.scryfall.io/art_crop/front/4/a/4ac05a29-0722-4d8b-80e9-a46c38491c14.jpg?1793021342", "artist": "Arthur Yuan"}], "scryfall_uri": "https://scryfall.com/card/trc/545/path-of-ancestry?utm_source=api", "rulings": [{"published_at": "2020-11-10", "comment": "If your commander has no creature types, it can't share a creature type with any spell that you cast."}, {"published_at": "2020-11-10", "comment": "If your commander is a card that has no colors in its color identity, Path of Ancestry's ability produces no mana. It doesn't produce {C}."}, {"published_at": "2023-07-28", "comment": "If you have two commanders, the last ability adds one mana of any color in their combined color identities. When you spend that mana on a creature spell that shares a creature type with either of your commanders, you'll scry 1."}, {"published_at": "2023-07-28", "comment": "Your commander's creature types are checked immediately after you cast a creature spell spending mana from Path of Ancestry's last ability. They aren't set before the game begins, and they may not be the same types your commander had when you activated that ability."}]}, {"qty": 1, "name": "Exotic Orchard", "mana_cost": "", "type_line": "Land", "oracle_text": "{T}: Add one mana of any color that a land an opponent controls could produce.", "pt": null, "ci": "", "cmc": 0.0, "price_usd": 0.18, "game_changer": false, "edhrec_rank": 9, "images": [{"normal": "https://cards.scryfall.io/normal/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "large": "https://cards.scryfall.io/large/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "png": "https://cards.scryfall.io/png/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.png?1793021293", "art_crop": "https://cards.scryfall.io/art_crop/front/0/a/0a4a51a3-fb8b-4611-8f94-fbcab547423c.jpg?1793021293", "artist": "Leon Tukker"}], "scryfall_uri": "https://scryfall.com/card/trc/528/exotic-orchard?utm_source=api", "rulings": [{"published_at": "2009-02-01", "comment": "Lands that produce mana based only on what other lands \"could produce\" won't help each other unless some other land allows one of them to actually produce some type of mana. For example, if you control an Exotic Orchard and your opponent controls an Exotic Orchard and a Reflecting Pool, none of those lands would produce mana if their mana abilities were activated. On the other hand, if you control a Forest and an Exotic Orchard, and your opponent controls an Exotic Orchard and a Reflecting Pool, then each of those lands can be tapped to produce {G}. Your opponent's Exotic Orchard can produce {G} because you control a Forest. Your Exotic Orchard and your opponent's Reflecting Pool can each produce {G} because your opponent's Exotic Orchard can produce {G}."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard doesn't care about any restrictions or riders your opponents' lands (such as Ancient Ziggurat or Hall of the Bandit Lord) put on the mana they produce. It just cares about colors of mana."}, {"published_at": "2009-02-01", "comment": "When determining what colors of mana your opponents' lands could produce, Exotic Orchard takes into account any applicable replacement effects that would apply to those lands' mana abilities (such as Contamination's effect, for example). If there are more than one, consider them in any possible order."}, {"published_at": "2009-02-01", "comment": "Exotic Orchard checks the effects of all mana-producing abilities of lands your opponents control, but it doesn't check their costs. For example, Vivid Crag has the ability \"{T}, Remove a charge counter from Vivid Crag: Add one mana of any color.\" If an opponent controls Vivid Crag and you control Exotic Orchard, you can tap Exotic Orchard for any color of mana. It doesn't matter whether Vivid Crag has a charge counter on it, and it doesn't matter whether it's untapped."}]}, {"qty": 1, "name": "Dimir Aqueduct", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\nWhen this land enters, return a land you control to its owner's hand.\n{T}: Add {U}{B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.34, "game_changer": false, "edhrec_rank": 395, "images": [{"normal": "https://cards.scryfall.io/normal/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "large": "https://cards.scryfall.io/large/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "png": "https://cards.scryfall.io/png/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.png?1783909578", "art_crop": "https://cards.scryfall.io/art_crop/front/8/4/84bf9d60-64b8-4209-acfe-e07eefc6bf1f.jpg?1783909578", "artist": "John Avon"}], "scryfall_uri": "https://scryfall.com/card/dsc/270/dimir-aqueduct?utm_source=api", "rulings": [{"published_at": "2013-04-15", "comment": "If this land enters the battlefield and you control no other lands, its ability will force you to return it to your hand."}]}, {"qty": 1, "name": "Temple of Deceit", "mana_cost": "", "type_line": "Land", "oracle_text": "This land enters tapped.\nWhen this land enters, scry 1. (Look at the top card of your library. You may put that card on the bottom.)\n{T}: Add {U} or {B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.34, "game_changer": false, "edhrec_rank": 378, "images": [{"normal": "https://cards.scryfall.io/normal/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "large": "https://cards.scryfall.io/large/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "png": "https://cards.scryfall.io/png/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.png?1783908897", "art_crop": "https://cards.scryfall.io/art_crop/front/e/1/e18748ce-e52e-4cd1-89d4-cd2578a0d574.jpg?1783908897", "artist": "Jonas De Ro"}], "scryfall_uri": "https://scryfall.com/card/fdn/697/temple-of-deceit?utm_source=api", "rulings": [{"published_at": "2013-09-15", "comment": "You perform the actions stated on a card in sequence. For some spells and abilities, that means you'll scry last. For others, that means you'll scry and then perform other actions."}, {"published_at": "2013-09-15", "comment": "Scry appears on some spells and abilities with one or more targets. If all of the spell or ability's targets are illegal when it tries to resolve, it won't resolve and none of its effects will happen. You won't scry."}, {"published_at": "2013-09-15", "comment": "When you scry, you may put all the cards you look at back on top of your library, you may put all of those cards on the bottom of your library, or you may put some of those cards on top and the rest of them on the bottom."}, {"published_at": "2013-09-15", "comment": "You choose how to order cards returned to your library after scrying no matter where you put them."}]}, {"qty": 1, "name": "Choked Estuary", "mana_cost": "", "type_line": "Land", "oracle_text": "As this land enters, you may reveal an Island or Swamp card from your hand. If you don't, this land enters tapped.\n{T}: Add {U} or {B}.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.29, "game_changer": false, "edhrec_rank": 293, "images": [{"normal": "https://cards.scryfall.io/normal/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "large": "https://cards.scryfall.io/large/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "png": "https://cards.scryfall.io/png/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.png?1793021260", "art_crop": "https://cards.scryfall.io/art_crop/front/9/a/9add2479-11f6-4f13-8a38-df0426a80ba1.jpg?1793021260", "artist": "Jessica Rossier"}], "scryfall_uri": "https://scryfall.com/card/trc/517/choked-estuary?utm_source=api", "rulings": [{"published_at": "2016-04-08", "comment": "If an effect instructs you to put Choked Estuary onto the battlefield tapped, it will still enter the battlefield tapped even if you reveal a land card from your hand."}, {"published_at": "2016-04-08", "comment": "Lands don't have a subtype just because they can produce mana of the corresponding color. Choked Estuary itself is neither an Island nor a Swamp, even though it produces blue and black mana, so you can't reveal one to satisfy the ability of another."}, {"published_at": "2016-04-08", "comment": "If an Island or Swamp is entering the battlefield from your hand at the same time as Choked Estuary, you may reveal the other land to have Choked Estuary enter untapped."}, {"published_at": "2016-04-08", "comment": "You may reveal any land card with either or both of the appropriate subtypes. It doesn't have to be a basic land. For example, you could reveal Prairie Stream from the Battle for Zendikar set to satisfy the ability of Choked Estuary."}]}, {"qty": 1, "name": "Sunken Hollow", "mana_cost": "", "type_line": "Land \u2014 Island Swamp", "oracle_text": "({T}: Add {U} or {B}.)\nThis land enters tapped unless you control two or more basic lands.", "pt": null, "ci": "BU", "cmc": 0.0, "price_usd": 0.24, "game_changer": false, "edhrec_rank": 87, "images": [{"normal": "https://cards.scryfall.io/normal/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.jpg?1793021388", "large": "https://cards.scryfall.io/large/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.jpg?1793021388", "png": "https://cards.scryfall.io/png/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.png?1793021388", "art_crop": "https://cards.scryfall.io/art_crop/front/a/f/af0eb74d-c203-42ea-a24f-c70429b3e4c3.jpg?1793021388", "artist": "Nadia Hurianova"}], "scryfall_uri": "https://scryfall.com/card/trc/564/sunken-hollow?utm_source=api", "rulings": [{"published_at": "2015-08-25", "comment": "If one of these lands enters the battlefield at the same time as any number of basic lands, those other lands are not counted when determining if this land enters the battlefield tapped or untapped."}, {"published_at": "2015-08-25", "comment": "However, because these cards have basic land types, effects that specify a basic land type without also specifying that the land be basic can affect them. For example, a spell or ability that reads \"Destroy target Forest\" can target Canopy Vista, while one that reads \"Destroy target basic Forest\" cannot."}, {"published_at": "2015-08-25", "comment": "Even though these lands have basic land types, they are not basic lands because \"basic\" doesn't appear on t eader's Call also gives +1/+1). Akroma's Will is cast when our attack is 20 or more: double strike and flying that turn.\n- Garland: on entry it takes an opponent's best creature (assumed power 4, so 6 with Garland's +2/+2).\n  The hostage stays while Garland lives; a crown move swaps it for another one of the same size.\n  Theft cards (Hostage Taker, Control Magic, Sower of Temptation) take a power-4 creature (+2 with Garland).\n  Gray Merchant drains each opponent by our devotion to black.\n- The crown (monarch): cards that make us the monarch do so; Garland makes an opponent the monarch. The\n  monarch's controller draws at our end step (Archivist of Gondor adds a card). Keeper of Keys makes our\n  creatures unblockable when we start the turn as the monarch. Fealty to the Realm gives us a power-4\n  creature while we are the monarch. Court of Ambition drains 3 (6 if we are the monarch) from each\n  opponent who does not discard (assumed half the time). Grave Venerations drains 1 when our creature\n  is removed. Bident of Thassa draws a card for each creature that deals combat damage.\n- Underworld Dreams and Fate Unraveler deal 1 damage per card an opponent draws: one draw for each\n  opponent each round, plus the monarch's extra card (two with Archivist of Gondor). Megrim deals 2 per\n  card discarded to Court of Ambition. Palace Siege (Dragons) drains 2 from each opponent at our upkeep.\n  Exsanguinate is held until X is 6 or more. Painful Quandary: each opponent casts one spell per round\n  and loses 5 life or discards (half each; Megrim adds 2 for the discard).\n- Fliers: the table's blocker blocks the largest attacker without flying. Whispersilk Cloak makes our\n  largest attacker unblockable (the equip cost is not counted).\nNot modeled: opponents' attacks on us, our life, Mob Rule, Goblin Festival pings, burn spells, opponents'\ngifts used against us, combat tricks, and politics. Opponents' creatures are not simulated, only abstracted.\n\nScenarios:\n- gol : 0.8833}, {"cards": ["Pendant of Prosperity", "Gustha's Scepter", "Faerie Mastermind"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8833}, {"cards": ["Pendant of Prosperity", "Gustha's Scepter", "Orcish Bowmasters"], "flags": ["false_synergy:drawback_on_transfer", "game_changer"], "total": 0.8833}, {"cards": ["Pendant of Prosperity", "Gustha's Scepter", "Sheoldred, the Apocalypse"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8833}, {"cards": ["Perplexing Chimera", "Gustha's Scepter", "Agent of Treachery"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8833}, {"cards": ["Perplexing Chimera", "Gustha's Scepter", "Brainstealer Dragon"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8833}, {"cards": ["Akroan Horse", "Gustha's Scepter", "Agent of Treachery"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Akroan Horse", "Gustha's Scepter", "Brainstealer Dragon"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Akroan Horse", "Gustha's Scepter", "Gonti, Night Minister"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Akroan Horse", "Gustha's Scepter", "Kambal, Profiteering Mayor"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Bucknard's Everfull Purse", "Gustha's Scepter", "Agent of Treachery"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Bucknard's Everfull Purse", "Gustha's Scepter", "Brainstealer Dragon"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Bucknard's Everfull Purse", "Gustha's Scepter", "Gonti, Night Minister"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Bucknard's Everfull Purse", "Gustha's Scepter", "Kambal, Profiteering Mayor"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Slicer, Hired Muscle // Slicer, High-Speed Antagonist", "Gustha's Scepter", "Coveted Jewel"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Slicer, Hired Muscle // Slicer, High-Speed Antagonist", "Gustha's Scepter", "Vengeful Ancestor"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8831}, {"cards": ["Xantcha, Sleeper Agent", "Gustha's Scepter", "Orcish Bowmasters"], "flags": ["false_synergy:drawback_on_transfer", "game_changer"], "total": 0.8829}, {"cards": ["Xantcha, Sleeper Agent", "Gustha's Scepter", "Sheoldred, the Apocalypse"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8829}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Coveted Jewel"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8828}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Coveted Jewel"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8828}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Vengeful Ancestor"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8828}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Vengeful Ancestor"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8828}, {"cards": ["Humble Defector", "Gustha's Scepter", "Faerie Mastermind"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8827}, {"cards": ["Humble Defector", "Gustha's Scepter", "Orcish Bowmasters"], "flags": ["false_synergy:drawback_on_transfer", "game_changer"], "total": 0.8827}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Agent of Treachery"], "flags": ["false_synergy:drawback_on_transfer", "legend_off_identity"], "total": 0.8825}, {"cards": ["Alexios, Deimos of Kosmos", "Gustha's Scepter", "Gix, Yawgmoth Praetor"], "flags": ["false_synergy:drawback_on_transfer", "legend_off_identity"], "total": 0.8825}, {"cards": ["Coveted Jewel", "Gustha's Scepter", "Faerie Mastermind"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8783}, {"cards": ["Coveted Jewel", "Gustha's Scepter", "Orcish Bowmasters"], "flags": ["false_synergy:drawback_on_transfer", "game_changer"], "total": 0.8783}, {"cards": ["Coveted Jewel", "Gustha's Scepter", "Sheoldred, the Apocalypse"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8783}, {"cards": ["Wishclaw Talisman", "Duplicity", "Agent of Treachery"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8707}, {"cards": ["Wishclaw Talisman", "Duplicity", "Archivist of Oghma"], "flags": ["false_synergy:drawback_on_transfer"], "total": 0.8707}], "community": {"enabled": true, "checked": 591, "pages_fetched": 0, "pages_missing": 0, "known_at": 0.3, "flag_at": 0.15}}, "log_html": "<h2>Experiment and evidence log<\/h2>\n<p>Each entry gives the hypothesis, what I ran or read, the result, and the decision it changed.<\/p>\n<p>Snapshot: Scryfall oracle-cards 2026-11-24 (sha256 49fc711f\u2026), rulings 2026-11-24, oracle-tags 2026-11-24,<\/p>\n<p>Commander Spellbook bulk 2026-11-25 v7.4.4 (sha256 4c565eb8\u2026), Comprehensive Rules effective 2026-11-06.<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Hypothesis / question<\/th><th>Command or source<\/th><th>Result<\/th><th>Decision<\/th><\/tr><\/thead><tbody><tr><td>E1<\/td><td>Scryfall <code>oracle_cards<\/code> gives one row per Oracle ID that I can filter on set type<\/td><td><code>mtgfind ingest<\/code>, then <code>mtgfind card &quot;Jinxed Idol&quot;<\/code><\/td><td>Jinxed Idol was missing. Its representative printing is in a memorabilia set, and the ingest dropped the whole Oracle ID. 1,046 real cards were lost this way.<\/td><td>Filter on Commander legality, not on the printing&#x27;s set type. Count went from 33,200 to 34,246.<\/td><\/tr><tr><td>E2<\/td><td>The first static pass ranks real interactions<\/td><td><code>mtgfind discover<\/code> (seed 7)<\/td><td>The top 4 were Alexios + Gustha&#x27;s Scepter. The Scepter&#x27;s &quot;when you lose control&quot; is a drawback (its exiled cards go to the graveyard), so this is a false synergy.<\/td><td>Added a <code>drawback_on_transfer<\/code> facet. These pairs are now generated and rejected visibly (50 in <code>rejected<\/code>). This is the false-synergy check.<\/td><\/tr><tr><td>E3<\/td><td>Crown politics is missing from the search<\/td><td>Read Garland&#x27;s Oracle text and rulings<\/td><td>The tagger had no &quot;an opponent becomes the monarch&quot; consumer and no &quot;the monarch controls&quot; producer.<\/td><td>Added both facets and a <code>crown-politics<\/code> family. Garland, Fealty to the Realm and Azure Fleet Admiral pairs now surface on their own.<\/td><\/tr><tr><td>E4<\/td><td>Hithlain Rope + Wan Shi Tong is a strong, repeatable engine<\/td><td><code>mtgfind trace rope rope-timing<\/code><\/td><td>My first assertion was wrong. The Rope passes against turn order and arrives tapped, so each pass waits 3 turns. Holders use it on turns 1, 4, 7, 10 and 13: about one opponent search per round.<\/td><td>Downgraded from headline to deck glue. Wan Shi Tong&#x27;s real fuel is opponents&#x27; own fetchlands and ramp, plus our Field of Ruin and Ghost Quarter.<\/td><\/tr><tr><td>E5<\/td><td>Removing Garland with its steal trigger on the stack stops the steal<\/td><td>Garland rulings, CR 113.7a, 611.2b; <code>mtgfind trace garland<\/code><\/td><td>No. The trigger resolves anyway. The hostage stays until that player loses the crown, but loses +2/+2 and the sacrifice protection. Moving the crown in response does stop the steal (2025-10-02 ruling).<\/td><td>Pregame text and the playtest card name the two real answers: move the crown, or kill or bounce the hostage after Garland is gone.<\/td><\/tr><tr><td>E6<\/td><td>If Garland steals the Fealty creature from the new monarch, the steal wins<\/td><td>CR 613.7 (layer 2 timestamps), 303.4e; <code>mtgfind trace fealty<\/code><\/td><td>Yes. Garland&#x27;s effect is newer than Fealty&#x27;s static effect, so it applies last.<\/td><td>Fealty + Garland is a finding: the pilot chooses between taking back the Fealty creature and taking the new monarch&#x27;s own creature.<\/td><\/tr><tr><td>E7<\/td><td>The Garland deck has no accidental combos<\/td><td><code>mtgfind validate decks/garland-crown-court-b2.txt --online<\/code><\/td><td>0 combos included, offline and online. Offline found 9 one-card-away variants. Ghostly Flicker + Coveted Jewel + Archaeomancer or Mystic Sanctuary is the one to watch.<\/td><td>Swap guidance says never add Archaeomancer, Mystic Sanctuary, Dualcaster Mage or Rite of Replication. Pregame note covers stealing an opponent&#x27;s Archaeomancer.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Web research<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Date<\/th><th>Source<\/th><th>Observation<\/th><th>Decision it changed<\/th><\/tr><\/thead><tbody><tr><td>2026-11-25<\/td><td><a href=\"https://magic.wizards.com/en/formats/commander\" target=\"_blank\" rel=\"noopener\">Wizards Commander page and bracket articles<\/a> (see <code>data/sources/SOURCES.md<\/code>)<\/td><td>Bracket 2: 0 Game Changers, no mass land denial, no chained extra turns, no intentional two-card combos, at least 8 turns. Bracket 3: up to 3 Game Changers, no two-card combos before turn 6. 53 Game Changers as of 2026-02-09.<\/td><td>Validator thresholds. The Bracket 3 package may add at most 3 Game Changers.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://magic.wizards.com/en/banned-restricted-list\" target=\"_blank\" rel=\"noopener\">Banned list<\/a><\/td><td>42 named cards. Latest Commander change 2026-02-09.<\/td><td>Validator banned set.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://commanderspellbook.com/about/\" target=\"_blank\" rel=\"noopener\">Commander Spellbook API<\/a><\/td><td><code>find-my-combos<\/code> and the bulk export both work.<\/td><td>Combo checks are run both online and offline.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://edhrec.com/articles/garland-royal-kidnappers-theft-masterclass\" target=\"_blank\" rel=\"noopener\">EDHREC: Garland theft masterclass<\/a>, <a href=\"https://draftsim.com/mtg-monarch-commanders/\" target=\"_blank\" rel=\"noopener\">Draftsim monarch commanders<\/a>, <a href=\"https://www.mtgnexus.com/viewtopic.php?p=1661906\" target=\"_blank\" rel=\"noopener\">MTGNexus brainstorm<\/a><\/td><td>The common build is theft-first. Draftsim ranks Garland low. The MTGNexus thread suggests the black Courts and Azure Fleet Admiral.<\/td><td>Build crown-first, not theft-first. The black Courts are bait that make us the monarch so an opponent takes the crown from us.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://playgroup.gg/commanders/3606/playtest\" target=\"_blank\" rel=\"noopener\">Playgroup: Garland<\/a><\/td><td>About a 23% win rate over 89 games, wins at about turn 10, mostly non-combat damage, high salt.<\/td><td>The deck needs a credible finish (Gray Merchant, Keeper of Keys, stolen beaters). The pregame talk should set expectations to cut salt.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://edhrec.com/articles/wan-shi-tong-librarian-commander-deck-tech\" target=\"_blank\" rel=\"noopener\">EDHREC: Wan Shi Tong deck tech<\/a><\/td><td>Mono-blue has few ways to make opponents search.<\/td><td>Wan Shi Tong goes in the 99 of a Dimir deck, not in the command zone.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://playgroup.gg/commanders/2999-alexios-deimos-of-kosmos\" target=\"_blank\" rel=\"noopener\">Playgroup: Alexios<\/a><\/td><td>About 75% of wins come from commander damage, at about turn 7.<\/td><td>Alexios stays a finding, but not the Bracket 2 demo deck: it is too fast and eliminates players early.<\/td><\/tr><tr><td>2026-11-25<\/td><td><a href=\"https://edhrec.com/articles/iroh-an-avatar-the-last-airbender-commander-deck\" target=\"_blank\" rel=\"noopener\">EDHREC: Iroh deck tech<\/a><\/td><td>Builds give away harmful permanents or play group hug.<\/td><td>Iroh + Coveted Jewel is a gift that changes who the table attacks; the finding is labeled as known-archetype.<\/td><\/tr><tr><td>2026-11-25<\/td><td>Search for Hithlain Rope politics<\/td><td>No relevant results.<\/td><td>Treated as undocumented. Evidence comes from the trace only.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Later entries<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>Hypothesis / question<\/th><th>Command or source<\/th><th>Result<\/th><th>Decision<\/th><\/tr><\/thead><tbody><tr><td>E8<\/td><td>A big punisher gives the opponent a real choice<\/td><td>Review of the shortlist (Rope or Wishclaw + Ob Nixilis)<\/td><td>No. With 10 life and a creature at stake, declining is always right. The rule &quot;a choice counts when more than one answer makes sense&quot; fails.<\/td><td>Added a penalty in <code>search.py<\/code>: a harsh punisher on a gift lowers agency. Ob Nixilis lines fell below the Wan Shi Tong lines.<\/td><\/tr><tr><td>E9<\/td><td>The <code>monarch_control<\/code> facet is correct<\/td><td>Read the Azure Fleet Admiral row in the shortlist<\/td><td>Mis-tag. &quot;Creatures the monarch controls&quot; matched &quot;the monarch controls&quot;.<\/td><td>Anchored the pattern to &quot;the monarch controls enchanted/equipped/CARDNAME&quot;.<\/td><\/tr><tr><td>E10<\/td><td>Ob Nixilis belongs in the Bracket 3 package<\/td><td>Result of E8<\/td><td>It removes choices for the same reason as in E8.<\/td><td>Replaced it with Agent of Treachery, which draws 3 when you control 3 or more permanents you don&#x27;t own. Garland hostages count.<\/td><\/tr><tr><td>E11<\/td><td>The Bracket 3 list has no near-combos<\/td><td><code>mtgfind validate decks/garland-crown-court-b3.txt --bracket 3 --online<\/code>, then the one-card-away list<\/td><td>No full combo. Orcish Bowmasters + Flumph or Requiem Monolith are known infinites, and those cards can come from opponents or from a steal.<\/td><td>Added a Bracket 3 caveat: announce the loop and do not use it.<\/td><\/tr><tr><td>E12<\/td><td>The draw model is sound<\/td><td><code>mtgfind trials ...<\/code> compared to the exact hypergeometric value<\/td><td>Simulated P(bait by turn 6) is 88.5%; exact is 88.1%.<\/td><td>The trial model is good enough for deck decisions. More trials are not necessary: the CIs are \u00b12.5 points.<\/td><\/tr><tr><td>E13<\/td><td>The findings text matches the data<\/td><td>Spellbook index lookups per card<\/td><td>One text was wrong: the &quot;known subpair&quot; flag on the Iroh line came from Iroh + Bowmasters, not from Contested Game Ball.<\/td><td>Corrected <code>results/findings.json<\/code>. Spellbook statements now name the card and the snapshot.<\/td><\/tr><tr><td>E14<\/td><td>Fixture trials equal real trials for the same seed<\/td><td><code>mtgfind demo --fixture<\/code> compared to <code>mtgfind demo<\/code><\/td><td>80.7% against 81.0%. The fixture builder resolved &quot;Sign in Blood&quot; to the adventure card Scheming Silvertongue // Sign in Blood.<\/td><td>The fixture builder now uses the same resolver as the app (exact names first). The results are equal. A regression test was added.<\/td><\/tr><tr><td>E15<\/td><td>The Garland deck is a new strategy<\/td><td>EDHREC commander page for Garland (2,636 decks, fetched 2026-11-25), compared card by card with <code>decks/garland-crown-court-b2.txt<\/code><\/td><td>Mostly no. The crown carousel is Garland&#x27;s own rules text, so every Garland deck plays it. Fealty to the Realm is in 42% of Garland decks, Court of Locthwain in 47%, Hostage Taker in 64% and Ghostly Flicker in 62%. Of 82 nonbasic cards, 30 are in 30% or more of Garland decks, 13 are in 10\u201330%, and 39 are in less than 10% or are not listed. The rare cards are the crown and hot-potato pieces: Azure Fleet Admiral, Thorn of the Black Rose, Archivist of Gondor, Crown of Doom, Contested Game Ball, Wan Shi Tong and Wishclaw Talisman. The common build adds reanimation (Reanimate, Animate Dead, Come Back Wrong); this deck does not. Hithlain Rope is in 66% of Iroh decks, and Contested Game Ball in 7%.<\/td><td>The search scores novelty from Commander Spellbook and global EDHREC rank only. It does not know how often a card is played with a given commander. A per-commander inclusion signal is the next change for the novelty score.<\/td><\/tr><tr><td>E16<\/td><td>A co-play signal changes what the search calls new<\/td><td><code>mtgfind discover --seed 7<\/code> (search-v3). For the top 400 candidates plus the top 40 of each family, EDHREC card and commander pages give the share of real decks that already play the cards together. Novelty drops by up to 75% as that share nears 30%. 150 pages fetched 2026-11-25.<\/td><td>Garland + Fealty (42%) left the shortlist. Iroh + Contested Game Ball (14%) and Iroh + Ghazb\u00e1n Ogre (8%) fell below the top. The first v3 run then ranked lines like Wild Dogs + Iroh + Agent of Treachery first. Iroh is red-white, so Iroh can&#x27;t lead those lines.<\/td><td>Added a color-identity check: a line whose legend can&#x27;t lead it gets the <code>legend_off_identity<\/code> flag and \u22120.25 playability. The new top lines: Hithlain Rope + Wan Shi Tong (0% co-play, Wan Shi Tong leads), Goblin Festival or Sokenzan Renegade + Iroh (under 1%), and Garland + Crown of Gondor or Heart-Shaped Herb (0%). The result is stable under 3 of the 4 weightings. Under the novelty-heavy weighting, the off-identity Iroh triples come back.<\/td><\/tr><tr><td>E17<\/td><td>Iroh + self-moving gifts is a buildable Bracket 2 deck<\/td><td><code>mtgfind trace iroh-wander festival<\/code>; <code>mtgfind validate decks/iroh-wandering-gifts-b2.txt --bracket 2 --online<\/code>; <code>mtgfind trials ... --package decks/iroh-wandering-package.json --n 1000 --seed 7<\/code><\/td><td>Yes. The traces pass 17 checks. Iroh counts gifts when the token trigger resolves, so removal in response shrinks the token. A lost Goblin Festival flip can send it back to its owner. A Festival ping moves Crag Saurian. A tie for most cards stops Sokenzan Renegade. A holder gets 2 Festival pings on average before it moves. The B2 list is legal, has 0 Game Changers and 0 Spellbook combos, and costs about $191. In the trials, Iroh plus a gift is out by turn 6 in 86.4% of games (74.8% if Iroh is removed once; Garland: 81.0% and 41.8%). Across the whole deck it is as standard as the Garland deck (27 of 61 nonland cards in 15% or more of Iroh decks; Garland 26 of 63), but 10 of its 16 gifts are not on EDHREC&#x27;s Iroh page.<\/td><td>New featured deck: Iroh&#x27;s Wandering Gifts (B2 and B3). The first draft had three errors that the checks caught: Wishclaw Talisman and Despark are not in Iroh&#x27;s colors, and Cathars&#x27; Crusade is one card away from many sacrifice-outlet infinites (replaced by Glorious Anthem). The trial model now reads deck colors from the commander&#x27;s mana cost (it assumed blue-black before). Garland trial results are unchanged.<\/td><\/tr><tr><td>E18<\/td><td>Plain names make the shared page clearer<\/td><td>Review of the shared page with the operator<\/td><td>The deck names (&quot;Iroh&#x27;s Wandering Gifts&quot;, &quot;Garland&#x27;s Crown Court&quot;) and the finding titles read as marketing, and the landing page described one deck instead of the system.<\/td><td>Decks are named after their commanders. The deck files are now <code>decks/iroh-tea-master-*<\/code> and <code>decks/garland-royal-kidnapper-*<\/code> (earlier rows in this log use the old file names). Finding titles and summaries state what happens at the table. The Overview page now describes the system, then the decks, with the Iroh deck featured. The trial numbers are unchanged.<\/td><\/tr><tr><td>E19<\/td><td>The Iroh deck can win in a reasonable number of turns<\/td><td><code>mtgfind clock<\/code> (new, clock-v1): 1,000 seeded games per list, three opponents at 40 life, a goldfish and a &quot;table&quot; scenario (a blocker each turn, removal on the commander once and on our largest creature on turns 8 and 11, gifts sent back half the time)<\/td><td>Version 1 of the Iroh B2 list: median turn all three dead 12 (goldfish) and 14 (table); all dead by turn 12 with pressure in 18% of games. Garland B2: 13 and 17+ (94% no kill by turn 16 with pressure). The model omits Keeper of Keys, monarch draws and Mob Rule, so it undercounts Garland more.<\/td><td>Tuned Iroh with five swaps, all with 0% EDHREC co-play: Goblin Cadets \u2192 Shared Animosity, Drooling Ogre \u2192 Throne of the God-Pharaoh, Intangible Virtue \u2192 Rally the Ranks (Virtue&#x27;s vigilance stops tokens from tapping for Throne), Monologue Tax \u2192 Honor of the Pure, Avarice Totem \u2192 Warleader&#x27;s Call. Result: 11 (goldfish) and 13 (table); all dead by turn 12 with pressure in 43% (95% CI 39\u201346%). Still legal, 0 Game Changers, 0 combos; Storm Herd added to &quot;never add&quot; (near-infinite with Warleader&#x27;s Call). B3: Smothering Tithe now replaces Inspiring Overseer. Garland is not tuned yet.<\/td><\/tr><tr><td>E20<\/td><td>The trials count every cast theme card<\/td><td>Compare the simulated &quot;has bait by turn 6&quot; rate with the exact hypergeometric value for each deck<\/td><td>No. Iroh B2 gave 85.7% against an exact 88.1%. Theme cards cast in the mana-rock step (Coveted Jewel) or in the final cast step were not counted as cast.<\/td><td>Fixed in <code>trials.py<\/code>. Iroh B2 now gives 87.5% against 88.1%. Assembly by turn 6 is now 83.8% for Iroh B2 (71.8% with Iroh removed once) and 83.2% for Garland B2 (42.5%). The web UI prints both values instead of a fixed &quot;matches&quot; sentence.<\/td><\/tr><tr><td>E21<\/td><td>The Garland deck can win in a reasonable number of turns<\/td><td><code>mtgfind clock<\/code> after adding rules for the crown (extra draws, crown moves between opponents with a new hostage), Keeper of Keys, Court of Ambition, Grave Venerations, Bident of Thassa and fliers<\/td><td>With the full model, Garland B2 gave a median turn all three dead of 12 (goldfish) and 17 (table), with no kill by turn 16 in 56% of table games. Its few large attackers lose half their damage to one blocker.<\/td><td>Swapped seven cards for drains and evasion, none on EDHREC&#x27;s Garland page: Underworld Dreams and Fate Unraveler (the crown&#x27;s extra cards cost life), Megrim and Painful Quandary (with Court of Ambition, both answers cost life), Palace Siege, Exsanguinate and Whispersilk Cloak. Out: Thieving Skydiver, Phyrexian Rager, Plaguecrafter, Treasure Cruise, Wishclaw Talisman, Negate, Reality Shift. Result: 12 (goldfish) and 15 (table); no kill by turn 16 in 31%. Still legal, 0 Game Changers, 0 combos; Peer into the Abyss added to &quot;never add&quot;. A &quot;less punishing&quot; swap is listed for tables that dislike life-loss taxes. The B3 package was rebuilt around the new list. Iroh is unchanged under the new rules (11 and 13).<\/td><\/tr><\/tbody><\/table><\/div>", "sources_html": "<h2>Sources (retrieved 2026-11-25)<\/h2>\n<div class=\"tablewrap\"><table><thead><tr><th>URL<\/th><th>Retrieved<\/th><th>What it established<\/th><\/tr><\/thead><tbody><tr><td>https://magic.wizards.com/en/formats/commander<\/td><td>2026-11-25<\/td><td>Bracket &quot;Players expect&quot; text, the minimum turns per bracket (9/8/6/4/any), the Game Changers limits (0/0/3/unlimited/unlimited), the beta status, and the 53-card Game Changers list by color (entries updated 2026-02-09).<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/introducing-commander-brackets-beta<\/td><td>2026-11-25<\/td><td>2025-02-11. The original per-bracket rules for MLD, extra turns, two-card combos and tutors, and the MLD definition.<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/commander-brackets-beta-update-april-22-2025<\/td><td>2026-11-25<\/td><td>2025-04-22. No rule changes. The Game Changers list grew. Trouble in Pairs and Trinisphere were removed from it.<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/commander-brackets-beta-update-october-21-2025<\/td><td>2026-11-25<\/td><td>2025-10-21. The current bracket text and turn guidance. Tutor limits removed. Bracket 2 no longer tied to precons. 10 Game Changers removed (list became 51).<\/td><\/tr><tr><td>https://bsky.app/profile/wachelreeks.com/post/3m3ptspaivs27 (via public.api.bsky.app)<\/td><td>2026-11-25<\/td><td>The Oct 2025 summary graphic, linked from the official 2025-10-21 article. Per bracket: NO MLD, NO chaining extra turns, NO 2-card combos (B3: before turn 6), and B1 thematic exceptions.<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/commander-brackets-beta-update-february-9-2026<\/td><td>2026-11-25<\/td><td>2026-02-09, the newest bracket article. No bracket changes. Farewell and Biorhythm added to Game Changers. Lutri is not a Game Changer.<\/td><\/tr><tr><td>https://magic.wizards.com/en/banned-restricted-list<\/td><td>2026-11-25<\/td><td>The Commander banned list: 42 named cards, plus Lutri (banned as a companion only), the Conspiracy cards, the ante cards, and the offensive-cards list.<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/commander-banned-and-restricted-february-9-2026<\/td><td>2026-11-25<\/td><td>The latest Commander B&amp;R change: Biorhythm unbanned, and Lutri unbanned except as a companion. No bans.<\/td><\/tr><tr><td>https://magic.wizards.com/en/news/announcements/banned-and-restricted-{march-23,may-18,june-29,august-10,october-12}-2026<\/td><td>2026-11-25<\/td><td>No Commander banned-list changes after 2026-02-09. On 2026-10-12, &quot;Commander: No changes&quot;.<\/td><\/tr><tr><td>https://magic.wizards.com/en/sitemap.xml<\/td><td>2026-11-25<\/td><td>No bracket or Game Changers article after 2026-02-09.<\/td><\/tr><tr><td>https://magic.wizards.com/en/rules<\/td><td>2026-11-25<\/td><td>The links to the current Comprehensive Rules (20261106).<\/td><\/tr><tr><td>https://media.wizards.com/2026/downloads/MagicCompRules%2020261106.txt<\/td><td>2026-11-25<\/td><td>The CR text, effective 2026-11-06. Saved as MagicCompRules.txt (sha256 524f5195...b829). Rules 903, 702.124 and 702.139.<\/td><\/tr><tr><td>https://backend.commanderspellbook.com/ and /schema/<\/td><td>2026-11-25<\/td><td>The Spellbook API endpoints, request and response schemas, usage policy, and bulk-export URLs.<\/td><\/tr><tr><td>https://backend.commanderspellbook.com/find-my-combos (POST)<\/td><td>2026-11-25<\/td><td>Tested. Returned 1 included combo (4131-4235) for the 3-card list.<\/td><\/tr><tr><td>https://backend.commanderspellbook.com/estimate-bracket (POST)<\/td><td>2026-11-25<\/td><td>Tested. Returned bracketTag R and per-card Game Changer, MLD and extra-turn flags.<\/td><\/tr><tr><td>https://backend.commanderspellbook.com/variants/?q=card=&quot;Basalt Monolith&quot;<\/td><td>2026-11-25<\/td><td>Tested. Search by card name returned 298 variants.<\/td><\/tr><tr><td>https://json.commanderspellbook.com/variants.json.gz (HEAD)<\/td><td>2026-11-25<\/td><td>The bulk export exists. 33 MB, last-modified 2026-11-25.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Unverified or caveats:<\/p>\n<ul><li>The official format page does not restate the per-bracket MLD, extra-turn and combo rules in text. They come from the 2025-02 article and the Oct 2025 CFP graphic, and later articles did not revoke them.<\/li><li>The next general B&amp;R date (2026-11-30) comes only from third-party sites.<\/li><li>The Spellbook <code>bracketTag<\/code> letters are Spellbook&#x27;s own classification. They are not WotC bracket numbers.<\/li><\/ul>"};
</script>
<script>
const D = window.MTG;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => (x * 100).toFixed(1) + "%";
const CARDS = new Map();

// Theme toggle (persisted per viewer; works without storage)
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};

function img(card, size = "normal", cls = "cardimg") {
  if (!card || card.missing) return `<div class="cardimg missing">${esc(card?.name || "?")}</div>`;
  CARDS.set(card.name, card);
  const f = (card.images || [])[0] || {};
  const src = f[size] || f.normal;
  if (!src) return `<div class="cardimg missing">${esc(card.name)}</div>`;
  return `<img class="${cls}" loading="lazy" src="${esc(src)}" alt="${esc(card.name)}" data-card="${esc(card.name)}">`;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-card]");
  if (!el) return;
  const c = CARDS.get(el.dataset.card);
  if (!c) return;
  const faces = (c.images || []).map(f => `<img class="cardimg" style="cursor:default" src="${esc(f.large || f.normal)}" alt="${esc(c.name)}">`).join("");
  $("#modal-body").innerHTML = `
    <div class="faces">${faces || img(c)}</div>
    <div>
      <h2 style="margin-top:0">${esc(c.name)}</h2>
      <div class="chips"><span class="chip">${esc(c.mana_cost || "")}</span><span class="chip">${esc(c.type_line)}</span>${c.pt ? `<span class="chip">${esc(c.pt)}</span>` : ""}${c.game_changer ? `<span class="badge bad">Game Changer</span>` : ""}</div>
      <p class="oracle">${esc(c.oracle_text)}</p>
      ${c.role ? `<p><b>Role:</b> ${esc(c.role)}</p>` : ""}
      ${(c.rulings || []).length ? `<h3>Recent rulings</h3><ul>${c.rulings.map(r => `<li><span class="muted">${esc(r.published_at)}</span> ${esc(r.comment)}</li>`).join("")}</ul>` : ""}
      <p class="muted">EDHREC rank ${c.edhrec_rank ?? "–"} · ${c.price_usd != null ? "$" + c.price_usd.toFixed(2) + " (Scryfall snapshot)" : "no price"} · <a href="${esc(c.scryfall_uri)}" target="_blank" rel="noopener">Scryfall</a></p>
      <p class="muted" style="font-size:.75rem">Art by ${esc((c.images[0] || {}).artist || "unknown")}. Card images © Wizards of the Coast, served by Scryfall.</p>
    </div>`;
  $("#modal").showModal();
});

// ---------- views ----------
const VIEWS = {
  overview: { label: "Overview", render: overview },
  method: { label: "Methodology", render: method },
  findings: { label: "Findings", render: findings },
  deck: { label: "Deck", render: deck },
  experiments: { label: "Experiments", render: experiments },
  log: { label: "Evidence log", render: log },
};
function go(v) {
  if (!VIEWS[v]) v = "overview";
  $("#nav").innerHTML = Object.entries(VIEWS).map(([k, x]) => `<button data-v="${k}" ${k === v ? 'aria-current="page"' : ""}>${x.label}</button>`).join("");
  $("#app").innerHTML = VIEWS[v].render();
  if (location.hash.slice(1).split("/")[0] !== v) history.replaceState(null, "", "#" + v);
  wireCharts();
  const sub = location.hash.split("/")[1], el = sub && document.getElementById(sub);
  if (el) el.scrollIntoView(); else window.scrollTo({ top: 0 });
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (b) { location.hash = b.dataset.v; } });
window.addEventListener("hashchange", () => go(location.hash.slice(1).split("/")[0]));

// Hero parallax, vertical only: the art starts at its top edge and moves up a little faster than the page.
const calm = matchMedia("(prefers-reduced-motion: reduce)");
function heroMove() {
  const w = document.querySelector(".hero .bgwrap");
  if (!w || calm.matches) return;
  const r = w.parentElement.getBoundingClientRect();
  const s = Math.max(-r.height * 0.3, Math.min(0, (r.top - 80) * 0.3));
  w.style.transform = `translate3d(0, ${s}px, 0)`;
}
window.addEventListener("scroll", heroMove, { passive: true });

function evidenceBadge(e) { return `<span class="badge ${e === "rules-checked" ? "ok" : e === "conditional" ? "warn" : "neutral"}">${esc(e)}</span>`; }

const killTurn = r => r.median_kill_all_turn > r.turns_simulated ? r.turns_simulated + "+" : r.median_kill_all_turn;
function overview() {
  const c = D.discovery.counts || {}, n = x => (x ?? 0).toLocaleString();
  const F = D.decksets[0], fc = F.meta.commander_card, art = ((fc.images || [])[0] || {}).art_crop;
  const funnel = [
    [n(c.pool), "legal cards read"], [n(c.tagged), "cards that give or want something"], [n(c.pairs), "pairs scored"],
    [n(D.discovery.community?.checked), "lines checked against real decks"], [Object.keys(D.traces).length, "lines played out against the rules"], [D.decksets.length, "decks built"], ["1,000", "test games per list"],
  ];
  const deckCard = (S, featured) => {
    const v = S.decks.b2.validation, ck = S.decks.b2.clock, cc = S.meta.commander_card, a = ((cc.images || [])[0] || {}).art_crop;
    const line = D.findings.findings.find(f => f.in_deck && Object.values(S.meta.lists).some(l => l.includes(f.in_deck)));
    return `<article class="deckcard${featured ? " featured" : ""}">
      ${a ? `<img src="${esc(a)}" alt="">` : ""}
      <div>
        <div class="chips" style="margin-bottom:4px">${featured ? `<span class="badge ok">Featured · newest</span>` : ""}<span class="badge neutral">${esc(S.meta.colors)}</span><span class="badge neutral">Bracket 2 + Bracket 3 package</span></div>
        <h3>${esc(S.meta.name)}</h3>
        ${line ? `<p><b>${esc(line.title)}.</b> ${esc(line.table_story)}</p>` : ""}
        <div class="kv">
          <div><b>${v.format_legal ? "Legal" : "Not legal"}</b><span>${v.card_count} cards</span></div>
          <div><b>${v.game_changers.length}</b><span>Game Changers</span></div>
          <div><b>${v.spellbook.included.length}</b><span>combos</span></div>
          ${ck ? `<div><b>Turn ${killTurn(ck.table)}</b><span>median turn all 3 opponents are dead (with blockers and removal)</span></div>
          <div><b>Turn ${killTurn(ck.goldfish)}</b><span>same, with no interaction</span></div>` : ""}
          <div><b>$${Math.round(v.price_estimate_usd.total)}</b><span>approximate price</span></div>
        </div>
        ${featured && S.meta.novelty ? `<p class="muted" style="font-size:.88rem">${esc(S.meta.novelty.summary)}</p>` : ""}
        <p style="margin-bottom:0"><a class="btn" href="#deck" onclick="setSel='${S.id}'">See the deck</a></p>
      </div></article>`;
  };
  return `
  <section class="hero">
    ${art ? `<div class="bgwrap"><img class="bg" src="${esc(art)}" alt=""></div>` : ""}<div class="shade"></div>
    <div class="content">
      <h1>New Commander decks, curated by AI and tested in 1,000 games</h1>
      <p>This system reads every Commander-legal card and looks for card combinations that are new, fun to play and strong enough to win. It checks each idea against real decklists, the Comprehensive Rules and thousands of sample games. Then it builds full Bracket 2 decks around the best ones, each with a Bracket 3 upgrade.</p>
      <p style="margin-top:12px"><a class="btn" style="background:#e0c27a;color:#1b1915;border:none" href="#method">How it works</a> <a class="btn" href="#deck" onclick="setSel=D.decksets[0].id">See the ${esc(F.meta.commander.split(",")[0])} deck</a></p>
    </div>
    <div class="credit">${esc(fc.name)} — art by ${esc(((fc.images || [])[0] || {}).artist || "")}</div>
  </section>
  <div class="pillars">
    <div><b>New</b><span>Each idea is checked against real decklists on EDHREC. Pairings that many decks already play score lower.</span></div>
    <div><b>Fun</b><span>The search favors cards that make things happen at the table: permanents that change hands, a crown that moves, choices for every player.</span></div>
    <div><b>Viable</b><span>Every deck is played 1,000 times in a seeded model, with and without blockers and removal, to see when it wins.</span></div>
    <div><b>Fair</b><span>Bracket 2: no Game Changers, no infinite combos, no locks. Cards one piece away from a combo go on a "never add" list.</span></div>
  </div>
  <h2>How the system works</h2>
  <ol class="funnel">${funnel.map(([v, l]) => `<li><b>${v}</b><span>${esc(l)}</span></li>`).join("")}</ol>
  <p class="muted">Each step narrows the field. The full method, with examples, is on the <a href="#method">Methodology</a> page.</p>
  <h2>Decks built so far</h2>
  <div class="decklist">${D.decksets.map((S, i) => deckCard(S, i === 0)).join("")}</div>
  <section class="panel"><h3 style="margin-top:0">${D.findings.findings.length} findings behind the decks</h3>
    <p class="muted" style="margin-top:0">Each finding is one interaction, with who decides what and how the table can stop it. "Rules-checked" means the line was played out step by step against the rules.</p>
    ${D.findings.findings.map(x => `<div class="frow">
      <div class="mini">${x.cards.slice(0, 3).map(c => img(c, "normal", "")).join("")}</div>
      <div><a href="#findings/${x.id}"><b>${esc(x.title)}</b></a><br><span class="muted" style="font-size:.85rem">${x.cards.map(c => esc(c.name)).join(" + ")}</span> ${evidenceBadge(x.evidence)}</div></div>`).join("")}
  </section>
  <p class="muted" style="font-size:.8rem">Built ${esc(D.built)} · Scryfall snapshot ${esc(D.snapshot.oracle_cards?.file)} · Commander Spellbook bulk 2026-11-25 · Comprehensive Rules effective 2026-11-06.</p>`;
}

function method() {
  const c = D.discovery.counts || {}, w = D.discovery.weights || {}, n = x => (x ?? 0).toLocaleString();
  const S = D.decksets[0], v = S.decks.b2.validation, t = S.decks.b2.trials;
  const step = (num, unit, title, body) => `<li><div class="num-big">${num}<span>${unit}</span></div><div><h3>${title}</h3>${body}</div></li>`;
  const scores = [
    ["agency", "Agency", "Does each opponent get a real choice? Is \"no\" a fair answer too? A choice where one answer always loses scores low."],
    ["memorable", "Memorable", "Will the table talk about it after the game? A card that changes hands, a coin flip, a crown that moves."],
    ["novelty", "New", "Do real decks already play these cards together? Lines that most decks already run score low."],
    ["playability", "Playable", "Cheap, in the commander's colors, and it works without a perfect setup."],
    ["pacing", "Pacing", "Turns stay short. No loops, no locks, nothing that makes three players watch one."],
  ];
  return `<h2>Methodology</h2>
  <section class="panel"><p style="font-size:1.05rem;margin-top:0"><b>The goal:</b> find card combinations that are new, fun to play and strong enough to win, and build full decks around them. "Fun" here means that things happen at the table: cards change hands, players make real decisions, and nobody sits out. The decks stay in Bracket 2, with no infinite combos and no locks, and each one has a Bracket 3 upgrade.</p>
  <p style="margin-bottom:0">The search works like a deckbuilder who looks for enablers and payoffs, but it reads every legal card. Then it checks its own ideas three ways: against real decklists, against the rules, and against sample games.</p></section>
  <ol class="steps">
    ${step(n(c.pool), "cards", "Start with every legal card", `<p>Every Commander-legal card from Scryfall (snapshot of 2026-11-24), with its Oracle text, rulings, price and Game Changer status.</p>`)}
    ${step(n(c.tagged), "cards", "Read what each card does at the table", `<p>The search reads the rules text and marks what a card <i>gives</i> to the table and what it <i>wants</i>. For example:</p>
      <ul><li><b>Gives:</b> "an opponent gains control of", "you become the monarch", "each opponent may search", "each player draws".</li>
      <li><b>Wants:</b> "permanents you own that your opponents control", "whenever an opponent searches", "whenever a creature deals combat damage to you".</li></ul>
      <p>It also marks drawbacks ("deals damage to you", "sacrifice it"), so a card that only hurts its new holder does not count as a gift.</p>`)}
    ${step(n(c.pairs), "pairs", "Match givers with payoffs", `<p>Each card that gives something is paired with cards that want it: Iroh with permanents that leave your control, Wan Shi Tong with cards that make opponents search. Then the best pairs get a third card, for ${n(c.triples)} three-card lines.</p>`)}
    ${step("5", "scores", "Score each line on five questions", `<div class="tablewrap"><table><thead><tr><th>Question</th><th class="num">Weight</th><th>What it asks</th></tr></thead><tbody>
      ${scores.map(([k, l, d]) => `<tr><td><b>${l}</b></td><td class="num">${Math.round((w[k] || 0) * 100)}%</td><td>${d}</td></tr>`).join("")}</tbody></table></div>
      <p>The weights are a judgment call, so the search runs again with ${Object.keys(D.discovery.weight_sensitivity || {}).length} different weightings. A line that ranks high under only one of them is weak evidence.</p>`)}
    ${step(n(D.discovery.community?.checked), "lines", "Ask real decks: is this already known?", `<p>For the top lines, the search reads EDHREC's card and commander pages. If 30% or more of the decks that play card A also play card B, the pair counts as known, and its "new" score drops by up to 75%.</p>
      <p>Example: 42% of Garland decks already play Fealty to the Realm, so that line fell out of the top 12. Goblin Festival is not on EDHREC's Iroh page at all.</p>
      <p>The search also checks that a legend in the line can lead it: Iroh is red-white, so a line with a green card cannot be an Iroh line.</p>`)}
    ${step(Object.keys(D.traces).length, "traces", "Play the best lines out, step by step", `<p>Each top line is played out against the Comprehensive Rules (effective 2026-11-06) and the card rulings, three ways:</p>
      <ul><li><b>A cooperative table:</b> players use the gifts and chase the crown.</li><li><b>A table that says no:</b> players refuse the bait, or send the gift back.</li><li><b>A response:</b> removal at instant speed, at the worst moment.</li></ul>
      <p>Example: Iroh counts your gifts when the token trigger <i>resolves</i>. So an opponent who kills a gift in response makes the token smaller. The deck guide tells the table this.</p>`)}
    ${step("100", "cards", "Build the deck and check it", `<p>The deck is built around the best line that survived. A validator then checks it:</p>
      <ul><li>Format: 100 cards, singleton, color identity, banned list.</li>
      <li>Bracket: ${v.game_changers.length} Game Changers in Bracket 2. No two-card infinite combos (checked against Commander Spellbook), no mass land denial, no extra turns.</li>
      <li>One card away: cards that would complete a combo go on a "never add" list.</li></ul>`)}
    ${step("1,000", "games", "Shuffle and goldfish", `<p>Each list is shuffled and played alone for 1,000 seeded games, with mulligans, land drops, tapped lands and mana rocks. For the ${esc(S.meta.commander.split(",")[0])} deck, ${esc(S.meta.commander.split(",")[0])} and at least one theme card are on the battlefield by turn 6 in ${pct(t.baseline.turn6.plausible_assembly[0])} of games. If the commander is killed once, that drops to ${pct(t.disruption.turn6.plausible_assembly[0])}.</p>`)}
    ${step("1,000", "games", "Play it to a win", `<p>A second model adds combat. Each turn the deck attacks three opponents at 40 life with what it has: creatures, tokens, anthems, drains and one-turn finishers. It runs twice: once with no interaction, and once with a blocker every turn, two removal spells and opponents undoing the deck's plan.</p>
      <p>The ${esc(S.meta.commander.split(",")[0])} deck kills all three opponents by a median of turn ${killTurn(S.decks.b2.clock.goldfish)} alone, and turn ${killTurn(S.decks.b2.clock.table)} with that pressure. It almost never wins before turn 8, which fits Bracket 2.${S.meta.clock_note ? " " + esc(S.meta.clock_note) : ""}</p>`)}
    ${step("You", "", "Playtest at a real table", `<p>Only a real table can say if a line is fun. Each deck comes with a pregame speech and a playtest card that asks each opponent: would you play against this again?</p>`)}
  </ol>
  <div class="two">
    <section class="panel"><h3 style="margin-top:0">What the search threw out</h3><p>${n(D.discovery.rejected?.length)} lines were rejected before scoring. Examples:</p>
      <ul>${D.findings.dropped.slice(0, 3).map(d => `<li><b>${d.cards.map(esc).join(" + ")}</b>: ${esc(d.reason)}</li>`).join("")}</ul></section>
    <section class="panel"><h3 style="margin-top:0">Limits</h3><ul>
      <li>The search reads card text with patterns. It can miss an interaction that no pattern describes. A random sample of low-ranked pairs is checked in each run to find some of these misses.</li>
      <li>"New" is judged pair by pair. A new card inside a known deck type still counts as new: Iroh decks already give things away, but not these things.</li>
      <li>The sample games test mana and draws only. They do not play combat, opponents' boards or politics.</li>
      <li>The scores rank ideas. They do not replace a playtest.</li></ul></section>
  </div>`;
}

// ---------- charts ----------
function ciChart(id, title, groups, series) {
  // groups: [{label, values:[{v, lo, hi}] per series]}; one y axis 0..100%
  const W = 560, H = 230, L = 44, B = 34, T = 14, R = 8;
  const gw = (W - L - R) / groups.length, bw = Math.min(46, (gw - 24) / series.length);
  const y = v => T + (H - T - B) * (1 - v);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for (const t of [0, .25, .5, .75, 1]) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t * 100}%</text>`;
  groups.forEach((g, gi) => {
    const x0 = L + gi * gw + (gw - series.length * bw - (series.length - 1) * 2) / 2;
    g.values.forEach((d, si) => {
      const x = x0 + si * (bw + 2), top = y(d.v), h = y(0) - top;
      s += `<path d="M${x},${y(0)} V${top + 4} Q${x},${top} ${x + 4},${top} H${x + bw - 4} Q${x + bw},${top} ${x + bw},${top + 4} V${y(0)} Z" fill="var(${series[si].c})"/>`;
      s += `<line x1="${x + bw / 2}" x2="${x + bw / 2}" y1="${y(d.hi)}" y2="${y(d.lo)}" stroke="var(--text)" stroke-width="1.5"/><line x1="${x + bw / 2 - 5}" x2="${x + bw / 2 + 5}" y1="${y(d.hi)}" y2="${y(d.hi)}" stroke="var(--text)" stroke-width="1.5"/><line x1="${x + bw / 2 - 5}" x2="${x + bw / 2 + 5}" y1="${y(d.lo)}" y2="${y(d.lo)}" stroke="var(--text)" stroke-width="1.5"/>`;
      s += `<text x="${x + bw / 2}" y="${Math.max(12, y(d.hi) - 5)}" text-anchor="middle" font-size="11" fill="var(--text-2)">${(d.v * 100).toFixed(0)}%</text>`;
      s += `<rect class="hit" x="${x - 2}" y="${T}" width="${bw + 4}" height="${H - T - B}" fill="transparent" data-tip="${esc(g.label)} · ${esc(series[si].label)}: ${pct(d.v)} (95% CI ${pct(d.lo)}–${pct(d.hi)})"/>`;
    });
    s += `<text x="${L + gi * gw + gw / 2}" y="${H - 12}" text-anchor="middle" font-size="12" fill="var(--text-2)">${esc(g.label)}</text>`;
  });
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  return `<div class="chart" id="${id}"><h3 style="margin:0 0 2px">${esc(title)}</h3><div class="legend">${series.map(x => `<span style="--c:var(${x.c})">${esc(x.label)}</span>`).join("")}</div>${s}<div class="tip"></div></div>`;
}
function wireCharts() {
  document.querySelectorAll(".chart").forEach(ch => {
    const tip = $(".tip", ch);
    ch.querySelectorAll(".hit").forEach(r => {
      r.addEventListener("mousemove", e => { const b = ch.getBoundingClientRect(); tip.textContent = r.dataset.tip; tip.style.left = (e.clientX - b.left) + "px"; tip.style.top = (e.clientY - b.top) + "px"; tip.style.opacity = 1; });
      r.addEventListener("mouseleave", () => tip.style.opacity = 0);
    });
  });
}
const tri = a => ({ v: a[0], lo: a[1][0], hi: a[1][1] });

  for (const S of D.decksets) for (const [dn, t] of [["B2", S.decks.b2.trials], ["B3", S.decks.b3.trials]]) for (const sc of ["baseline", "disruption"]) for (const tn of ["turn6", "turn8"]) {

    <p class="muted">Same seeds for every deck and scenario. Modeled: mulligans (keep 2–5 lands, one free mulligan, then London), tapped lands, colored sources, mana rocks, the commander with tax, simple draw spells. Not modeled: opponents' boards, combat, counterspells, monarch draws. "Removed once" removes the commander on the first turn from turn 5 on that it is on the battlefield. "Bait" is the deck's theme package: wandering gifts for Iroh, crown bait for Garland.</p>
    ${D.decksets.map((S, i) => { const SER = [{ label: "no disruption", c: "--series-1" }, { label: S.meta.trial_removed_label, c: "--series-2" }], n = S.meta.commander.split(",")[0];

    <h3>Table view</h3><div class="tablewrap"><table><thead><tr><th>Deck</th><th>Scenario</th><th>Turn</th><th class="num">Commander out</th><th class="num">Has bait</th><th class="num">Assembled (95% CI)</th><th class="num">6+ lands</th><th class="num">Spells cast</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    <h3>Exact draw math (cross-check, ${esc(D.decksets[0].meta.commander.split(",")[0])} deck, B2)</h3><ul>${Object.entries(t2.exact).map(([k, v]) => `<li>${esc(k)}: <b>${pct(v)}</b></li>`).join("")}</ul>
    <p class="muted">Sanity check on the draw model: the simulated rate of having seen a bait piece by turn 6 is ${pct(t2.baseline.turn6.has_bait_piece[0])}; the exact value with no mulligans is ${pct(Object.values(t2.exact)[1])}. Mulligans to six or five cards explain a small gap.</p>
  </section>
  <h2>Clock: how fast each deck wins</h2>
  <section class="panel" id="clock"><p class="muted">1,000 seeded games per list. The deck plays alone against three opponents at 40 life: creatures attack every turn after they enter, damage goes to the opponent with the lowest life, and the deck's own engine runs (Iroh's tokens and gifts, Brand, anthems, Throne of the God-Pharaoh, Akroma's Will; Garland's hostages, theft, the crown and its extra cards, Keeper of Keys, Court of Ambition, the draw and discard punishers, Gray Merchant and Exsanguinate). "With pressure" adds a blocker on the largest attacker without flying every turn, removal on the commander once and on the largest creature on turns 8 and 11, the crown moving half the time, and, for Iroh, gifts sent back half the time. Not modeled: opponents attacking us or each other, politics, and cards without a rule in the model (for example Mob Rule and counterspells).</p>
    <div class="two">${D.decksets.map((S, i) => { const c = S.decks.b2.clock; if (!c) return ""; const n = S.meta.commander.split(",")[0];
      const g = [10, 12, 14].map(T => ({ label: "by turn " + T, values: [tri(c.goldfish["all_dead_by_turn" + T]), tri(c.table["all_dead_by_turn" + T])] }));
      return ciChart("k" + i, `${n} B2: all three opponents dead`, g, [{ label: "no interaction", c: "--series-1" }, { label: "with pressure", c: "--series-2" }]); }).join("")}</div>
  </section>
  <h2>Rules traces</h2><p class="muted">Each trace is a starting state and an ordered list of actions. It runs a cooperative branch, a rational refusal, and a disruption at a legal timing window, then asserts the resulting state. Rule citations are from the Comprehensive Rules effective 2026-11-06.</p>
  ${Object.entries(D.traces).map(([k, t]) => `<details class="trace" id="trace-${k}"><summary>${esc(t.name)} ${evidenceBadge(t.status)}</summary><div class="body">
    <div class="mini" style="margin-bottom:8px">${t.cards.map(n => { const c = findCard(n); return c ? img(c, "normal", "") : ""; }).join("")}</div>
    ${t.branches.map(b => `<h3>${esc(b.branch)}</h3><ul class="asserts">${(b.asserts || []).map(a => `<li><span class="${a.ok ? "y" : "n"}">${a.ok ? "✓" : "✗"}</span> ${esc(a.check)}</li>`).join("")}</ul><pre class="log">${esc((b.log || []).join("\n"))}</pre>`).join("")}
    <p class="muted"><b>Limitations:</b> ${t.limitations.map(esc).join(" · ")}</p></div></details>`).join("")}
  <h2>Static search</h2>
  <section class="panel"><p class="muted">Pool ${disc.counts.pool.toLocaleString()} Commander-legal cards · ${disc.counts.tagged.toLocaleString()} tagged · ${disc.counts.pairs.toLocaleString()} pairs · ${disc.counts.triples} triples · stop: ${esc(disc.stop_reason)} · ${disc.elapsed_s}s · seed ${disc.seed} · ${disc.rejected.length} rejected (false synergy or risk flags)</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Cards</th><th>Family</th><th class="num">Agency</th><th class="num">Memorable</th><th class="num">Novelty</th><th class="num">Playable</th><th class="num">Pacing</th><th class="num" title="Share of real decks (EDHREC) that already play these cards together">Co-play</th><th>Commander</th><th class="num">Total</th></tr></thead><tbody>
    ${disc.shortlist.map((c, i) => `<tr><td>${i + 1}</td><td><div class="mini">${c.card_objs.map(x => img(x, "normal", "")).join("")}</div>${c.cards.map(esc).join(" + ")} ${c.flags.map(f => `<span class="badge warn">${esc(f)}</span>`).join(" ")}</td><td>${esc(c.family)}</td>${["agency", "memorable", "novelty", "playability", "pacing"].map(k => `<td class="num">${c.scores[k].toFixed(2)}</td>`).join("")}<td class="num">${c.evidence?._community ? pct(c.evidence._community.coplay) : "–"}</td><td>${esc((c.evidence?._identity?.leaders || []).join(", ") || "another commander")}</td><td class="num"><b>${c.total.toFixed(3)}</b></td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.85rem">Co-play is the share of real decks on EDHREC that already play these cards together (for a triple: the core pair or the median pair, whichever is higher). The novelty score drops by up to 75% as co-play nears 30%. The Commander column names a legend in the line whose color identity covers every card.</p>
    <h3>Weight sensitivity (top 5 per weighting)</h3><div class="tablewrap"><table><tbody>${Object.entries(disc.weight_sensitivity).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${v.map(esc).join("<br>")}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted">The static pass is a lead generator. The findings above are ranked after traces and review. The reviewed scores and the reason for each change are on the Findings page.</p>
  </section>`;
}
function findCard(n) {
  for (const f of D.findings.findings) for (const c of f.cards) if (c.name === n) return c;
  for (const s of D.decksets) for (const dk of Object.values(s.decks)) for (const g of dk.groups) for (const c of g.cards) if (c.name === n) return c;
  return null;
}
function log() { return `<h2>Evidence and experiment log</h2><section class="panel">${D.log_html}</section><h2>Sources</h2><section class="panel">${D.sources_html}</section>`; }

go(location.hash.slice(1).split("/")[0] || "overview");
</script>
